name: Coolify set env

# Manually-triggered ops helper: set a single Coolify env var on the NEXUS app
# using the already-stored COOLIFY_* secrets.
# Used to flip feature flags (e.g. SELF_REGISTRATION_ENABLED) without SSH/UI.
#
# OPS-N03 (audyt 22.09.2026): `redeploy` jest domyślnie `false`. Do 09.2026
# domyślne `true` wołało webhook Coolify WPROST — budowa HEAD-a maina z
# pominięciem bramki DEP-01 (zielone „CI Gate”), smoke testu, deep health
# i kontroli migracji. Teraz `redeploy=true` uruchamia workflow „Deploy”
# (`force_rebuild` = `is_buildtime`), który przechodzi przez wszystkie bramki.
# Kilka zmiennych naraz: ustaw je z `redeploy=false`, a na końcu jeden Deploy.
# Deploy przebudowuje tylko wtedy, gdy zmienna jest nowsza niż ostatnie
# wdrożenie albo zmienił się kod obrazu (18.10.2026, `deploy_needed.py`), więc
# Deploy po wdrożeniu, które zmienne już zabrało, niczego nie restartuje.
on:
  workflow_dispatch:
    inputs:
      key:
        description: "Env var name"
        required: true
      value:
        description: "Env var value (zostaw puste, gdy używasz value_from_secret)"
        required: false
        default: ""
      value_from_secret:
        description: "Nazwa sekretu repo, z którego wziąć wartość — użyj dla SEKRETÓW"
        required: false
        default: ""
      keep_old_value_in:
        description: "Tylko key=M365_TOKEN_ENCRYPTION_KEY: wpisz M365_TOKEN_ENCRYPTION_KEY_PREVIOUS — obecny klucz trafi na początek listy kluczy do odczytu. Wartość nie trafia do logu."
        required: false
        default: ""
      is_buildtime:
        description: "true if the value must be baked at build time (forces full rebuild)"
        required: false
        default: "false"
      redeploy:
        description: "Po ustawieniu uruchom workflow Deploy (bramka CI Gate + smoke). Domyślnie NIE."
        required: false
        default: "false"

concurrency:
  group: coolify-set-env
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  set-env:
    # OPS-N05: sekrety COOLIFY_* tylko dla wersji tego pliku z maina.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `gh workflow run deploy.yml` — dispatch tokenem Actions JEST wyjątkiem,
      # który uruchamia inny workflow.
      actions: write
    steps:
      - name: Set env via Coolify API
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          KEY: ${{ inputs.key }}
          # Runda 7 (R7-X2-2): jawnej wartości NIE ma w `env:`. GitHub wypisuje
          # blok `env:` w nagłówku kroku ZANIM skrypt zdąży zarejestrować
          # maskę, więc `VALUE_PLAIN` z wartością `inputs.value` trafiało do
          # publicznego logu otwartym tekstem. Skrypt czyta ją z pliku zdarzenia
          # i maskuje w pierwszej linii.
          # Indeksowanie kontekstu `secrets` nazwą z inputu jest jedynym sposobem,
          # żeby wartość NIGDY nie przeszła przez `inputs` — te są widoczne na
          # stałe w podsumowaniu runa, także po latach i dla każdego, kto ma
          # odczyt repo. Maskowanie w logu (niżej) tego nie ratuje: chroni log,
          # nie metadane uruchomienia.
          VALUE_FROM_SECRET: ${{ inputs.value_from_secret }}
          VALUE_SECRET: ${{ secrets[inputs.value_from_secret] }}
          KEEP_OLD_IN: ${{ inputs.keep_old_value_in }}
          IS_BUILDTIME: ${{ inputs.is_buildtime }}
        run: |
          set -euo pipefail

          # Pierwsza rzecz w kroku: wartość jawna z pliku zdarzenia + maska.
          # Linia po linii, bo `::add-mask::` obejmuje JEDNĄ linię — przy
          # wartości wielolinijkowej zamaskowałby się sam pierwszy wiersz.
          VALUE_PLAIN="$(jq -r '.inputs.value // ""' "${GITHUB_EVENT_PATH}")"
          while IFS= read -r _line; do
            [ -n "$_line" ] && echo "::add-mask::${_line}"
          done <<< "${VALUE_PLAIN}"

          # Klucz wyglądający na sekret nie przyjmuje wartości jawnej: input
          # workflow_dispatch zostaje na stałe w metadanych runa i w pliku
          # zdarzenia, maska chroni wyłącznie log. Sekret idzie przez
          # `value_from_secret`. Pusta wartość (wyczyszczenie) jest dozwolona.
          # Runda 8 (R8-V3-7): liczby i identyfikatory z „KEY” w nazwie
          # (`SERVICE_ACCOUNT_KEY_MAX_TTL_DAYS`, `RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID`) nie są
          # sekretami, a adres bazy z hasłem przed znakiem @ jest —
          # niezależnie od nazwy klucza.
          if [ -n "${VALUE_PLAIN}" ]; then
            case "${KEY}" in
              *_TTL_DAYS|*_TTL_SECONDS|*_KEY_ID) ;;
              *SECRET*|*_KEY|*_KEY_*|*_TOKEN|*PASSWORD|*_DSN|*_PAT|*API_KEY*)
                echo "Klucz '${KEY}' wygląda na sekret — podaj wartość przez value_from_secret, nie jawnie." >&2
                exit 1
                ;;
            esac
            if printf '%s' "${VALUE_PLAIN}" | grep -Eq '://[^/@[:space:]]*:[^/@[:space:]]+@'; then
              echo "Wartość '${KEY}' zawiera adres z hasłem — podaj ją przez value_from_secret, nie jawnie." >&2
              exit 1
            fi
          fi

          case "${IS_BUILDTIME}" in
            true|false) ;;
            *) echo "is_buildtime musi być true albo false." >&2; exit 1 ;;
          esac

          # Jedno źródło wartości. Podanie obu jest ODRZUCANE zamiast rozstrzygane:
          # każde rozstrzygnięcie po cichu wpisałoby na produkcję coś innego, niż
          # widział operator.
          if [ -n "${VALUE_FROM_SECRET}" ]; then
            if [ -n "${VALUE_PLAIN}" ]; then
              echo "Podaj ALBO value, ALBO value_from_secret — nie oba naraz." >&2
              exit 1
            fi
            VALUE="${VALUE_SECRET}"
            if [ -z "${VALUE}" ]; then
              # Nieistniejący sekret daje pusty string, nie błąd — bez tej bramki
              # literówka w nazwie CICHO wyczyściłaby zmienną na produkcji.
              echo "Sekret '${VALUE_FROM_SECRET}' jest pusty albo nie istnieje w tym repo." >&2
              exit 1
            fi
            echo "źródło wartości: sekret repo '${VALUE_FROM_SECRET}'"
          else
            VALUE="${VALUE_PLAIN}"
            echo "źródło wartości: input (jawny)"
          fi

          # Maska także dla wartości z sekretu repo (GitHub maskuje sekrety sam,
          # ale nie ich pojedyncze linie po rozbiciu wartości wielolinijkowej).
          while IFS= read -r _line; do
            [ -n "$_line" ] && echo "::add-mask::${_line}"
          done <<< "${VALUE}"

          # Wartość w jednym wierszu (19.10.2026): Coolify zapisuje zmienne do
          # `.env` bez cudzysłowów, więc drugi wiersz staje się „nazwą zmiennej”
          # i `docker compose pull` pada przy KAŻDYM deployu, aż ktoś zmienną
          # wyczyści. Wtedy był to wklejony cały mail z tokenem JJIT. Końcowe
          # znaki nowej linii (sekret z `gh secret set < plik`) ucinamy.
          while [[ "${VALUE}" == *$'\n' || "${VALUE}" == *$'\r' ]]; do
            VALUE="${VALUE%?}"
          done
          if [[ "${VALUE}" == *$'\n'* || "${VALUE}" == *$'\r'* ]]; then
            echo "Wartość '${KEY}' ma wiele wierszy — Coolify nie zapisze jej do .env i każdy deploy padnie. Podaj samą wartość w jednym wierszu (np. sam token, bez treści maila)." >&2
            exit 1
          fi
          echo "długość wartości: ${#VALUE} zn."

          # Klucze szyfrowania danych (25.11.2026): zła wartość zatrzymuje
          # szyfrowanie w całej aplikacji, a sync M365 wyłącza wtedy skrzynki.
          # Sprawdzenie formatu jak w Fernet (32 bajty w url-safe base64),
          # wartość ze stdin, nie z argumentu.
          fernet_keys_ok() {
            python3 -c '
          import base64, binascii, sys
          keys = [k.strip() for k in sys.stdin.read().split(",") if k.strip()]
          def ok(key):
              try:
                  return len(key) == 44 and len(base64.urlsafe_b64decode(key.encode())) == 32
              except (binascii.Error, ValueError):
                  return False
          sys.exit(0 if keys and all(ok(k) for k in keys) else 1)
          '
          }
          case "${KEY}" in
            M365_TOKEN_ENCRYPTION_KEY)
              # Pusty klucz też odpada: bez niego nie działa żadne szyfrowanie.
              if [ -z "${VALUE}" ] || [[ "${VALUE}" == *,* ]] || ! printf '%s' "${VALUE}" | fernet_keys_ok; then
                echo "Wartość '${KEY}' nie jest jednym kluczem Fernet (32 bajty w url-safe base64) — nic nie zapisano." >&2
                exit 1
              fi
              ;;
            M365_TOKEN_ENCRYPTION_KEY_PREVIOUS)
              if [ -n "${VALUE}" ] && ! printf '%s' "${VALUE}" | fernet_keys_ok; then
                echo "Wartość '${KEY}' nie jest listą kluczy Fernet po przecinku — nic nie zapisano." >&2
                exit 1
              fi
              ;;
          esac

          base="${COOLIFY_URL%/}"
          auth=(-H "Authorization: Bearer ${COOLIFY_TOKEN}" -H "Accept: application/json")

          # Detect whether the key already exists (do NOT print env values — the
          # vault holds secrets like SMTP_PASSWORD).
          curl -fsS "${auth[@]}" "${base}/api/v1/applications/${COOLIFY_APP_UUID}/envs" -o /tmp/envs.json
          exists=$(jq -r --arg k "$KEY" 'any(.[]?; .key==$k)' /tmp/envs.json)
          echo "key '${KEY}' already present: ${exists}"

          # Bieżąca wartość zmiennej produkcyjnej (bez wierszy podglądu), od razu
          # pod maską — tylko do porównań i do keep_old_value_in, nigdy do logu.
          current_value() {
            jq -r --arg k "$1" \
              '[.[]? | select(.key == $k and ((.is_preview // false) | not))][0].value // ""' \
              /tmp/envs.json
          }
          mask_list() {
            local _entry
            while IFS= read -r _entry; do
              _entry="${_entry#"${_entry%%[![:space:]]*}"}"
              _entry="${_entry%"${_entry##*[![:space:]]}"}"
              [ -n "$_entry" ] && echo "::add-mask::${_entry}"
            done < <(printf '%s\n' "$1" | tr ',' '\n')
            return 0
          }
          OLD_VALUE="$(current_value "${KEY}")"
          mask_list "${OLD_VALUE}"

          # Zmiana klucza szyfrowania bez zachowania obecnej wartości = dane
          # nie do odczytu (tokeny M365, dane płacowe): sync M365 wyłącza
          # skrzynkę, której tokenu nie czyta żaden klucz. Procedura:
          # docs/claude/podstawy/rotacja-klucza-szyfrowania-tokenow.md.
          if [ "${KEY}" = "M365_TOKEN_ENCRYPTION_KEY" ] && [ -n "${OLD_VALUE}" ] \
            && [ "${OLD_VALUE}" != "${VALUE}" ] \
            && [ "${KEEP_OLD_IN}" != "M365_TOKEN_ENCRYPTION_KEY_PREVIOUS" ]; then
            echo "Zmiana M365_TOKEN_ENCRYPTION_KEY gubi dane bez keep_old_value_in=M365_TOKEN_ENCRYPTION_KEY_PREVIOUS (obecny klucz zostaje do odczytu, dane przeszyfrowuje app.cli.token_cipher_rotate) — nic nie zapisano." >&2
            exit 1
          fi

          write_env() {
            local _key="$1" _value="$2" _method _code _payload
            if [ "$(jq -r --arg k "$_key" 'any(.[]?; .key==$k)' /tmp/envs.json)" = "true" ]; then
              _method=PATCH
            else
              _method=POST
            fi
            _payload=$(jq -n --arg k "$_key" --arg v "$_value" --argjson bt "${IS_BUILDTIME}" \
              '{key:$k, value:$v, is_buildtime:$bt, is_runtime:true, is_preview:false}')
            echo "→ ${_method} /api/v1/applications/.../envs (key=${_key})"
            _code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X "$_method" "${auth[@]}" \
              -H "Content-Type: application/json" \
              -d "$_payload" \
              "${base}/api/v1/applications/${COOLIFY_APP_UUID}/envs")
            echo "env write HTTP ${_code}"
            # Print only a safe error hint, never the full body (could echo a value).
            if [ "$_code" -ge 400 ]; then
              jq -r '.message // .error // "request failed"' /tmp/resp.json 2>/dev/null || true
              return 1
            fi
          }

          if [ -n "${KEEP_OLD_IN}" ]; then
            # Wyłącznie rotacja klucza szyfrowania danych: inaczej input
            # przepisywałby dowolny sekret z Coolify do dowolnej zmiennej.
            if [ "${KEY}" != "M365_TOKEN_ENCRYPTION_KEY" ] \
              || [ "${KEEP_OLD_IN}" != "M365_TOKEN_ENCRYPTION_KEY_PREVIOUS" ]; then
              echo "keep_old_value_in działa tylko dla key=M365_TOKEN_ENCRYPTION_KEY z keep_old_value_in=M365_TOKEN_ENCRYPTION_KEY_PREVIOUS." >&2
              exit 1
            fi
            if [ -z "${OLD_VALUE}" ]; then
              echo "Zmienna '${KEY}' nie ma teraz wartości — nie ma czego zachować w '${KEEP_OLD_IN}'." >&2
              exit 1
            fi
            if [ "${OLD_VALUE}" = "${VALUE}" ]; then
              echo "Nowa wartość '${KEY}' jest taka sama jak obecna — nic nie zapisano." >&2
              exit 1
            fi
            KEPT="$(current_value "${KEEP_OLD_IN}")"
            mask_list "${KEPT}"
            # Obecna wartość na początek listy, bez powtórzeń i bez nowej wartości.
            KEPT_LIST="$(printf '%s,%s' "${OLD_VALUE}" "${KEPT}" | VALUE="${VALUE}" python3 -c '
          import os, sys
          seen, out = {os.environ["VALUE"]}, []
          for entry in sys.stdin.read().split(","):
              entry = entry.strip()
              if entry and entry not in seen:
                  seen.add(entry)
                  out.append(entry)
          sys.stdout.write(",".join(out))
          ')"
            if [ "${KEEP_OLD_IN}" = "M365_TOKEN_ENCRYPTION_KEY_PREVIOUS" ] && ! printf '%s' "${KEPT_LIST}" | fernet_keys_ok; then
              echo "Obecne klucze nie mają formatu Fernet — nic nie zapisano." >&2
              exit 1
            fi
            # Najpierw lista starych wartości: przerwanie między zapisami zostawia
            # stary klucz i do zapisu, i do odczytu (bez szkody).
            write_env "${KEEP_OLD_IN}" "${KEPT_LIST}" || exit 1
            echo "zachowano poprzednią wartość '${KEY}' w '${KEEP_OLD_IN}' (pozycji na liście: $(printf '%s' "${KEPT_LIST}" | tr ',' '\n' | grep -c .))"
          fi

          write_env "${KEY}" "${VALUE}" || exit 1

          echo "done: ${KEY} set"

      - name: Wdróż przez workflow Deploy
        if: ${{ inputs.redeploy == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE_REBUILD: ${{ inputs.is_buildtime == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --repo "$REPO" --ref main -f force_rebuild="$FORCE_REBUILD"
          echo "::notice::Uruchomiono workflow Deploy (force_rebuild=${FORCE_REBUILD}). Wdroży HEAD maina tylko przy zielonej bramce CI Gate i tylko w oknie 18:00–08:00 — w dzień Deploy kończy się błędem okna; uruchom go wtedy ręcznie po 18:00 (force_rebuild=${FORCE_REBUILD}). Wynik w zakładce Actions."

      - name: Zmiana czeka na deploy
        if: ${{ inputs.redeploy != 'true' }}
        run: echo "::notice::Zmienna ustawiona w Coolify, ale NIE wdrożona. Zadziała po najbliższym deployu (automatycznym albo ręcznym „Deploy”, przy zmiennej build-time z force_rebuild=true)."
