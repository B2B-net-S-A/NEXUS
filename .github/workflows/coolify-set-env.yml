name: Coolify set env

# Manually-triggered ops helper: set a single Coolify env var on the NEXUS app
# using the already-stored COOLIFY_* secrets.
# Used to flip feature flags (e.g. SELF_REGISTRATION_ENABLED) without SSH/UI.
#
# OPS-N03 (audyt 22.09.2026): `redeploy` jest domyślnie `false`. Do 09.2026
# domyślne `true` wołało webhook Coolify WPROST — budowa HEAD-a maina z
# pominięciem bramki DEP-01 (zielone „CI Gate”), smoke testu, deep health
# i kontroli migracji. Teraz `redeploy=true` uruchamia workflow „Deploy”
# (`force_rebuild` = `is_buildtime`), który przechodzi przez wszystkie bramki.
# Kilka zmiennych naraz: ustaw je z `redeploy=false`, a na końcu jeden Deploy.
on:
  workflow_dispatch:
    inputs:
      key:
        description: "Env var name"
        required: true
      value:
        description: "Env var value (zostaw puste, gdy używasz value_from_secret)"
        required: false
        default: ""
      value_from_secret:
        description: "Nazwa sekretu repo, z którego wziąć wartość — użyj dla SEKRETÓW"
        required: false
        default: ""
      is_buildtime:
        description: "true if the value must be baked at build time (forces full rebuild)"
        required: false
        default: "false"
      redeploy:
        description: "Po ustawieniu uruchom workflow Deploy (bramka CI Gate + smoke). Domyślnie NIE."
        required: false
        default: "false"

concurrency:
  group: coolify-set-env
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  set-env:
    # OPS-N05: sekrety COOLIFY_* tylko dla wersji tego pliku z maina.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `gh workflow run deploy.yml` — dispatch tokenem Actions JEST wyjątkiem,
      # który uruchamia inny workflow.
      actions: write
    steps:
      - name: Set env via Coolify API
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          KEY: ${{ inputs.key }}
          # Runda 7 (R7-X2-2): jawnej wartości NIE ma w `env:`. GitHub wypisuje
          # blok `env:` w nagłówku kroku ZANIM skrypt zdąży zarejestrować
          # maskę, więc `VALUE_PLAIN` z wartością `inputs.value` trafiało do
          # publicznego logu otwartym tekstem. Skrypt czyta ją z pliku zdarzenia
          # i maskuje w pierwszej linii.
          # Indeksowanie kontekstu `secrets` nazwą z inputu jest jedynym sposobem,
          # żeby wartość NIGDY nie przeszła przez `inputs` — te są widoczne na
          # stałe w podsumowaniu runa, także po latach i dla każdego, kto ma
          # odczyt repo. Maskowanie w logu (niżej) tego nie ratuje: chroni log,
          # nie metadane uruchomienia.
          VALUE_FROM_SECRET: ${{ inputs.value_from_secret }}
          VALUE_SECRET: ${{ secrets[inputs.value_from_secret] }}
          IS_BUILDTIME: ${{ inputs.is_buildtime }}
        run: |
          set -euo pipefail

          # Pierwsza rzecz w kroku: wartość jawna z pliku zdarzenia + maska.
          # Linia po linii, bo `::add-mask::` obejmuje JEDNĄ linię — przy
          # wartości wielolinijkowej zamaskowałby się sam pierwszy wiersz.
          VALUE_PLAIN="$(jq -r '.inputs.value // ""' "${GITHUB_EVENT_PATH}")"
          while IFS= read -r _line; do
            [ -n "$_line" ] && echo "::add-mask::${_line}"
          done <<< "${VALUE_PLAIN}"

          # Klucz wyglądający na sekret nie przyjmuje wartości jawnej: input
          # workflow_dispatch zostaje na stałe w metadanych runa i w pliku
          # zdarzenia, maska chroni wyłącznie log. Sekret idzie przez
          # `value_from_secret`. Pusta wartość (wyczyszczenie) jest dozwolona.
          # Runda 8 (R8-V3-7): liczby i identyfikatory z „KEY” w nazwie
          # (`SERVICE_ACCOUNT_KEY_MAX_TTL_DAYS`, `CLOUDTALK_API_KEY_ID`) nie są
          # sekretami, a adres z hasłem (`DATABASE_URL=postgresql://u:hasło@…`)
          # jest — niezależnie od nazwy klucza.
          if [ -n "${VALUE_PLAIN}" ]; then
            case "${KEY}" in
              *_TTL_DAYS|*_TTL_SECONDS|*_KEY_ID) ;;
              *SECRET*|*_KEY|*_KEY_*|*_TOKEN|*PASSWORD|*_DSN|*_PAT|*API_KEY*)
                echo "Klucz '${KEY}' wygląda na sekret — podaj wartość przez value_from_secret, nie jawnie." >&2
                exit 1
                ;;
            esac
            if printf '%s' "${VALUE_PLAIN}" | grep -Eq '://[^/@[:space:]]*:[^/@[:space:]]+@'; then
              echo "Wartość '${KEY}' zawiera adres z hasłem — podaj ją przez value_from_secret, nie jawnie." >&2
              exit 1
            fi
          fi

          case "${IS_BUILDTIME}" in
            true|false) ;;
            *) echo "is_buildtime musi być true albo false." >&2; exit 1 ;;
          esac

          # Jedno źródło wartości. Podanie obu jest ODRZUCANE zamiast rozstrzygane:
          # każde rozstrzygnięcie po cichu wpisałoby na produkcję coś innego, niż
          # widział operator.
          if [ -n "${VALUE_FROM_SECRET}" ]; then
            if [ -n "${VALUE_PLAIN}" ]; then
              echo "Podaj ALBO value, ALBO value_from_secret — nie oba naraz." >&2
              exit 1
            fi
            VALUE="${VALUE_SECRET}"
            if [ -z "${VALUE}" ]; then
              # Nieistniejący sekret daje pusty string, nie błąd — bez tej bramki
              # literówka w nazwie CICHO wyczyściłaby zmienną na produkcji.
              echo "Sekret '${VALUE_FROM_SECRET}' jest pusty albo nie istnieje w tym repo." >&2
              exit 1
            fi
            echo "źródło wartości: sekret repo '${VALUE_FROM_SECRET}'"
          else
            VALUE="${VALUE_PLAIN}"
            echo "źródło wartości: input (jawny)"
          fi

          # Maska także dla wartości z sekretu repo (GitHub maskuje sekrety sam,
          # ale nie ich pojedyncze linie po rozbiciu wartości wielolinijkowej).
          while IFS= read -r _line; do
            [ -n "$_line" ] && echo "::add-mask::${_line}"
          done <<< "${VALUE}"
          echo "długość wartości: ${#VALUE} zn."

          base="${COOLIFY_URL%/}"
          auth=(-H "Authorization: Bearer ${COOLIFY_TOKEN}" -H "Accept: application/json")

          # Detect whether the key already exists (do NOT print env values — the
          # vault holds secrets like SMTP_PASSWORD).
          curl -fsS "${auth[@]}" "${base}/api/v1/applications/${COOLIFY_APP_UUID}/envs" -o /tmp/envs.json
          exists=$(jq -r --arg k "$KEY" 'any(.[]?; .key==$k)' /tmp/envs.json)
          echo "key '${KEY}' already present: ${exists}"

          payload=$(jq -n --arg k "$KEY" --arg v "$VALUE" --argjson bt "${IS_BUILDTIME}" \
            '{key:$k, value:$v, is_buildtime:$bt, is_runtime:true, is_preview:false}')

          if [ "$exists" = "true" ]; then
            method=PATCH
          else
            method=POST
          fi
          echo "→ ${method} /api/v1/applications/.../envs (key=${KEY})"
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X "$method" "${auth[@]}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${base}/api/v1/applications/${COOLIFY_APP_UUID}/envs")
          echo "env write HTTP ${code}"
          # Print only a safe error hint, never the full body (could echo a value).
          if [ "$code" -ge 400 ]; then
            jq -r '.message // .error // "request failed"' /tmp/resp.json 2>/dev/null || true
            exit 1
          fi

          echo "done: ${KEY} set"

      - name: Wdróż przez workflow Deploy
        if: ${{ inputs.redeploy == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE_REBUILD: ${{ inputs.is_buildtime == 'true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --repo "$REPO" --ref main -f force_rebuild="$FORCE_REBUILD"
          echo "::notice::Uruchomiono workflow Deploy (force_rebuild=${FORCE_REBUILD}). Wdroży HEAD maina tylko przy zielonej bramce CI Gate — wynik w zakładce Actions."

      - name: Zmiana czeka na deploy
        if: ${{ inputs.redeploy != 'true' }}
        run: echo "::notice::Zmienna ustawiona w Coolify, ale NIE wdrożona. Zadziała po najbliższym deployu (automatycznym albo ręcznym „Deploy”, przy zmiennej build-time z force_rebuild=true)."
