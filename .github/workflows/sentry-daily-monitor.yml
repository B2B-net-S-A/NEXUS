name: Sentry daily monitor

# Daily Sentry health digest -> Teams. Replaces the session-only Claude
# CronCreate cron `393ccf85` (which auto-expires after 7 days) with a
# durable GH Actions schedule. Setup + secrets: docs/sentry-monitoring.md.

on:
  schedule:
    # 6:47 UTC = 7:47 / 8:47 Warsaw (CET/CEST). Slightly off-the-hour to
    # avoid the cron stampede that delays GitHub-hosted runners.
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    name: Sentry digest -> Teams
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run Sentry digest
        id: digest
        env:
          SENTRY_READ_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
          TEAMS_SENTRY_WEBHOOK_URL: ${{ secrets.TEAMS_SENTRY_WEBHOOK_URL }}
          SENTRY_HOST: b2bnet-sa.sentry.io
          SENTRY_ORG: b2bnet-sa
          SENTRY_PROJECTS: nexus-be,nexus-fe
        # Kod wyjścia idzie do outputu, żeby job `alert` nazwał przyczynę:
        # 1 = brak sekretów albo odczyt któregoś projektu padł, 2 = Teams
        # nie przyjął wiadomości (sentry_daily_digest.py:main).
        run: |
          set +e
          python .github/scripts/sentry_daily_digest.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
      # OPS-N08 (audyt 22.09.2026): zielony bieg zamyka alarm, który otworzył
      # czerwony — marker DOKŁADNIE ten sam co w kroku otwierającym.
      - name: Zamknij alarm po zielonym biegu
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/alert_issue.sh resolve "NEXUS dzienny monitor Sentry nie działa" "Dzienny digest Sentry dotarł do Teams."
    outputs:
      rc: ${{ steps.digest.outputs.rc }}

  # MON-01 (audyt 14.09.2026): czerwony digest był wyłącznie mailem z GitHuba.
  # Awaria SAMEGO monitoringu (brak tokenu, padnięty odczyt projektu, Teams
  # odrzucił wiadomość) zakłada teraz issue — wzorzec z backup-drill.yml.
  # Tylko z crona: ręczny bieg ogląda człowiek przy logu.
  alert:
    name: Otwórz/odśwież issue po awarii digestu
    needs: digest
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or refresh alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RC: ${{ needs.digest.outputs.rc }}
          HAS_TOKEN: ${{ secrets.SENTRY_READ_TOKEN != '' }}
          HAS_WEBHOOK: ${{ secrets.TEAMS_SENTRY_WEBHOOK_URL != '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="NEXUS dzienny monitor Sentry nie działa"
          {
            echo "Dzienny digest Sentry (\`.github/workflows/sentry-daily-monitor.yml\`) nie dostarczył"
            echo "pełnego raportu. Dopóki to issue jest otwarte, **nikt codziennie nie przegląda błędów**"
            echo "\`nexus-be\` i \`nexus-fe\` — natywne alerty Sentry działają niezależnie."
            echo
            if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_WEBHOOK" != "true" ]; then
              echo "### Przyczyna: brak konfiguracji"
              [ "$HAS_TOKEN" = "true" ] || echo "- sekret \`SENTRY_READ_TOKEN\` (Sentry → Settings → Auth Tokens; zakresy \`org:read\`, \`project:read\`, \`event:read\`)"
              [ "$HAS_WEBHOOK" = "true" ] || echo "- sekret \`TEAMS_SENTRY_WEBHOOK_URL\` (Teams → Workflows → webhook)"
            elif [ "${RC:-}" = "2" ]; then
              echo "### Przyczyna: Teams nie przyjął wiadomości"
              echo "Webhook wygasł albo został usunięty — utwórz nowy i podmień sekret."
            else
              echo "### Przyczyna: odczyt Sentry niepełny"
              echo "Co najmniej jeden projekt nie dał się odczytać (sekcja „MONITORING READ FAILED” w wiadomości)."
              echo "Najczęściej: token wygasł albo stracił zakres. Klasa błędu jest w logu biegu."
            fi
            echo
            echo "Setup: \`docs/sentry-monitoring.md\`. Bieg: ${RUN_URL}"
            echo
            echo "_Auto-generated by \`.github/workflows/sentry-daily-monitor.yml\`._"
          } > /tmp/sentry-issue.md
          existing=$(gh issue list --repo "$REPO" --state open \
            --search "$marker in:title" --json number --jq '.[0].number // empty' || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file /tmp/sentry-issue.md
          else
            gh issue create --repo "$REPO" --title "🚨 ${marker}" --body-file /tmp/sentry-issue.md
          fi
