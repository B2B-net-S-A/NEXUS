name: Coolify Ops

# Operational escape hatch for the Coolify deployment queue (analytics plan PR 0).
#
# Why this exists: on 2026-07-16 the deployment queue on the NEXUS Coolify
# instance wedged — every `/api/v1/deploy` call returned HTTP 429 "Deployment
# queue is full" for 12+ hours while prod silently stayed on a stale SHA.
# There is no SSH access to the server and the panel needs an interactive
# login, but GH Actions already holds a Coolify API token — so queue
# inspection and cancellation live here, next to the Deploy workflow that
# depends on them.
#
# Usage:
#   1. action=list                 → dump currently running/queued deployments
#                                    + the application's own status.
#   2. action=cancel, uuids="a b"  → POST /deployments/{uuid}/cancel for each.
#   3. action=cron-list            → audyt zadań cyklicznych (read-only).
#   4. action=backup-status        → czy kopia zapasowa w ogóle powstaje
#                                    (read-only; trzy bramki + werdykt).
#   5. action=eval-ab              → JEDNORAZOWY pomiar A/B matchingu na prodzie
#                                    (patrz job `eval` niżej — tam kryterium odczytu).
#   6. action=eval-read            → odczyt wyników zadania evalu bez kasowania go.
#   7. action=eval-stop            → skasowanie zadania evalu, gdyby sprzątanie
#                                    nie doszło do skutku (zawór bezpieczeństwa).
#   8. action=contract-merge-audit → read-only plan scalania kontraktów; do
#                                    artefaktu trafia raport bez nazw i kwot.
#   9. action=contract-merge-apply → zastosowanie DOKŁADNIE zatwierdzonego planu;
#                                    wymaga fingerprintu i jawnego potwierdzenia.
#  10. action=nexus-data-correction-audit → read-only plan korekty z Nexus.xlsx.
#  11. action=nexus-data-correction-apply → dokładny, zatwierdzony plan korekty.
#  13. action=candidate-index-audit → full SQL/index ID and content audit (read-only).
#  14. action=candidate-index-repair → enqueue the exact reviewed audit manifest.
#  12. action=migration-receipts  → paragony jednorazowych migracji naprawczych
#                                   (read-only; liczniki i ID, zero kwot i nazwisk).
#
# The list output contains only build metadata (UUIDs, SHAs, statuses,
# timestamps) — no env values or secrets.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [candidate-index-audit, candidate-index-repair, list, cancel, cron-list, backup-status, client-lookup, migration-receipts, contract-merge-audit, contract-merge-apply, nexus-data-correction-audit, nexus-data-correction-apply, eval-ab, eval-read, eval-stop, eval-cv-quality, recover-cv-quality, inspect-cv-quality, cleanup-cv-quality]
        default: list
      index_audit_identity:
        description: "Reviewed audit RUN_ID-ATTEMPT (candidate-index-repair only)"
        required: false
        default: ""
      index_fingerprint:
        description: "Exact reviewed audit fingerprint; queues only its repairs, never deletes points"
        required: false
        default: ""
      candidate_search_diagnostics:
        description: "Runtime queue/model/cost report and one synthetic query probe (candidate-index-audit only)"
        type: boolean
        required: false
        default: false
      deployment_uuids:
        description: "Space-separated deployment UUIDs to cancel (action=cancel)"
        required: false
        default: ""
      client_like:
        # Jedyne wejście TEKSTOWE trafiające do komendy na prodzie — i dlatego
        # przepuszczone przez twardą allowlistę `[a-z0-9.-]`, 1-40 znaków,
        # w kroku niżej. Ten zestaw NIE ZAWIERA żadnego metaznaku powłoki
        # (bez cudzysłowów, $, backticka, ;, |, &, nawiasów), więc nie da się
        # nim zmienić KSZTAŁTU komendy — można wyłącznie zawęzić `LIKE`
        # w zapytaniu, które i tak jest samym SELECT-em.
        #
        # SPACJI też nie ma, i to nie z powodu bezpieczeństwa: `--like ${needle}`
        # jest w komendzie NIECYTOWANE, więc „credit agricole" rozpadłoby się na
        # dwa argumenty i argparse padłby z kodem 2. Cytowanie byłoby ryzykowne —
        # nie wiemy, czy Coolify opakowuje komendę w `sh -c '…'` czy w cudzysłów
        # (ten sam powód, dla którego eval unika apostrofów). Jeden człon nazwy
        # w zupełności wystarcza: `agricole`, `erste`, `cardif`, `polkomtel`.
        #
        # Zasada „operator wnosi liczbę albo wybór" (patrz komentarz przy
        # wejściach eval) zostaje utrzymana co do skutku: kanał daje dostęp do
        # JEDNEGO read-only skryptu, nie do kontenera.
        description: "JEDEN człon nazwy klienta, bez spacji (action=client-lookup), np. agricole"
        required: false
        default: ""
      receipt_key:
        # Ta sama zasada co przy `client_like`: allowlista znaków, zero
        # metaznaków powłoki i zero spacji. Sam skrypt dodatkowo odrzuca klucz,
        # który nie ma KSZTAŁTU paragonu migracji, więc kanał nie umie
        # przeczytać ustawień kolumn ani manifestu portfela klientów.
        description: "Klucz paragonu (action=migration-receipts), np. 0262_separate_md_periodic; puste = wszystkie"
        required: false
        default: ""
      # Trzy wejścia niżej to JEDYNE, co operator wnosi do komendy uruchamianej
      # na produkcji — i wszystkie trzy są liczbą albo wyborem z listy. Pola
      # `command` świadomie NIE MA: to kanał wykonania na prodzie, a wejście
      # tekstowe wprost przekładałoby uprawnienie „odpal eval" na „odpal cokolwiek
      # w kontenerze z bazą kandydatów". Sama komenda jest zaszyta w job `eval`.
      cv_eval_source_sha:
        description: "Original evaluated SHA (required only for recovering an existing receipt)"
        type: string
        required: false
      cv_eval_run_identity:
        description: "Existing CV diagnostic run and attempt to inspect (e.g. 34362429205-1); read-only"
        required: false
        default: ""
      cv_eval_models:
        description: "CV synthetic diagnostics: primary or all configured models"
        type: choice
        options: [primary, all]
        default: primary
      cv_eval_cases:
        description: "CV synthetic cases per model (1-40; partial runs are not a full benchmark)"
        required: false
        default: "40"
      eval_set:
        description: "Zamrożony zbiór ofert: A (strojenie) albo B (holdout potwierdzający)"
        type: choice
        options: [A, B]
        default: A
      eval_jobs:
        description: "Liczba ofert (1-50). Mniej niż 50 = INNY zbiór, nieporównywalny z baselinem."
        required: false
        default: "50"
      eval_pool:
        description: "Wielkość puli retrievalu (100-5000). Baseline 18.08 mierzony przy 2000."
        required: false
        default: "2000"
      contract_merge_fingerprint:
        description: "Dokładny 64-znakowy fingerprint z artefaktu audytu (wymagany tylko dla contract-merge-apply)"
        required: false
        default: ""
      contract_merge_candidate_rate_sources:
        description: "Decyzje stawek kosztowych: group=source,... (wyłącznie ID; tylko contract-merge-apply)"
        required: false
        default: ""
      contract_merge_client_rate_sources:
        description: "Decyzje stawek przychodowych: group=source,... (wyłącznie ID; tylko contract-merge-apply)"
        required: false
        default: ""
      contract_merge_framework_rate_sources:
        description: "Decyzje stawek ramowych: group=source,... (wyłącznie ID; tylko contract-merge-apply)"
        required: false
        default: ""
      contract_merge_rate_metadata_sources:
        description: "Decyzje jednostki/waluty/godzin: group=source,... (wyłącznie ID; tylko contract-merge-apply)"
        required: false
        default: ""
      contract_merge_field_sources:
        description: "Decyzje pól: group.field=source,... (nazwy z allowlisty i ID; tylko contract-merge-apply)"
        required: false
        default: ""
      contract_merge_allow_rate_empty_metadata:
        description: "Zezwól ignorować sprzeczne metadata wyłącznie rekordów bez żadnych stawek (tylko contract-merge-apply)"
        type: choice
        options: ["NO", "ALLOW"]
        default: "NO"
      contract_merge_confirm:
        description: "Bezpiecznik operacji fizycznego usunięcia duplikatów (tylko contract-merge-apply)"
        type: choice
        options: ["NO", "APPLY"]
        default: "NO"
      nexus_data_correction_fingerprint:
        description: "Dokładny fingerprint z nexus-data-correction-audit (tylko apply)"
        required: false
        default: ""
      nexus_data_correction_confirm:
        description: "Bezpiecznik fizycznego DELETE i korekty kontraktów (tylko apply)"
        type: choice
        options: ["NO", "APPLY"]
        default: "NO"

permissions:
  contents: read

jobs:
  ops:
    name: Coolify queue ops
    # Wszystkie kroki tego joba są bramkowane po `action`, więc przy akcjach
    # eval-* przeszedłby jako zielony bez wykonania czegokolwiek — a zielony
    # job, który nic nie zrobił, czyta się jak potwierdzenie.
    if: ${{ !startsWith(inputs.action, 'eval') && inputs.action != 'recover-cv-quality' && inputs.action != 'inspect-cv-quality' && inputs.action != 'cleanup-cv-quality' && !startsWith(inputs.action, 'contract-merge-') && !startsWith(inputs.action, 'nexus-data-correction-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List deployments + application status
        if: inputs.action == 'list'
        # Sekrety przez `env:`, a nie `${{ }}` w ciele skryptu — ta sama zasada,
        # co w krokach `cancel` i `backup-status` niżej.
        env:
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        # Nieudane zapytanie kończy ten krok NA CZERWONO — ale dopiero po
        # wykonaniu obu zapytań. Trzy decyzje, każda przeciwko innemu sposobowi
        # zmylenia operatora:
        #
        #   1. Czerwień zamiast dotychczasowego `|| echo "(request failed)"`.
        #      To narzędzie diagnostyczne odpalane ręcznie, więc odpowiedź czyta
        #      się z logu — ale bieg zakończony na zielono z pustym wynikiem
        #      czyta się jak odpowiedź „w kolejce nic nie stoi" na pytanie „co
        #      stoi w kolejce". Cicha pustka jest tu gorsza niż czerwień.
        #   2. Oba zapytania mimo błędu pierwszego (stąd `rc`, a nie `exit 1`
        #      w środku). Padnięta lista wdrożeń nie może ukryć statusu
        #      aplikacji — to dwie niezależne informacje, a przy zapchanej
        #      kolejce potrzebne są obie naraz.
        #   3. Komunikat niesie metodę, ścieżkę i kod HTTP, a NIGDY ciała
        #      odpowiedzi. Poprzednia wersja wołała `curl` bez `-f`, więc przy
        #      4xx/5xx curl kończył się kodem 0 i podawał ciało błędu dalej,
        #      a gałąź `else .` w filtrze jq drukowała je do logu w całości.
        #      Dziś Coolify odpowiada tam `{"message":"Unauthenticated."}`,
        #      czyli to higiena, nie wyciek — ale log biegu zostaje w historii
        #      repo, a o jego zawartości decydowałoby zdalne API. Kod HTTP
        #      odpowiada na to samo pytanie („dlaczego nie ma wyniku") i nie
        #      zmienia się razem z formatem błędów Coolify.
        run: |
          set -uo pipefail
          base="${CO_URL%/}/api/v1"
          auth=(-H "Authorization: Bearer ${CO_TOKEN}" -H "Accept: application/json")
          rc=0

          # $1 = etykieta do komunikatu, $2 = ścieżka pod /api/v1, $3 = filtr jq.
          # Filtr MUSI zwracać `empty` dla nieoczekiwanego kształtu: `jq -e` daje
          # wtedy kod 4 (brak wyjścia) i wchodzimy w gałąź błędu, zamiast wypisać
          # cokolwiek, co przyszło. Stderr jq idzie do /dev/null, bo jego własne
          # komunikaty o błędzie potrafią zacytować fragment wartości — czyli to
          # samo ciało, którego tu nie drukujemy.
          query() {
            local label="$1" path="$2" filter="$3" body code
            body="$(mktemp)"
            # BEZ `|| echo 000`: curl wypisuje `%{http_code}` także przy błędzie
            # połączenia (wtedy `000`) i dopiero potem kończy się kodem != 0,
            # więc fallback doklejał DRUGIE `000` i komunikat mówił o kodzie
            # `000000`, którego nie ma — akurat w tym przypadku, na który
            # powołuje się nawias "(000 = brak odpowiedzi)".
            code="$(curl -sS -o "$body" -w '%{http_code}' "${auth[@]}" "$base$path")"
            [ -n "$code" ] || code=000
            if [ "$code" != "200" ]; then
              echo "::error::${label}: GET /api/v1${path} zwróciło HTTP ${code} (000 = brak odpowiedzi). Ciała odpowiedzi nie drukujemy — sprawdź token i URL Coolify."
              rc=1
            elif ! jq -e "$filter" "$body" 2>/dev/null; then
              echo "::error::${label}: HTTP 200, ale odpowiedź nie ma spodziewanego kształtu — nie drukuję jej. Sprawdź endpoint w panelu Coolify."
              rc=1
            fi
            rm -f "$body"
          }

          echo "=== Currently running/queued deployments (instance-wide) ==="
          query "lista wdrożeń" "/deployments" \
            'if type == "array"
             then map({deployment_uuid, application_name, status, commit: (.commit // "" | .[0:10]), created_at, application_id})
             else empty end'
          echo ""
          echo "=== Application status ==="
          query "status aplikacji" "/applications/${APP_UUID}" \
            'if type == "object" and has("uuid")
             then {name, uuid, status, last_online_at, git_branch, git_commit_sha}
             else empty end'

          exit $rc

      - name: Cancel deployments
        if: inputs.action == 'cancel'
        # `deployment_uuids` idzie przez `env:`, a NIE przez `${{ }}` w ciele
        # skryptu. Interpolacja `${{ }}` podstawia tekst PRZED uruchomieniem
        # powłoki, więc wejście z formularza `workflow_dispatch` trafiało wprost
        # do shella — apostrof albo `$(…)` w polu wykonywał się jako komenda.
        # Waga jest niska (dispatch wymaga write do repo, a kto ma write, i tak
        # może zmienić ten plik), ale zostawianie tego obok nowych kroków `eval-*`,
        # które walidują swoje wejścia co do typu i zakresu, byłoby niespójne.
        #
        # Sekrety też idą przez `env:`, tak jak w kroku `list`. Interpolacja
        # `${{ }}` wkleja WARTOŚĆ do tekstu skryptu, zanim powłoka go zobaczy,
        # więc token żyje w wyrenderowanym poleceniu — a nie w zmiennej, którą
        # runner potrafi zamaskować w logu. Ten krok był ostatnim w pliku, który
        # tak robił; zostawianie go obok przepisanego `list` to dokładnie ten
        # sam błąd, co naprawiony bliźniak `|| echo "000"` kilka linii niżej.
        env:
          UUIDS_RAW: ${{ inputs.deployment_uuids }}
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          UUIDS="$UUIDS_RAW"
          if [ -z "$UUIDS" ]; then
            echo "::error::action=cancel requires deployment_uuids"
            exit 1
          fi
          # UUID-y Coolify to hex + myślniki. Cokolwiek innego odrzucamy, zamiast
          # ufać, że pętla `for` bezpiecznie to rozłoży.
          case "$UUIDS" in
            *[!0-9a-zA-Z\ -]*) echo "::error::deployment_uuids: dozwolone tylko znaki alfanumeryczne, myślnik i spacja"; exit 1;;
          esac
          rc=0
          for uuid in $UUIDS; do
            echo "Cancelling deployment $uuid ..."
            # `|| echo "000"` DOKLEJAŁO drugi kod: przy braku odpowiedzi curl
            # wypisuje `000` przez `-w` I kończy się niezerowo, więc podstawienie
            # dawało `000000` — komunikat o nieistniejącym kodzie HTTP dokładnie
            # w sytuacji, w której odpowiedzi nie ma. Kod bierzemy z `-w`,
            # a niepowodzenie samego curla zostawiamy `|| true`, żeby `set -e`
            # nie ubiło pętli przed wypisaniem, co się stało.
            code=$(curl -sS -o /tmp/cancel_body -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $CO_TOKEN" \
              -H "Accept: application/json" \
              "$CO_URL/api/v1/deployments/$uuid/cancel" || true)
            code="${code:-000}"
            # Ten sam kształt, co w kroku `list` wyżej: `curl` bez `-f` podaje
            # ciało błędu dalej, a `head -c 500` wysypywało je do logu biegu.
            # Zostaje WYŁĄCZNIE pole `.message` (albo `.error`) — jedno nazwane
            # pole przeznaczone dla człowieka, przycięte i pozbawione znaków
            # sterujących, żeby nowa linia w treści nie zaczęła w logu własnego
            # polecenia `::error::`. Reszta ciała nie wychodzi. Ta sama
            # konwencja, co przy tworzeniu zadania evalu w jobie `eval`.
            echo "HTTP $code — $(jq -r '((.message // .error // "brak pola .message w odpowiedzi") | tostring | gsub("[[:cntrl:]]"; " ") | .[0:200])' /tmp/cancel_body 2>/dev/null || echo "odpowiedź nie jest JSON-em")"
            if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "204" ]; then
              echo "::warning::Cancel of $uuid returned HTTP $code"
              rc=1
            fi
          done
          exit $rc

      # ─── Scheduled-task audit ────────────────────────────────────────────
      # Added 2026-07-27 after Compass turned out to have had every cron job dying
      # silently since May. Two independent causes, both invisible from the app side:
      #
      #   1. `container` empty while the compose stack has more than one service →
      #      "More than one container exists but no container name was provided",
      #      the job aborts before running anything.
      #   2. the command uses `curl`, which the app image does not ship →
      #      "sh: curl: not found".
      #
      # In both cases the scheduler itself is healthy and fires on time, the run is
      # recorded as `failed`, and nothing reaches the application — so the only way
      # to notice is to look here. This stack also has multiple services, hence the
      # check. Read-only.
      - name: Audit scheduled tasks
        if: inputs.action == 'cron-list'
        env:
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          # `-f`: bez niego curl przy 4xx/5xx kończy się kodem 0 i podaje ciało
          # błędu dalej — a gałąź „nieoczekiwana odpowiedź" niżej drukowała
          # z niego 400 bajtów do logu biegu. Z `-f` stdout jest pusty, a na
          # stderr ląduje linia `curl: (22) ... error: <kod>`, czyli dokładnie
          # ta informacja, po którą przychodzi się do tego audytu.
          api() {
            curl -fsS -H "Authorization: Bearer $CO_TOKEN" -H "Accept: application/json" "$CO_URL/api/v1$1"
          }

          if ! tasks=$(api "/applications/$APP_UUID/scheduled-tasks"); then
            echo "::error::GET /applications/{uuid}/scheduled-tasks nie powiodło się (kod HTTP w linii 'curl:' wyżej) — audytu nie ma z czego zrobić"
            exit 1
          fi
          if ! echo "$tasks" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::error::endpoint scheduled-tasks odpowiedział 2xx, ale nie listą zadań — ciała nie drukuję"
            exit 1
          fi

          total=$(echo "$tasks" | jq 'length')
          echo "=== $total scheduled task(s) ==="
          # Deliberately NOT printing `command`: it carries the app's own bearer token,
          # which GitHub does not mask (it is not a repo secret). The HTTP client is the
          # only part that matters here, so derive it and drop the rest.
          echo "$tasks" | jq -r '
            .[] | [
              .name,
              "freq=" + (.frequency // "?"),
              "enabled=" + (.enabled | tostring),
              "container=" + (if (.container // "") == "" then "*** EMPTY ***" else .container end),
              "client=" + (if ((.command // "") | test("\\bcurl\\b")) then "curl"
                           elif ((.command // "") | test("\\bwget\\b")) then "wget"
                           else "other" end)
            ] | @tsv' | column -t -s "$(printf '\t')"

          echo ""
          no_container=$(echo "$tasks" | jq '[.[] | select((.container // "") == "")] | length')
          # Word-boundary match, not a prefix: the command may be `/usr/bin/curl …`
          # or wrapped as `sh -c "curl …"`, and a prefix test would call those "other"
          # — a false negative on exactly the failure this audit exists to find.
          uses_curl=$(echo "$tasks" | jq '[.[] | select((.command // "") | test("\\bcurl\\b"))] | length')
          echo "Tasks with no container name: $no_container"
          echo "Tasks invoking curl:          $uses_curl"

          echo ""
          echo "=== recent executions (up to 3 per task) ==="
          for u in $(echo "$tasks" | jq -r '.[].uuid'); do
            name=$(echo "$tasks" | jq -r --arg u "$u" '.[] | select(.uuid == $u) | .name')
            echo "--- $name"
            # Odczyt i projekcja rozdzielone, bo po dodaniu `-f` nieudane
            # zapytanie daje PUSTY stdout — a jq na pustym wejściu kończy się
            # zerem i nie wypisuje nic. Bez tej gałęzi awaria wyglądałaby jak
            # zadanie bez wykonań, czyli jak odpowiedź.
            if ! execs=$(api "/applications/$APP_UUID/scheduled-tasks/$u/executions"); then
              echo "  (nie udało się odczytać wykonań — kod HTTP w linii 'curl:' wyżej)"
              continue
            fi
            echo "$execs" \
              | jq -r 'if type == "array" then
                         (if length == 0 then "  (never executed)"
                          else (.[0:3][] | "  \(.status)  \(.started_at // .created_at // "?")  \((.message // "")[0:140])")
                          end)
                       else "  (nieoczekiwany kształt odpowiedzi — ciała nie drukuję)" end' 2>/dev/null \
              || echo "  (nie udało się odczytać wykonań)"
          done

      # ─── Czy kopia zapasowa w ogóle powstaje ─────────────────────────────
      # Odpowiedź na jedno pytanie, na które do dziś nie było gdzie zajrzeć:
      # „czy backup jest produkowany". Bo kopii pilnują TRZY niezależne bramki,
      # każda domyślnie zamknięta i każda cicha:
      #
      #   1. `BACKUP_ENABLED` ma w docker-compose.yml default `false`. Dopóki nie
      #      zostanie flipnięte w vaultcie Coolify, backup.sh kończy się na
      #      kill-switchu z kodem 0 — kontener jest „healthy", pętla tyka,
      #      a kopia nie powstaje ANI RAZU. Sonda liveness tego nie widzi z
      #      założenia (backup/healthcheck.sh: „says nothing about whether
      #      backups are SUCCEEDING"), a monitoring świeżości LATEST.json jest
      #      za bramką nr 3.
      #   2. Konfiguracja S3/age w vaultcie. Brakuje choćby jednej pozycji →
      #      backup.sh przerywa w `fail()`, loop.sh ponawia trzy razy i śpi do
      #      jutra. Nic nie ląduje, nikt się nie dowiaduje.
      #   3. Sekrety repo (`BACKUP_AGE_PRIVATE_KEY`, `BACKUP_S3_*`) i zmienna
      #      `BACKUP_MONITORING_ENABLED`. Bez nich drill nie ma czym odszyfrować
      #      archiwum, a godzinowy check świeżości jest POMIJANY (`if:` na jobie
      #      w uptime-probe.yml).
      #
      # Krok jest READ-ONLY: wyłącznie GET-y, zero zapisów, zero deployu.
      #
      # ⚠️ Reguła drukowania: WARTOŚCI wychodzą wyłącznie z jawnej, zamkniętej
      # allowlisty (`VALUE_KEYS`), reszta kluczy — najwyżej jako słowo
      # „ustawiony"/„BRAK". Świadomie allowlista, a NIE filtr wykluczający:
      # przy czarnej liście nowy sekret dopisany do compose'a wyciekłby do
      # publicznego logu biegu wtedy, gdy ktoś zapomni go tam dopisać. Ta lista
      # myli się w stronę milczenia — nowy klucz domyślnie jest cichy.
      - name: Backup status (read-only)
        if: inputs.action == 'backup-status'
        env:
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          # Bramka nr 3 mieszka po stronie GitHuba, nie Coolify. Czytana jako
          # SAMA OBECNOŚĆ (`!= ''` daje "true"/"false") — wartość sekretu nie
          # wchodzi tu nawet do zmiennej.
          HAS_DRILL_AGE_KEY: ${{ secrets.BACKUP_AGE_PRIVATE_KEY != '' }}
          HAS_DRILL_S3_ACCESS: ${{ secrets.BACKUP_S3_ACCESS_KEY != '' }}
          HAS_DRILL_S3_SECRET: ${{ secrets.BACKUP_S3_SECRET_KEY != '' }}
          VAR_MONITORING: ${{ vars.BACKUP_MONITORING_ENABLED }}
          VAR_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          VAR_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          VAR_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
        run: |
          set -euo pipefail
          base="${CO_URL%/}"
          auth=(-H "Authorization: Bearer ${CO_TOKEN}" -H "Accept: application/json")

          # /tmp/envs.json niesie CAŁY vault, w tym SMTP_PASSWORD, SECRET_KEY
          # i klucze Voyage. Nie jest drukowany w całości NIGDZIE — każde
          # wyjście niżej przechodzi przez allowlistę albo przez test obecności
          # zwracający słowo, nie wartość. Nie dopisuj tu `cat`/`jq .`.
          # Kasowany bez względu na to, jak krok się skończy. Plik nie jest
          # drukowany nigdzie, ale przez resztę joba leżałby na dysku runnera
          # jako kompletny zrzut vaulta — a to jedyny artefakt tego kroku, który
          # przy dopisaniu obok kolejnego kroku (albo `actions/upload-artifact`)
          # zamienia bezpieczny odczyt w wyciek. Taniej go nie mieć.
          trap 'rm -f /tmp/envs.json' EXIT
          if ! curl -fsS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/envs" -o /tmp/envs.json; then
            echo "::error::nie udało się odczytać vaulta Coolify (GET /applications/{uuid}/envs)"
            exit 1
          fi
          jq -e 'type == "array"' /tmp/envs.json > /dev/null 2>&1 || {
            echo "::error::endpoint /envs zwrócił nieoczekiwany kształt — nie zgaduję, co znaczy"
            exit 1
          }

          VALUE_KEYS='["BACKUP_ENABLED","BACKUP_HOUR_UTC","BACKUP_RETENTION_DAYS","BACKUP_S3_BUCKET","BACKUP_S3_ENDPOINT","BACKUP_S3_PREFIX"]'

          env_value() {
            jq -r --arg k "$1" '
              map(select(.key == $k))
              | if length == 0 then "" else (.[0].value // .[0].real_value // "") end
            ' /tmp/envs.json
          }
          # Nazwa bucketa może teoretycznie nieść `|` albo backtick, a wynik idzie
          # do tabeli Markdown w podsumowaniu biegu. Rozjechana tabela to nie
          # kosmetyka — to werdykt, którego nie da się przeczytać.
          # Znaki sterujące, a nie tylko `|` i backtick. NOWA LINIA w wartości jest
          # groźniejsza niż rozjechana tabela: treść po niej zaczyna się w logu od
          # kolumny 0, a runner traktuje `::coś::` na początku linii jako WŁASNE
          # polecenie. Wartość `BACKUP_S3_PREFIX` wklejona z podłamaniem potrafiła
          # więc dopisać do biegu fałszywe `::error::` albo `::add-mask::`.
          # Uprawnienia do vaulta ma wprawdzie tylko operator, ale najczęstszy
          # wariant nie jest atakiem — to zwykły `\n` z kopiuj-wklej, po którym
          # werdykt przestaje się dać przeczytać. ESC leci z tego samego powodu
          # (sekwencje ANSI). Podmiana na spację, nie usunięcie: sklejone słowa
          # czytałyby się jak jedna, inna wartość.
          md() { printf '%s' "${1:-}" | tr '\n\r\t' '   ' | tr -d '\000-\037' | tr -d '`|' ; }
          present() { if [ -n "$(env_value "$1")" ]; then echo "ustawiony"; else echo "**BRAK**"; fi; }
          yn() { if [ "${1:-false}" = "true" ]; then echo "ustawiony"; else echo "**BRAK**"; fi; }

          enabled="$(env_value BACKUP_ENABLED)"

          # Komplet, bez którego backup.sh przerywa w `fail()` przed pierwszym
          # bajtem (patrz sekcja „Required configuration" tamże).
          missing_core=""
          for k in BACKUP_AGE_PUBLIC_KEY BACKUP_S3_BUCKET BACKUP_S3_ENDPOINT BACKUP_S3_ACCESS_KEY BACKUP_S3_SECRET_KEY; do
            [ -n "$(env_value "$k")" ] || missing_core="${missing_core} ${k}"
          done
          # Bez tych trzech artefakt `cv_corpus` zapisuje się jako `error` —
          # czyli korpus ~136 tys. CV nie jest kopiowany, cały bieg kończy się
          # niepowodzeniem, a retencja stoi. Reszta artefaktów jednak powstaje,
          # więc to inny stan niż „nie powstaje nic".
          missing_cv=""
          for k in OBJECT_STORAGE_ENDPOINT OBJECT_STORAGE_ACCESS_KEY OBJECT_STORAGE_SECRET_KEY; do
            [ -n "$(env_value "$k")" ] || missing_cv="${missing_cv} ${k}"
          done

          app_status="$(curl -fsS "${auth[@]}" "$base/api/v1/applications/$APP_UUID" 2>/dev/null \
            | jq -r '"\(.status // "?")|\(.last_online_at // "?")"' 2>/dev/null || echo "?|?")"

          R=/tmp/backup-status.md
          {
            echo "## Backup NEXUS — stan trzech bramek"
            echo
            echo "### 1. Vault Coolify — konfiguracja (wartości z allowlisty)"
            echo
            echo "| klucz | wartość |"
            echo "| --- | --- |"
            for k in $(printf '%s' "$VALUE_KEYS" | jq -r '.[]'); do
              v="$(md "$(env_value "$k")")"
              if [ -z "$v" ]; then
                echo "| \`${k}\` | _brak w vaultcie → obowiązuje default z docker-compose.yml_ |"
              else
                echo "| \`${k}\` | \`${v}\` |"
              fi
            done
            echo
            echo "### 2. Vault Coolify — sekrety (WYŁĄCZNIE obecność)"
            echo
            echo "| klucz | stan |"
            echo "| --- | --- |"
            for k in BACKUP_AGE_PUBLIC_KEY BACKUP_S3_ACCESS_KEY BACKUP_S3_SECRET_KEY \
                     BACKUP_S3_REGION BACKUP_S3_PROVIDER BACKUP_RUN_ON_START \
                     OBJECT_STORAGE_ENDPOINT OBJECT_STORAGE_ACCESS_KEY OBJECT_STORAGE_SECRET_KEY \
                     OBJECT_STORAGE_BUCKET OBJECT_STORAGE_REGION; do
              echo "| \`${k}\` | $(present "$k") |"
            done
            # Wykrywanie kluczy, których ta lista jeszcze nie zna — też bez wartości.
            others="$(jq -r --argjson allow "$VALUE_KEYS" '
              map(select(.key | test("^(BACKUP_|OBJECT_STORAGE_)")))
              | map(select(.key as $k | ($allow | index($k)) | not))
              | map(select(.key | test("^(BACKUP_AGE_PUBLIC_KEY|BACKUP_S3_ACCESS_KEY|BACKUP_S3_SECRET_KEY|BACKUP_S3_REGION|BACKUP_S3_PROVIDER|BACKUP_RUN_ON_START|OBJECT_STORAGE_ENDPOINT|OBJECT_STORAGE_ACCESS_KEY|OBJECT_STORAGE_SECRET_KEY|OBJECT_STORAGE_BUCKET|OBJECT_STORAGE_REGION)$") | not))
              | sort_by(.key) | .[]
              | "| `\(.key | gsub("[^A-Za-z0-9_]"; ""))` | \(if ((.value // .real_value // "") | length) > 0 then "ustawiony" else "**BRAK**" end) _(spoza listy tego kroku)_ |"
            ' /tmp/envs.json)"
            [ -n "$others" ] && printf '%s\n' "$others"
            echo
            echo "### 3. Kontener"
            echo
            echo "Zagregowany status aplikacji w Coolify: \`$(md "${app_status%%|*}")\` (ostatnio online: \`$(md "${app_status##*|}")\`)."
            echo
            echo "Coolify raportuje JEDEN status na całą aplikację compose, więc nie rozstrzyga on"
            echo "o samej usłudze \`backup\` — rozbicie per usługa jest tylko w panelu. Sonda"
            echo "\`backup/healthcheck.sh\` i tak bada wyłącznie ŻYWOTNOŚĆ pętli, nigdy powodzenie"
            echo "kopii; dowodem powodzenia jest \`LATEST.json\`, a tego czyta bramka nr 3."
            echo
            echo "### 4. GitHub — drill i monitoring (bramka nr 3)"
            echo
            echo "| pozycja | stan |"
            echo "| --- | --- |"
            echo "| sekret \`BACKUP_AGE_PRIVATE_KEY\` | $(yn "${HAS_DRILL_AGE_KEY:-false}") |"
            echo "| sekret \`BACKUP_S3_ACCESS_KEY\` | $(yn "${HAS_DRILL_S3_ACCESS:-false}") |"
            echo "| sekret \`BACKUP_S3_SECRET_KEY\` | $(yn "${HAS_DRILL_S3_SECRET:-false}") |"
            echo "| zmienna \`BACKUP_MONITORING_ENABLED\` | \`$(md "${VAR_MONITORING:-<brak>}")\` |"
            echo "| zmienna \`BACKUP_S3_BUCKET\` | \`$(md "${VAR_S3_BUCKET:-<brak>}")\` |"
            echo "| zmienna \`BACKUP_S3_ENDPOINT\` | \`$(md "${VAR_S3_ENDPOINT:-<brak>}")\` |"
            echo "| zmienna \`BACKUP_S3_REGION\` | \`$(md "${VAR_S3_REGION:-<brak>}")\` |"
            echo
          } > "$R"

          fail=0
          {
            echo "### WERDYKT"
            echo
            if [ "$enabled" != "true" ]; then
              fail=1
              echo "**KOPIA NIE POWSTAJE.** \`BACKUP_ENABLED\` = \`$(md "${enabled:-<brak klucza w vaultcie>}")\`,"
              echo "a \`backup/backup.sh\` kończy się na kill-switchu przy czymkolwiek innym niż \`true\`."
              echo "Kontener wygląda przy tym na zdrowy, bo pętla harmonogramu żyje — po prostu co noc"
              echo "nie robi nic. Nie powstał ani jeden bajt kopii off-site."
            elif [ -n "$missing_core" ]; then
              fail=1
              echo "**KOPIA NIE POWSTAJE.** Kill-switch jest otwarty, ale w vaultcie brakuje:"
              echo
              for k in $missing_core; do echo "- \`${k}\`"; done
              echo
              echo "\`backup.sh\` przerywa na tym w \`fail()\` przed pierwszym bajtem, \`loop.sh\` ponawia"
              echo "trzy razy i śpi do jutra. \`LATEST.json\` nie powstaje, więc monitoring świeżości"
              echo "też nie ma czego przeczytać."
            elif [ -n "$missing_cv" ]; then
              fail=1
              echo "**KOPIA POWSTAJE NIEPEŁNA — bez korpusu CV.** W vaultcie brakuje:"
              echo
              for k in $missing_cv; do echo "- \`${k}\`"; done
              echo
              echo "Artefakt \`cv_corpus\` zapisuje się jako \`error\`, cały bieg kończy się niepowodzeniem"
              echo "i retencja stoi (to akurat zachowanie POPRAWNE). Praktyczny skutek: \`pg_dump\` zachowuje"
              echo "tylko \`candidate_documents.storage_key\`, czyli WSKAŹNIKI — odtworzenie z takiej kopii"
              echo "da bazę pełną martwych odnośników do ~136 tys. plików CV."
            else
              echo "**Konfiguracja po stronie Coolify jest kompletna** — kill-switch otwarty, komplet"
              echo "kluczy S3/age i \`OBJECT_STORAGE_*\` obecny."
              echo
              echo "To NIE JEST dowód, że bajty wylądowały. Kompletna konfiguracja mówi tylko, że skrypt"
              echo "ma z czym wystartować. Dowodem jest świeży \`LATEST.json\` (job \`backup-freshness\`"
              echo "w \`uptime-probe.yml\`) i zielony \`backup-drill.yml\`."
            fi
            echo
            if [ "${HAS_DRILL_AGE_KEY:-false}" != "true" ] || [ "${HAS_DRILL_S3_ACCESS:-false}" != "true" ] \
               || [ "${HAS_DRILL_S3_SECRET:-false}" != "true" ]; then
              echo "⚠️ **Drill nie ma czym weryfikować** — brakuje sekretów repo, więc \`backup-drill.yml\`"
              echo "pada na pierwszym kroku. Dopóki drill nie przejdzie na zielono, kopię off-site należy"
              echo "traktować jak NIEISTNIEJĄCĄ: nikt nigdy nie odszyfrował ani nie odtworzył archiwum."
              echo
            fi
            if [ "${VAR_MONITORING:-}" != "true" ]; then
              echo "⚠️ **Monitoring świeżości jest pominięty** — \`BACKUP_MONITORING_ENABLED\` ≠ \`true\`,"
              echo "więc godzinowy job \`backup-freshness\` jest pomijany (skipped, nie failed). Zatrzymanie"
              echo "się backupów nie ma dziś ŻADNEGO objawu."
              echo
            fi
            echo "Kroki naprawcze, po kolei: \`docs/runbook-backup-201.md\`."
          } >> "$R"

          cat "$R"
          cat "$R" >> "$GITHUB_STEP_SUMMARY"

          if [ "$fail" -ne 0 ]; then
            echo "::error::Kopia zapasowa NIE jest produkowana w komplecie — werdykt w podsumowaniu biegu i w docs/runbook-backup-201.md"
            exit 1
          fi

  # ─── A/B evalu matchingu na produkcji ────────────────────────────────────
  # Po naprawie martwej nogi BM25 (#1218) trzeba ZMIERZYĆ, czy hybryda cokolwiek
  # wnosi. Lokalnie się nie da i nie chodzi o wygodę: baza testowa ma sześć ofert
  # z ground truth, nie ma Qdranta ani klucza Voyage — a przy pustej puli harness
  # podstawia „pierwsze N kandydatów po id" (gałąź `fallback` w
  # scripts/eval_matching.py). Oba ramiona mierzyłyby wtedy tę samą fikcję,
  # ramię ON wygrałoby o klasę i dostalibyśmy pewny siebie fałsz. SSH nie ma,
  # token Coolify jest w sekretach repo i używa go job `ops` wyżej — stąd ten kanał.
  #
  # ══ KRYTERIUM ODCZYTU — przeczytaj ZANIM spojrzysz na deltę ══
  #
  # 1. Ramię OFF to KONTROLA PRZYRZĄDU, nie „druga wersja". Musi odtworzyć znany
  #    baseline z 18.08 (zbiór A, pula 2000, wagi 60/10/15/5/0, champion maskowany):
  #    P@5 0.248 · R@20n 0.199 · MRR 0.461 · nDCG 0.162
  #    (docs/matching-improvements-r2-2026-08-18.md). Jeśli OFF go NIE odtwarza,
  #    między pomiarami zmieniło się coś jeszcze — dane, inna flaga w vaultcie,
  #    inny zbiór przez `eval_jobs` < 50 — i DELTY NIE WOLNO CZYTAĆ, bo nie wiadomo,
  #    czemu ją przypisać.
  # 2. Jeśli obie liczby wyjdą IDENTYCZNE co do trzeciego miejsca, to nie jest wynik
  #    pomiaru, tylko sygnatura PUSTEJ LISTY BM25 — dokładnie ta pomyłka unieważniła
  #    A/B z 18.08, gdzie „zero delty" wpisano jako sufit architektury. Dlatego
  #    komenda drukuje osobne sekcje BM25: w ramieniu ON linie
  #    `[retrieval-pool] hybryda: bm25=<n>` MUSZĄ mieć n > 0. `bm25=n/d` znaczy, że
  #    nikt nie podał `bm25_query` na callsicie; `bm25=0` — że terminy są, ale nie
  #    trafiają (pytanie o taksonomię, nie o kod). W ramieniu OFF tych linii nie ma
  #    wcale, bo ścieżka hybrydowa się nie wykonuje.
  # 3. W nagłówku raportu „Voyage API key configured" musi być **yes**. Przy `no`
  #    warstwa semantyczna jest bezwładna, pula spada do fallbacku po id i oba
  #    ramiona mierzą fikcję (patrz wyżej).
  # 4. Pusta sekcja `NEXUS-EVAL-OFF`/`-ON` to NIE „zero wyników", tylko brak
  #    raportu — czyli harness padł. Odpowiedź jest wtedy w `NEXUS-EVAL-TAIL-*`
  #    (ogon logu z tracebackiem). Bieg bez tych sekcji jest nieudany, a nie
  #    ujemny; delty nie ma czego dotyczyć.
  #
  # ══ Dlaczego tak, a nie inaczej ══
  #
  # - Flagi jadą jako env PRZED procesem (`HYBRID_POOL_ENABLED=… python -m …`), a NIE
  #   flipem w vaultcie Coolify: flip w vaultcie zmienia zachowanie PRODUKCJI przed
  #   pomiarem i wymaga restartu, więc mierzylibyśmy dwa różne stany aplikacji
  #   zamiast dwóch ramion na tym samym.
  # - `RERANKER_ENABLED=false` w OBU ramionach — rerank przestawia kolejność WEWNĄTRZ
  #   puli, a mierzymy retrieval, czyli członkostwo puli. Zostawiony mieszałby dwie
  #   dźwignie w jednej liczbie. W ramieniu OFF jest to dziś no-op (bez hybrydy
  #   `hybrid_search` w ogóle się nie wykonuje), ale symetria nic nie kosztuje
  #   i broni pomiaru przed zmianą domyślnej ścieżki puli.
  # - `container: backend` — nazwa serwisu z docker-compose.yml. Puste `container`
  #   przy wielo-serwisowym stacku wywala zadanie przed uruchomieniem czegokolwiek
  #   (audyt w jobie `ops` wyżej).
  # - Zero `curl` w komendzie — obraz aplikacji go nie ma (druga przyczyna z tamtego
  #   audytu). Raport czytamy `head`em, diagnostykę BM25 `grep`em, ogon logu `tail`em
  #   — wszystko z coreutils obrazu `python:3.13-slim`.
  # - `frequency: * * * * *` + katalog-blokada `mkdir` daje semantykę JEDNORAZOWĄ:
  #   pierwsze odpalenie zakłada katalog i liczy, każde kolejne wywraca się na `mkdir`
  #   i NIE uruchamia evalu drugi raz. Skutek uboczny, którego należy się spodziewać
  #   w `action=eval-read`: każda kolejna minuta dokłada wykonanie `failed` z „mkdir:
  #   File exists" — to jest blokada działająca zgodnie z projektem, nie awaria; wynik
  #   siedzi w tym jedynym wykonaniu z sentinelem. Zadanie kasuje krok `if: always()`,
  #   więc anulowanie workflow też sprząta; gdyby mimo to zostało — `action=eval-stop`.
  # - Komenda nie zawiera apostrofów, `$` ani backticków (jest na to twardy guard):
  #   nie wiemy, czy Coolify opakowuje ją w `sh -c '…'` czy w cudzysłów, a
  #   podstawienie po złej stronie tego opakowania wykonałoby się na hoście, nie
  #   w kontenerze.
  # ── client-lookup ────────────────────────────────────────────────────────
  #
  # Po co: kilka polityk domenowych jest bramkowanych LISTĄ `client_id` w env
  # (MULTI_CONSULTANT_ORDER_CLIENT_IDS, COST_ORDER_CLIENT_IDS,
  # BANK_POCZTOWY_ORDER_EXTRACTION_CLIENT_IDS, CREDIT_AGRICOLE_..., ERSTE_...).
  # Bramka po ID jest świadoma (Traffit nadpisuje `Client.name`), ale numeru nie
  # widać ani w repo, ani w interfejsie — a SSH na tym serwerze nie działa.
  # Bez tego kanału WŁĄCZENIE dowolnej takiej polityki wymagało panelu Coolify.
  #
  # Ten sam mechanizm co eval (zadanie jednorazowe → odczyt wykonania → kasacja),
  # ale nieporównanie tańszy: kilka SELECT-ów, sekundy zamiast godzin.
  #
  # `--with-links` dokłada kontrakty i umowy B2B przypięte do znalezionych
  # klientów — to materiał do rozstrzygnięcia pomyłki „dwa podobnie nazwane
  # rekordy klienta", której nie widać z interfejsu. Wyjście niesie
  # IDENTYFIKATORY, statusy i samo nazwisko konsultanta: log Actions ma pozwolić
  # wskazać wiersz do poprawki, a nie odtworzyć kartotekę. Zero kwot.
  lookup:
    name: Client lookup (prod, read-only)
    if: ${{ inputs.action == 'client-lookup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: coolify-client-lookup
      cancel-in-progress: false
    env:
      CO_URL: ${{ secrets.COOLIFY_URL }}
      CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
      TASK_NAME: nexus-client-lookup-oneshot
      SENTINEL: ===NEXUS-LOOKUP-END===
      NEEDLE: ${{ inputs.client_like }}
    steps:
      - name: Lookup
        id: lookup
        run: |
          set -euo pipefail
          base="${CO_URL%/}"
          auth=(-H "Authorization: Bearer ${CO_TOKEN}" -H "Accept: application/json")

          # ── allowlista wejścia ─────────────────────────────────────────────
          # Odrzucamy, nie „czyścimy": ciche wycięcie znaku zmieniłoby zapytanie
          # w coś, o co operator nie prosił, a on zobaczyłby wynik dla INNEGO
          # filtra i uznał go za odpowiedź na swoje pytanie.
          needle="$(printf %s "${NEEDLE:-}" | tr [:upper:] [:lower:])"
          # `case`, NIE `grep -qE`. To nie kosmetyka: `grep` dopasowuje LINIAMI,
          # więc wartość wieloliniowa przechodzi, gdy pasuje pierwsza linia —
          # a nowa linia w komendzie powłoki jest separatorem poleceń. Wzorzec
          # `case` obejmuje CAŁY łańcuch razem ze znakami nowej linii.
          # (Sprawdzone: "cardif\n; rm -rf /" przechodziło przez grep, `case`
          # odrzuca.) Guard na `'`/`$`/backtick niżej też by tego nie złapał.
          case "$needle" in
            "") echo "::error::client_like jest wymagane dla action=client-lookup"; exit 1;;
            *[!a-z0-9.-]*) echo "::error::client_like dopuszcza wylacznie [a-z0-9.-] (BEZ spacji)"; exit 1;;
            [!a-z0-9]*) echo "::error::client_like musi zaczynac sie od litery albo cyfry"; exit 1;;
          esac
          if [ "${#needle}" -gt 40 ]; then
            echo "::error::client_like moze miec najwyzej 40 znakow"
            exit 1
          fi

          # 2>&1 jest nośne: argparse i traceback piszą na STDERR, a sentinel
          # leci po średniku, więc bez przekierowania nieudany skrypt oddałby
          # wykonanie zawierające SAM sentinel — co czyta się jak „zero klientów",
          # a nie jak awaria. Cisza nie może wyglądać jak wynik.
          CMD="cd /app && python -m scripts.list_clients --like ${needle} --with-links 2>&1 ; echo ${SENTINEL}"
          # Ten sam guard co przy evalu: nie wiemy, czy Coolify opakowuje komendę
          # w sh -c z apostrofami, czy w cudzysłów.
          case "$CMD" in
            *"'"*|*'$'*|*'`'*) echo "::error::komenda zawiera znak zalezny od opakowania"; exit 1;;
          esac
          echo "=== komenda (read-only, bez sekretow) ==="
          echo "$CMD"

          # ── pozostałość po poprzednim biegu ────────────────────────────────
          tasks=$(curl -fsS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks")
          existing=$(echo "$tasks" | jq -r --arg n "$TASK_NAME" 'if type=="array" then (map(select(.name==$n)) | .[0].uuid // "") else "" end')
          if [ -n "$existing" ]; then
            echo "sprzatam pozostalosc po poprzednim biegu (uuid=$existing)"
            curl -sS -o /dev/null -X DELETE "${auth[@]}" \
              "$base/api/v1/applications/$APP_UUID/scheduled-tasks/$existing" || true
          fi

          payload=$(jq -n --arg n "$TASK_NAME" --arg c "$CMD" --arg ct backend \
            '{name:$n, command:$c, frequency:"* * * * *", container:$ct, enabled:true}')
          code=$(curl -sS -o /tmp/create.json -w "%{http_code}" -X POST "${auth[@]}" \
            -H "Content-Type: application/json" -d "$payload" \
            "$base/api/v1/applications/$APP_UUID/scheduled-tasks" || echo 000)
          echo "create HTTP $code"
          if [ "$code" -ge 400 ] 2>/dev/null || [ "$code" = "000" ]; then
            jq -r '.message // .error // "request failed"' /tmp/create.json 2>/dev/null || true
            exit 1
          fi
          uuid=$(jq -r '(.uuid // .task.uuid // .data.uuid // "")' /tmp/create.json 2>/dev/null || echo "")
          if [ -z "$uuid" ]; then
            uuid=$(curl -fsS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks" \
              | jq -r --arg n "$TASK_NAME" 'if type=="array" then (map(select(.name==$n)) | .[0].uuid // "") else "" end')
          fi
          [ -n "$uuid" ] || { echo "::error::utworzono zadanie, ale nie znam jego uuid — skasuj recznie ($TASK_NAME)"; exit 1; }
          echo "TASK_UUID=$uuid" >> "$GITHUB_ENV"

          deadline=$(( $(date -u +%s) + 8 * 60 ))
          msg=""
          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            sleep 20
            execs=$(curl -sS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks/$uuid/executions" || echo '[]')
            msg=$(echo "$execs" | jq -r --arg s "$SENTINEL" \
              'if type=="array" then (map(select((.message // "") | contains($s))) | .[0].message // "") else "" end' 2>/dev/null || echo "")
            [ -n "$msg" ] && break
            echo "$(date -u +%H:%M:%S) czekam… statusy: $(echo "$execs" | jq -r 'if type=="array" then ([.[].status] | join(",")) else "?" end' 2>/dev/null || echo '?')"
          done
          if [ -z "$msg" ]; then
            echo "::error::brak wykonania z sentinelem w 8 minut"
            exit 1
          fi
          echo ""
          echo "$msg"

      # Kasacja przy KAŻDYM wyniku — zostawiony cron chodziłby co minutę na
      # produkcji. Ta sama reguła co przy evalu.
      - name: Skasuj zadanie jednorazowe
        if: ${{ always() && inputs.action == 'client-lookup' }}
        env:
          LOOKUP_OUTCOME: ${{ steps.lookup.outcome }}
        run: |
          set -uo pipefail
          base="${CO_URL%/}"
          auth=(-H "Authorization: Bearer ${CO_TOKEN}" -H "Accept: application/json")
          uuid="${TASK_UUID:-}"
          if [ -z "$uuid" ]; then
            uuid=$(curl -sS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks" \
              | jq -r --arg n "$TASK_NAME" 'if type=="array" then (map(select(.name==$n)) | .[0].uuid // "") else "" end' 2>/dev/null || echo "")
          fi
          [ -n "$uuid" ] || { echo "brak zadania $TASK_NAME — nie ma czego kasowac"; exit 0; }
          if [ "${LOOKUP_OUTCOME:-}" != "success" ]; then
            echo "=== surowe wykonania przed skasowaniem (bieg '${LOOKUP_OUTCOME:-?}') ==="
            curl -sS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks/$uuid/executions" \
              | jq -r 'if type=="array" then (.[] | "[" + (.status // "?") + "] " + ((.message // "") | .[0:1500])) else "brak wykonan" end' 2>/dev/null || true
          fi
          curl -sS -o /dev/null -X DELETE "${auth[@]}" \
            "$base/api/v1/applications/$APP_UUID/scheduled-tasks/$uuid" || true
          echo "zadanie $TASK_NAME skasowane"

  # ── migration-receipts ───────────────────────────────────────────────────
  #
  # Po co: migracje naprawiające dane (0243, 0250, 0262 …) są jednorazowe
  # i zostawiają po sobie WYŁĄCZNIE wiersz w `app_settings` — liczniki i ID
  # tego, co faktycznie zmieniły. To jedyny dowód, że naprawa się wykonała
  # i ilu wierszy dotknęła; bez tego kanału odczyt wymagał panelu Coolify albo
  # SSH, a SSH na tym serwerze nie działa.
  #
  # Ten sam mechanizm co client-lookup (zadanie jednorazowe → odczyt wykonania
  # → kasacja) i ta sama klasa danych na wyjściu: liczniki i IDENTYFIKATORY,
  # zero kwot i zero nazwisk. Skrypt czyta WYŁĄCZNIE klucze o kształcie
  # paragonu migracji, więc kanałem nie da się przeczytać ustawień kolumn
  # użytkowników ani manifestu portfela klientów, które leżą w tej samej tabeli.
  receipts:
    name: Migration receipts (prod, read-only)
    if: ${{ inputs.action == 'migration-receipts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: coolify-migration-receipts
      cancel-in-progress: false
    env:
      CO_URL: ${{ secrets.COOLIFY_URL }}
      CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
      TASK_NAME: nexus-migration-receipts-oneshot
      SENTINEL: ===NEXUS-RECEIPTS-END===
      RECEIPT_KEY: ${{ inputs.receipt_key }}
    steps:
      - name: Odczytaj paragony
        id: receipts
        run: |
          set -euo pipefail
          base="${CO_URL%/}"
          auth=(-H "Authorization: Bearer ${CO_TOKEN}" -H "Accept: application/json")

          # ── allowlista wejścia ─────────────────────────────────────────────
          # Odrzucamy, nie „czyścimy": ciche wycięcie znaku zmieniłoby zapytanie
          # w coś, o co operator nie prosił, a on zobaczyłby paragon INNEJ
          # migracji i uznał go za odpowiedź na swoje pytanie. Pusty klucz jest
          # legalny — wypisuje wszystkie paragony.
          key="$(printf %s "${RECEIPT_KEY:-}" | tr [:upper:] [:lower:])"
          # `case`, NIE `grep -qE`. To nie kosmetyka: `grep` dopasowuje LINIAMI,
          # więc wartość wieloliniowa przechodzi, gdy pasuje pierwsza linia —
          # a nowa linia w komendzie powłoki jest separatorem poleceń. Wzorzec
          # `case` obejmuje CAŁY łańcuch razem ze znakami nowej linii.
          case "$key" in
            "") ;;
            *[!a-z0-9_]*) echo "::error::receipt_key dopuszcza wylacznie [a-z0-9_] (BEZ spacji)"; exit 1;;
            [!0-9]*) echo "::error::receipt_key zaczyna sie od numeru rewizji, np. 0262_separate_md_periodic"; exit 1;;
          esac
          if [ "${#key}" -gt 100 ]; then
            echo "::error::receipt_key moze miec najwyzej 100 znakow"
            exit 1
          fi
          arg=""
          if [ -n "$key" ]; then
            arg="--key ${key}"
          fi

          # 2>&1 jest nośne: argparse i traceback piszą na STDERR, a sentinel
          # leci po średniku, więc bez przekierowania nieudany skrypt oddałby
          # wykonanie zawierające SAM sentinel — co czyta się jak „zero
          # paragonów", a nie jak awaria. Cisza nie może wyglądać jak wynik.
          CMD="cd /app && python -m scripts.show_migration_receipts ${arg} 2>&1 ; echo ${SENTINEL}"
          # Ten sam guard co przy client-lookup: nie wiemy, czy Coolify opakowuje
          # komendę w sh -c z apostrofami, czy w cudzysłów.
          case "$CMD" in
            *"'"*|*'$'*|*'`'*) echo "::error::komenda zawiera znak zalezny od opakowania"; exit 1;;
          esac
          echo "=== komenda (read-only, bez sekretow) ==="
          echo "$CMD"

          # ── pozostałość po poprzednim biegu ────────────────────────────────
          tasks=$(curl -fsS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks")
          existing=$(echo "$tasks" | jq -r --arg n "$TASK_NAME" 'if type=="array" then (map(select(.name==$n)) | .[0].uuid // "") else "" end')
          if [ -n "$existing" ]; then
            echo "sprzatam pozostalosc po poprzednim biegu (uuid=$existing)"
            curl -sS -o /dev/null -X DELETE "${auth[@]}" \
              "$base/api/v1/applications/$APP_UUID/scheduled-tasks/$existing" || true
          fi

          payload=$(jq -n --arg n "$TASK_NAME" --arg c "$CMD" --arg ct backend \
            '{name:$n, command:$c, frequency:"* * * * *", container:$ct, enabled:true}')
          code=$(curl -sS -o /tmp/create.json -w "%{http_code}" -X POST "${auth[@]}" \
            -H "Content-Type: application/json" -d "$payload" \
            "$base/api/v1/applications/$APP_UUID/scheduled-tasks" || echo 000)
          echo "create HTTP $code"
          if [ "$code" -ge 400 ] 2>/dev/null || [ "$code" = "000" ]; then
            jq -r '.message // .error // "request failed"' /tmp/create.json 2>/dev/null || true
            exit 1
          fi
          uuid=$(jq -r '(.uuid // .task.uuid // .data.uuid // "")' /tmp/create.json 2>/dev/null || echo "")
          if [ -z "$uuid" ]; then
            uuid=$(curl -fsS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks" \
              | jq -r --arg n "$TASK_NAME" 'if type=="array" then (map(select(.name==$n)) | .[0].uuid // "") else "" end')
          fi
          [ -n "$uuid" ] || { echo "::error::utworzono zadanie, ale nie znam jego uuid — skasuj recznie ($TASK_NAME)"; exit 1; }
          echo "TASK_UUID=$uuid" >> "$GITHUB_ENV"

          deadline=$(( $(date -u +%s) + 8 * 60 ))
          msg=""
          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            sleep 20
            execs=$(curl -sS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks/$uuid/executions" || echo '[]')
            msg=$(echo "$execs" | jq -r --arg s "$SENTINEL" \
              'if type=="array" then (map(select((.message // "") | contains($s))) | .[0].message // "") else "" end' 2>/dev/null || echo "")
            [ -n "$msg" ] && break
            echo "$(date -u +%H:%M:%S) czekam… statusy: $(echo "$execs" | jq -r 'if type=="array" then ([.[].status] | join(",")) else "?" end' 2>/dev/null || echo '?')"
          done
          if [ -z "$msg" ]; then
            echo "::error::brak wykonania z sentinelem w 8 minut"
            exit 1
          fi
          echo ""
          echo "$msg"

      # Kasacja przy KAŻDYM wyniku — zostawiony cron chodziłby co minutę na
      # produkcji. Ta sama reguła co przy client-lookup.
      - name: Skasuj zadanie jednorazowe
        if: ${{ always() && inputs.action == 'migration-receipts' }}
        env:
          RECEIPTS_OUTCOME: ${{ steps.receipts.outcome }}
        run: |
          set -uo pipefail
          base="${CO_URL%/}"
          auth=(-H "Authorization: Bearer ${CO_TOKEN}" -H "Accept: application/json")
          uuid="${TASK_UUID:-}"
          if [ -z "$uuid" ]; then
            uuid=$(curl -sS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks" \
              | jq -r --arg n "$TASK_NAME" 'if type=="array" then (map(select(.name==$n)) | .[0].uuid // "") else "" end' 2>/dev/null || echo "")
          fi
          [ -n "$uuid" ] || { echo "brak zadania $TASK_NAME — nie ma czego kasowac"; exit 0; }
          if [ "${RECEIPTS_OUTCOME:-}" != "success" ]; then
            echo "=== surowe wykonania przed skasowaniem (bieg '${RECEIPTS_OUTCOME:-?}') ==="
            curl -sS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks/$uuid/executions" \
              | jq -r 'if type=="array" then (.[] | "[" + (.status // "?") + "] " + ((.message // "") | .[0:1500])) else "brak wykonan" end' 2>/dev/null || true
          fi
          curl -sS -o /dev/null -X DELETE "${auth[@]}" \
            "$base/api/v1/applications/$APP_UUID/scheduled-tasks/$uuid" || true
          echo "zadanie $TASK_NAME skasowane"

  candidate_index_audit:
    name: Candidate index (${{ inputs.action == 'candidate-index-audit' && inputs.candidate_search_diagnostics && 'runtime diagnostics' || inputs.action == 'candidate-index-repair' && 'enqueue reviewed repair' || 'read-only audit' }})
    if: ${{ inputs.action == 'candidate-index-audit' || inputs.action == 'candidate-index-repair' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: coolify-candidate-index-audit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the selected fixed index operation
        env:
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          INDEX_MODE: ${{ inputs.action == 'candidate-index-audit' && inputs.candidate_search_diagnostics && 'diagnostics' || inputs.action == 'candidate-index-repair' && 'repair' || 'audit' }}
          INDEX_AUDIT_IDENTITY: ${{ inputs.index_audit_identity }}
          INDEX_FINGERPRINT: ${{ inputs.index_fingerprint }}
        run: python3 .github/scripts/candidate-index-audit-ops.py
      - name: Preserve aggregate coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.action }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-index-*/report.json
          if-no-files-found: error
          retention-days: 7

  # Audyt jest read-only. Apply ma trzy niezależne bezpieczniki: fingerprint
  # identyczny z audytem, jawne APPLY w dispatchu i repo secret ustawiony na
  # hash akceptacji obejmujący plan ORAZ wszystkie decyzje źródeł stawek.
  # Do Actions wychodzi tylko zredagowany raport: ID, kody, liczniki i hash;
  # pełny raport z nazwami/stawkami pozostaje w /tmp kontenera i jest kasowany.
  contract_merge:
    name: Contract merge (${{ inputs.action == 'contract-merge-apply' && 'APPLY' || 'audit' }})
    if: ${{ startsWith(inputs.action, 'contract-merge-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: coolify-contract-merge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Uruchom audyt albo zatwierdzony plan
        # Production credentials and the one-shot approval hash are visible
        # only to our shell step, never to checkout or artifact actions.
        env:
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          TASK_NAME: nexus-contract-merge-oneshot
          SENTINEL: ===NEXUS-CONTRACT-MERGE-END===
          PAYLOAD_BEGIN: ===NEXUS-CONTRACT-MERGE-PAYLOAD-BEGIN===
          PAYLOAD_END: ===NEXUS-CONTRACT-MERGE-PAYLOAD-END===
          MODE: ${{ inputs.action == 'contract-merge-apply' && 'apply' || 'audit' }}
          PLAN_FINGERPRINT: ${{ inputs.contract_merge_fingerprint }}
          CANDIDATE_RATE_SOURCES: ${{ inputs.contract_merge_candidate_rate_sources }}
          CLIENT_RATE_SOURCES: ${{ inputs.contract_merge_client_rate_sources }}
          FRAMEWORK_RATE_SOURCES: ${{ inputs.contract_merge_framework_rate_sources }}
          RATE_METADATA_SOURCES: ${{ inputs.contract_merge_rate_metadata_sources }}
          FIELD_SOURCES: ${{ inputs.contract_merge_field_sources }}
          ALLOW_RATE_EMPTY_METADATA: ${{ inputs.contract_merge_allow_rate_empty_metadata }}
          APPLY_CONFIRMATION: ${{ inputs.contract_merge_confirm }}
          APPLY_UNLOCK: ${{ inputs.action == 'contract-merge-apply' && secrets.CONTRACT_MERGE_APPLY_UNLOCK || '' }}
          OPS_RUN_ID: ${{ github.run_id }}
          OPS_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash .github/scripts/contract-merge-ops.sh

      # Artefakt dziedziczy widoczność repozytorium i szybko wygasa. Skrypt
      # tworzy go z zamkniętej allowlisty; nie zawiera nazw ani kwot.
      - name: Zachowaj zredagowany raport
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-merge-${{ inputs.action }}-${{ github.run_id }}
          path: ${{ runner.temp }}/contract-merge/
          if-no-files-found: error
          retention-days: 7

  nexus_data_correction:
    name: Nexus data correction (${{ inputs.action == 'nexus-data-correction-apply' && 'APPLY' || 'audit' }})
    if: ${{ startsWith(inputs.action, 'nexus-data-correction-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: coolify-nexus-data-correction
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Uruchom audyt albo zatwierdzony plan Nexus.xlsx
        # Apply is unlocked out-of-band: after the exact audit is accepted,
        # NEXUS_DATA_CORRECTION_APPLY_UNLOCK must be set to that audit's
        # approval hash. It cannot be supplied as a workflow-dispatch input.
        env:
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          TASK_NAME: nexus-data-correction-oneshot
          SENTINEL: ===NEXUS-DATA-CORRECTION-END===
          PAYLOAD_BEGIN: ===NEXUS-DATA-CORRECTION-PAYLOAD-BEGIN===
          PAYLOAD_END: ===NEXUS-DATA-CORRECTION-PAYLOAD-END===
          MODE: ${{ inputs.action == 'nexus-data-correction-apply' && 'apply' || 'audit' }}
          PLAN_FINGERPRINT: ${{ inputs.nexus_data_correction_fingerprint }}
          APPLY_CONFIRMATION: ${{ inputs.nexus_data_correction_confirm }}
          APPLY_UNLOCK: ${{ inputs.action == 'nexus-data-correction-apply' && secrets.NEXUS_DATA_CORRECTION_APPLY_UNLOCK || '' }}
          OPS_RUN_ID: ${{ github.run_id }}
          OPS_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash .github/scripts/nexus-data-correction-ops.sh

      - name: Zachowaj zredagowany raport korekty
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-data-correction-${{ inputs.action }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nexus-data-correction/
          if-no-files-found: error
          retention-days: 7

  eval:
    name: Matching eval A/B (prod)
    if: ${{ inputs.action == 'eval-ab' || inputs.action == 'eval-read' || inputs.action == 'eval-stop' }}
    runs-on: ubuntu-latest
    # Budżet wyprowadzony z jedynego znanego punktu odniesienia: cotygodniowy
    # strażnik (app/tasks/weekly_eval.py) daje 3600 s JEDNEMU biegowi na tych
    # samych 50 ofertach, ale przy puli 1000. Tu pula jest dwukrotnie większa
    # i ramiona są dwa, więc godzina to za mało — a timeout jest kosztowny
    # asymetrycznie: krok sprzątający kasuje zadanie razem z jego wykonaniami,
    # więc urwany pomiar znika bezpowrotnie (proces w kontenerze biegnie dalej,
    # ale nie ma czym odczytać jego plików). Stąd zapas, nie oszczędność.
    timeout-minutes: 170
    # Osobny job, NIE wspólna `concurrency` całego workflow: kolejkowanie pilnego
    # `cancel` za wielogodzinnym evalem byłoby gorsze niż brak tego kanału.
    concurrency:
      group: coolify-eval-ab
      cancel-in-progress: false
    env:
      CO_URL: ${{ secrets.COOLIFY_URL }}
      CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
      # Stała nazwa, żeby eval-read i eval-stop znajdowały zadanie bez podawania
      # UUID-a — i żeby drugi bieg zobaczył pozostałość po poprzednim.
      TASK_NAME: nexus-eval-ab-oneshot
      SENTINEL: ===NEXUS-EVAL-END===
    steps:
      # Zamrożony zbiór ofert czytamy Z REPO (backend/scripts/eval_frozen_set.py),
      # a nie przepisujemy do YAML-a: druga kopia listy 50 id rozjechałaby się
      # z pierwszą przy najbliższej zmianie, a porównywalność między pomiarami
      # opiera się właśnie na tym, że ten zbiór NIE dryfuje.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.action == 'eval-ab'

      - name: Odpal jednorazowy A/B
        id: ab
        if: inputs.action == 'eval-ab'
        env:
          EVAL_SET: ${{ inputs.eval_set }}
          EVAL_JOBS: ${{ inputs.eval_jobs }}
          EVAL_POOL: ${{ inputs.eval_pool }}
        run: |
          set -euo pipefail
          base="${CO_URL%/}"
          auth=(-H "Authorization: Bearer ${CO_TOKEN}" -H "Accept: application/json")

          # ── walidacja wejść ────────────────────────────────────────────────
          # Wchodzą do komendy uruchamianej na produkcji, więc muszą być liczbą
          # w zakresie, a nie „czymś, co wygląda na liczbę".
          case "$EVAL_JOBS" in ''|*[!0-9]*) echo "::error::eval_jobs musi być liczbą"; exit 1;; esac
          case "$EVAL_POOL" in ''|*[!0-9]*) echo "::error::eval_pool musi być liczbą"; exit 1;; esac
          [ "$EVAL_JOBS" -ge 1 ] && [ "$EVAL_JOBS" -le 50 ] || { echo "::error::eval_jobs poza 1-50"; exit 1; }
          [ "$EVAL_POOL" -ge 100 ] && [ "$EVAL_POOL" -le 5000 ] || { echo "::error::eval_pool poza 100-5000"; exit 1; }
          if [ "$EVAL_JOBS" -lt 50 ]; then
            echo "::warning::eval_jobs=$EVAL_JOBS — to PODZBIÓR zamrożonego zbioru, więc ramię OFF nie odtworzy baselinu i delta jest nieczytelna"
          fi

          IDS=$(python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "backend")
          from scripts.eval_frozen_set import frozen_ids_csv, frozen_ids_csv_b
          print(frozen_ids_csv_b() if os.environ["EVAL_SET"] == "B" else frozen_ids_csv())
          PY
          )
          case "$IDS" in
            *[!0-9,]*|'') echo "::error::lista ofert z eval_frozen_set.py ma nieoczekiwany kształt"; exit 1;;
          esac
          echo "zbiór $EVAL_SET: $(echo "$IDS" | tr ',' '\n' | wc -l) ofert, pula $EVAL_POOL, jobs $EVAL_JOBS"

          # ── komenda (ZAHARDKODOWANA; operator wnosi tylko liczby wyżej) ─────
          LOCK="/tmp/nexus-eval-${GITHUB_RUN_ID}"
          ARGS="--job-ids ${IDS} --jobs ${EVAL_JOBS} --min-gt 3 --pool ${EVAL_POOL}"
          # Ogon obu logów leci ZAWSZE, nie tylko przy błędzie: gdy harness się
          # wywróci, raportu nie ma i `head` wypisuje pustkę, więc sekcja OFF/ON
          # wyglądałaby jak „zero wyników" zamiast jak awaria. Trzy linie ogona
          # dają traceback (albo ostatni log postępu) i rozstrzygają tę różnicę.
          CMD="cd /app && mkdir ${LOCK} && { HYBRID_POOL_ENABLED=false RERANKER_ENABLED=false python -m scripts.eval_matching ${ARGS} --output ${LOCK}/off.md > ${LOCK}/off.log 2>&1 ; HYBRID_POOL_ENABLED=true RERANKER_ENABLED=false python -m scripts.eval_matching ${ARGS} --output ${LOCK}/on.md > ${LOCK}/on.log 2>&1 ; echo ===NEXUS-EVAL-OFF=== ; head -n 32 ${LOCK}/off.md ; echo ===NEXUS-EVAL-BM25-OFF=== ; grep -c bm25= ${LOCK}/off.log ; grep -m 3 bm25= ${LOCK}/off.log ; echo ===NEXUS-EVAL-TAIL-OFF=== ; tail -n 12 ${LOCK}/off.log ; echo ===NEXUS-EVAL-ON=== ; head -n 32 ${LOCK}/on.md ; echo ===NEXUS-EVAL-BM25-ON=== ; grep -c bm25= ${LOCK}/on.log ; grep -m 3 bm25= ${LOCK}/on.log ; echo ===NEXUS-EVAL-TAIL-ON=== ; tail -n 12 ${LOCK}/on.log ; echo ${SENTINEL} ; }"
          # Guard, nie kosmetyka: apostrof/`$`/backtick zachowują się różnie w
          # zależności od tego, jak Coolify opakuje komendę — a tego nie wiemy.
          case "$CMD" in
            *"'"*|*'$'*|*'`'*) echo "::error::komenda zawiera znak zależny od sposobu opakowania przez Coolify"; exit 1;;
          esac
          echo "=== komenda (nasza, bez sekretów — do ręcznego wklejenia w panel, gdyby API odmówiło) ==="
          echo "$CMD"

          # ── pozostałość po poprzednim biegu ────────────────────────────────
          tasks=$(curl -fsS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks")
          existing=$(echo "$tasks" | jq -r --arg n "$TASK_NAME" 'if type=="array" then (map(select(.name==$n)) | .[0].uuid // "") else "" end')
          if [ -n "$existing" ]; then
            echo "::error::zadanie $TASK_NAME już istnieje (uuid=$existing) — to cron co minutę na prodzie. Odpal action=eval-stop i dopiero potem ponów."
            exit 1
          fi

          # ── utworzenie zadania ─────────────────────────────────────────────
          payload=$(jq -n --arg n "$TASK_NAME" --arg c "$CMD" --arg ct backend \
            '{name:$n, command:$c, frequency:"* * * * *", container:$ct, enabled:true}')
          code=$(curl -sS -o /tmp/create.json -w "%{http_code}" -X POST "${auth[@]}" \
            -H "Content-Type: application/json" -d "$payload" \
            "$base/api/v1/applications/$APP_UUID/scheduled-tasks" || echo 000)
          echo "create HTTP $code"
          if [ "$code" = "404" ] || [ "$code" = "405" ] || [ "$code" = "501" ]; then
            echo "::error::ta wersja Coolify nie wystawia POST na /applications/{uuid}/scheduled-tasks. Załóż zadanie RĘCZNIE w panelu (name=$TASK_NAME, container=backend, frequency=* * * * *, komenda wydrukowana wyżej), poczekaj, potem action=eval-read i na koniec action=eval-stop."
            exit 1
          fi
          if [ "$code" -ge 400 ] 2>/dev/null || [ "$code" = "000" ]; then
            jq -r '.message // .error // "request failed"' /tmp/create.json 2>/dev/null || true
            exit 1
          fi
          uuid=$(jq -r '(.uuid // .task.uuid // .data.uuid // "")' /tmp/create.json 2>/dev/null || echo "")
          if [ -z "$uuid" ]; then
            uuid=$(curl -fsS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks" \
              | jq -r --arg n "$TASK_NAME" 'if type=="array" then (map(select(.name==$n)) | .[0].uuid // "") else "" end')
          fi
          [ -n "$uuid" ] || { echo "::error::utworzono zadanie, ale nie znam jego uuid — skasuj ręcznie ($TASK_NAME)"; exit 1; }
          # Do kroku sprzątającego, który MUSI wykonać się także przy anulowaniu.
          echo "TASK_UUID=$uuid" >> "$GITHUB_ENV"
          echo "zadanie $TASK_NAME utworzone (uuid=$uuid); cron zapali je w ciągu minuty"

          # ── czekanie na wynik ──────────────────────────────────────────────
          deadline=$(( $(date -u +%s) + 150 * 60 ))
          msg=""
          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            sleep 30
            execs=$(curl -sS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks/$uuid/executions" || echo '[]')
            msg=$(echo "$execs" | jq -r --arg s "$SENTINEL" \
              'if type=="array" then (map(select((.message // "") | contains($s))) | .[0].message // "") else "" end' 2>/dev/null || echo "")
            [ -n "$msg" ] && break
            # Same statusy — pola `command` NIE drukujemy nigdzie: niesie własny
            # bearer aplikacji, którego GitHub nie maskuje (nie jest sekretem repo).
            echo "$(date -u +%H:%M:%S) czekam… statusy: $(echo "$execs" | jq -r 'if type=="array" then ([.[].status] | join(",")) else "?" end' 2>/dev/null || echo '?')"
          done

          if [ -z "$msg" ]; then
            echo "::error::po 150 minutach brak wykonania z sentinelem. Krok sprzątający wypisze surowe wykonania (to jedyny moment, kiedy da się je zobaczyć) i skasuje zadanie."
            exit 1
          fi

          echo ""
          echo "$msg"
          echo ""
          echo "::notice::Zanim przeczytasz deltę: OFF musi odtworzyć baseline (P@5 0.248 / R@20n 0.199), sekcja BM25-ON musi mieć bm25=<n> z n>0, a raport 'Voyage API key configured: yes'."

      # Sprzątanie MUSI iść przy każdym wyniku poprzedniego kroku, łącznie
      # z anulowaniem workflow: zostawiony cron odpalałby się co minutę na
      # produkcji (blokada `mkdir` powstrzyma drugi eval, ale nie sam cron).
      - name: Skasuj zadanie jednorazowe
        if: ${{ always() && inputs.action == 'eval-ab' }}
        env:
          AB_OUTCOME: ${{ steps.ab.outcome }}
        run: |
          set -uo pipefail
          base="${CO_URL%/}"
          auth=(-H "Authorization: Bearer ${CO_TOKEN}" -H "Accept: application/json")
          uuid="${TASK_UUID:-}"
          if [ -z "$uuid" ]; then
            uuid=$(curl -sS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks" \
              | jq -r --arg n "$TASK_NAME" 'if type=="array" then (map(select(.name==$n)) | .[0].uuid // "") else "" end' 2>/dev/null || echo "")
          fi
          if [ -z "$uuid" ]; then
            echo "brak zadania $TASK_NAME — nie ma czego kasować"
            exit 0
          fi
          # Wykonania giną razem z zadaniem, a kasujemy je ZAWSZE (zostawiony cron
          # co minutę na produkcji jest gorszy niż utracony pomiar). Więc przy
          # nieudanym biegu to jedyny moment, w którym da się jeszcze zobaczyć, co
          # zadanie zdążyło wypisać — bez tego zostaje sam komunikat o timeoucie.
          # `command` nadal nietknięte: niesie własny bearer aplikacji.
          if [ "${AB_OUTCOME:-}" != "success" ]; then
            echo "=== surowe wykonania przed skasowaniem (bieg zakończony jako '${AB_OUTCOME:-?}') ==="
            curl -sS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks/$uuid/executions" \
              | jq -r 'if type=="array" then (.[] | "--- \(.status) \(.started_at // .created_at // "?")\n\(.message // "")") else "(brak danych)" end' 2>/dev/null \
              || echo "(nie udało się odczytać wykonań)"
            echo "=== koniec wykonań ==="
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE "${auth[@]}" \
            "$base/api/v1/applications/$APP_UUID/scheduled-tasks/$uuid" || echo 000)
          echo "delete HTTP $code (uuid=$uuid)"
          still=$(curl -sS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks" \
            | jq -r --arg n "$TASK_NAME" 'if type=="array" then (map(select(.name==$n)) | length) else 1 end' 2>/dev/null || echo 1)
          if [ "$still" != "0" ]; then
            echo "::error::zadanie $TASK_NAME NADAL istnieje — to cron co minutę na produkcji. Skasuj ręcznie w panelu Coolify albo ponów action=eval-stop."
            exit 1
          fi
          echo "zadanie skasowane"

      - name: Odczytaj wyniki bez kasowania
        if: inputs.action == 'eval-read'
        run: |
          set -euo pipefail
          base="${CO_URL%/}"
          auth=(-H "Authorization: Bearer ${CO_TOKEN}" -H "Accept: application/json")
          uuid=$(curl -fsS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks" \
            | jq -r --arg n "$TASK_NAME" 'if type=="array" then (map(select(.name==$n)) | .[0].uuid // "") else "" end')
          [ -n "$uuid" ] || { echo "::error::nie ma zadania $TASK_NAME"; exit 1; }
          # Pełne `message`, bez obcinania do 140 znaków jak w cron-list (tam
          # chodzi o przegląd, tu o wynik). `command` nadal nietknięte.
          curl -fsS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks/$uuid/executions" \
            | jq -r 'if type=="array" then (.[] | "--- \(.status) \(.started_at // .created_at // "?")\n\(.message // "")") else "(brak danych)" end'
          echo ""
          echo "::notice::Kryterium odczytu jest w komentarzu nad jobem `eval` — OFF to kontrola przyrządu, nie druga wersja."

      - name: Skasuj pozostałe zadanie evalu
        if: inputs.action == 'eval-stop'
        run: |
          set -euo pipefail
          base="${CO_URL%/}"
          auth=(-H "Authorization: Bearer ${CO_TOKEN}" -H "Accept: application/json")
          uuid=$(curl -fsS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks" \
            | jq -r --arg n "$TASK_NAME" 'if type=="array" then (map(select(.name==$n)) | .[0].uuid // "") else "" end')
          if [ -z "$uuid" ]; then
            echo "brak zadania $TASK_NAME — nic do zrobienia"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE "${auth[@]}" \
            "$base/api/v1/applications/$APP_UUID/scheduled-tasks/$uuid" || echo 000)
          echo "delete HTTP $code (uuid=$uuid)"
          still=$(curl -fsS "${auth[@]}" "$base/api/v1/applications/$APP_UUID/scheduled-tasks" \
            | jq -r --arg n "$TASK_NAME" 'if type=="array" then (map(select(.name==$n)) | length) else 1 end')
          [ "$still" = "0" ] || { echo "::error::zadanie nadal istnieje — skasuj ręcznie w panelu"; exit 1; }
          echo "zadanie skasowane"

  cv-quality:
    name: CV synthetic factual review diagnostics
    if: inputs.action == 'eval-cv-quality' || inputs.action == 'recover-cv-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: coolify-cv-quality
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Evaluate synthetic sources or recover an existing metric receipt
        env:
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          OPS_RUN_ID: ${{ github.run_id }}
          OPS_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
          OPS_ACTION: ${{ inputs.action }}
          RECOVER_RUN_ID: ${{ inputs.action == 'recover-cv-quality' && inputs.cv_eval_run_identity || '' }}
          RECOVER_SOURCE_SHA: ${{ inputs.cv_eval_source_sha }}
          EVAL_MODELS: ${{ inputs.cv_eval_models }}
          EVAL_CASES: ${{ inputs.cv_eval_cases }}
        run: |
          if [ "$OPS_ACTION" = "recover-cv-quality" ] && [ -z "$RECOVER_RUN_ID" ]; then
            echo "Missing receipt identity"
            exit 2
          fi
          python3 .github/scripts/cv-quality-ops.py
      - name: Recover cleanup after runner interruption
        if: always()
        env:
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          INSPECT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 .github/scripts/cv-quality-cleanup.py
      - name: Preserve metrics and task cleanup receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cv-quality/
          if-no-files-found: error
          retention-days: 7

  cv-quality-inspect:
    name: Inspect existing CV diagnostic (read-only)
    if: inputs.action == 'inspect-cv-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read sanitized execution metadata
        env:
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          INSPECT_RUN_ID: ${{ inputs.cv_eval_run_identity }}
        run: python3 .github/scripts/cv-quality-inspect.py

  cv-quality-cleanup:
    name: Clean up stopped CV diagnostic
    if: inputs.action == 'cleanup-cv-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove only the stopped diagnostic with the exact command
        env:
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          INSPECT_RUN_ID: ${{ inputs.cv_eval_run_identity }}
        run: python3 .github/scripts/cv-quality-cleanup.py
