name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # Replaced ``gitleaks/gitleaks-action@v2`` with a direct CLI install:
      # the action started returning failure with no retrievable logs (the
      # log blob 404s from Azure storage) so debugging was impossible.
      # Native install + ``--no-git`` scans the working tree so the result
      # is deterministic regardless of PR base/HEAD ref games.
      - name: Install gitleaks
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree
        run: |
          gitleaks detect \
            --no-git \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

  backend-lint-test:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    # Decoupled from secret-scan in PR #118 — GH Actions hosted runners
    # have been refusing to pick up the gitleaks job (runner stays
    # "waiting" for ~9s then job fails with no log). We still run the
    # secret scan, but its failure no longer blocks other CI lanes.
    # Re-couple once the upstream runner queue stabilises.
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-ci-password
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.15.22 pytest pytest-asyncio pytest-cov
      - name: Ruff lint
        run: ruff check app/
      - name: Ruff format check
        run: ruff format --check app/
      - name: Alembic legacy-row and retry probe
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
        run: |
          alembic -c alembic/alembic.ini upgrade 0195_candidate_document_kind
          python scripts/verify_b2b_signature_migration.py seed
          alembic -c alembic/alembic.ini upgrade heads
          alembic -c alembic/alembic.ini upgrade heads
          python scripts/verify_b2b_signature_migration.py verify
      - name: Import smoke check
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
        run: python -c "from app.main import app; print('app importable:', app.title)"
      - name: Pytest (unit + in-process integration)
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
          # Ensure live-server tests are skipped — our CI uses app_client fixture
          RUN_LIVE_TESTS: "0"
          # Production HAS this set, so every token path that branches on it
          # (invite links mint v2 hash-at-rest instead of a plaintext PK, M365
          # tokens encrypt) took the *other* branch in CI. Green CI then proved
          # a code path prod does not run. Value is a deliberately zero-entropy
          # dummy — a valid 32-byte urlsafe-b64 Fernet key, obviously fake, and
          # never a real secret. Same constant as scripts/schema_inventory.py.
          # tests/test_ci_token_encryption_parity.py fails if this line is
          # dropped or the value stops being a usable key.
          M365_TOKEN_ENCRYPTION_KEY: "0000000000000000000000000000000000000000000="
        run: |
          pytest tests/test_scoring_service.py tests/test_dedup_service.py \
                 tests/test_embedding_correctness.py \
                 tests/test_eval_matching.py \
