name: CI

# Ciężka warstwa weryfikacji. Szybkie bramki (gitleaks, ruff, alembic, import
# smoke) mieszkają w ci-gate.yml — to na NIE jest podpięty deploy, żeby wdrożenie
# nie czekało 22 min na pytest. Ten workflow nadal leci na każdym PR-ze i na main,
# i nadal jest wymagany przez branch protection przed merge'em.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new PR revision supersedes older test runs of that same PR. Main uses
# a unique run key so production gates never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pytest podzielony na 4 shardy = 4 OSOBNE runnery, każdy z własnym
  # postgresem i sekwencyjnym pytestem. Pomiar na 3 shardach (run 31246862557):
  # 7.7/11.9/7.1 min — round-robin nie wyrównuje czasów idealnie, stąd 4 shardy
  # na cel ~10 min ściany (pełny suite jednym procesem: ~22 min). To nie jest
  # xdist (wdrożony i wycofany — równolegli workerzy na WSPÓLNEJ bazie psuli
  # testy z globalnymi agregatami, a runner ma 4 vCPU na wszystko): semantyka
  # per shard jest identyczna z dzisiejszą, po prostu mniej plików na proces.
  # Podział robi conftest.pytest_collection_modifyitems po env
  # CI_SHARD_COUNT/CI_SHARD_INDEX — komenda pytest zostaje nietknięta, więc
  # kontrakt pokrycia (test_ci_coverage_contract) parsuje ją jak dotąd.
  # Branch protection wymaga kontekstu "Backend (pytest)" — dostarcza go job
  # zbiorczy backend-pytest-gate poniżej, NIE shardy.
  backend-lint-test:
    name: "Backend (pytest, shard ${{ matrix.shard }})"
    runs-on: ubuntu-latest
    strategy:
      # Jeden padnięty shard nie ubija pozostałych — pełny obraz w 1 przebiegu.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-ci-password
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Przypięte, bo `pytest` NIE występuje w requirements.txt — ta linia
          # jest jedynym źródłem prawdy dla runnera testów, więc przypięcie nie
          # tworzy drugiego miejsca do utrzymania. Wrażliwy jest zwłaszcza
          # `pytest-asyncio`: repo ma własny fixture `event_loop`
          # (tests/conftest.py), a to dokładnie ta semantyka, którą pakiet
          # zmieniał między wydaniami — jest już po skoku 0.x → 1.x. Bez
          # przypięcia kolejny taki skok wywróciłby CI w dniu wydania, bez
          # żadnej zmiany po naszej stronie.
          # Wersje zweryfikowane pełnym przebiegiem: 4792 passed, 0 failed.
          # `coverage` przypięte jawnie: pytest-cov ogranicza je tylko od dołu, a job
          # `backend-coverage-combine` czyta pliki danych tą samą wersją (7.15.3) —
          # nowsze wydanie w shardach mogłoby wywrócić `coverage combine`.
          pip install pytest==9.1.1 pytest-asyncio==1.4.0 pytest-cov==7.1.0 coverage==7.15.3 -r requirements-testing.txt
      # Ten job ma własny kontener postgresa, więc potrzebuje własnego schematu.
      # Pełna choreografia migracji (seed → downgrade → re-upgrade) żyje w
      # ci-gate.yml; tutaj wystarczy doprowadzić bazę do head.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
          CANDIDATE_IDENTITY_FINGERPRINT_KEY: ci-only-distinct-candidate-identity-key-at-least-48-chars
        run: alembic -c alembic/alembic.ini upgrade heads
      - name: Native CV OCR acceptance
        if: strategy.job-index == 0
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
          CANDIDATE_IDENTITY_FINGERPRINT_KEY: ci-only-distinct-candidate-identity-key-at-least-48-chars
          REQUIRE_NATIVE_CV_OCR: "1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-pol tesseract-ocr-eng poppler-utils fonts-dejavu-core
          python -m pytest tests/test_cv_ocr_native.py -q
      - name: Pytest (unit + in-process integration)
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
          CANDIDATE_IDENTITY_FINGERPRINT_KEY: ci-only-distinct-candidate-identity-key-at-least-48-chars
          # Ensure live-server tests are skipped — our CI uses app_client fixture
          RUN_LIVE_TESTS: "0"
          # Production HAS this set, so every token path that branches on it
          # (invite links mint v2 hash-at-rest instead of a plaintext PK, M365
          # tokens encrypt) took the *other* branch in CI. Green CI then proved
          # a code path prod does not run. Value is a deliberately zero-entropy
          # dummy — a valid 32-byte urlsafe-b64 Fernet key, obviously fake, and
          # never a real secret. Same constant as scripts/schema_inventory.py.
          # tests/test_ci_token_encryption_parity.py fails if this line is
          # dropped or the value stops being a usable key.
          M365_TOKEN_ENCRYPTION_KEY: "0000000000000000000000000000000000000000000="
          # Shard realizowany w conftest (filtr po CAŁYCH plikach, round-robin
          # po posortowanej liście) — patrz komentarz nad jobem.
          #
          # OBA parametry wyprowadzone z kontekstu `strategy`, żeby jedynym
          # źródłem prawdy była lista w matrixie. Osobno hardcodowany count
          # dryfowałby w jedną stronę CICHO: count=5 przy matrixie [0..3]
          # zostawia pliki `pos % 5 == 4` w ŻADNYM shardzie — zielone CI,
          # 1/5 testów nie istnieje (finding z review PR #1083). job-index
          # jest 0-based w kolejności ekspansji matrixa; wartości `shard`
          # w matrixie służą tylko do nazwy joba i liczności listy.
          # Wykrywacz wywołań LLM poza bramką kwot. Od 0270 oba baseline'y
          # strażnika są puste (albo świadomie uzasadnione), więc CI może
          # egzekwować regułę zamiast tylko ją logować.
          #
          # TYLKO CI. Na produkcji ta flaga wchodzi osobno, po cyklu obserwacji
          # z pustym „UNGATED" w logach — detektor istnieje właśnie po to, żeby
          # znaleźć miejsca, o których nikt nie pomyślał, a wywalenie ich
          # od razu na prodzie zamieniłoby diagnozę w awarię.
          AI_QUOTA_STRICT: "true"
          CI_SHARD_COUNT: ${{ strategy.job-total }}
          CI_SHARD_INDEX: ${{ strategy.job-index }}
          # QA-01 (audyt Codexa, 14.09.2026): każdy shard zapisuje SUROWE dane
          # pokrycia pod własną nazwą, a job `backend-coverage-combine` niżej
          # scala je w jeden raport. Do 09.2026 każdy shard wysyłał do Codecov
          # własny `coverage.xml` z ~1/4 testów, a bez `CODECOV_TOKEN` upload
          # i tak padał — pokrycie backendu NIE istniało nigdzie w całości.
          # coverage.py czyta tę zmienną sam; pytest-cov nie nadpisuje ścieżki
          # pliku danych (zweryfikowane na pytest-cov 7.1.0 / coverage 7.15.3).
          COVERAGE_FILE: .coverage.shard-${{ strategy.job-index }}
        run: |
          # Auto-discovery: pytest collects EVERY module under tests/, minus the
          # explicit exceptions below. This replaced a hand-enumerated list of ~285
          # filenames, which made coverage opt-in — a new test file only ran if
          # whoever added it also remembered to append it here, and a test that does
          # not run protects nothing. Auto-discovery removes that whole class of gap:
          # forgetting is no longer possible, only deliberate exclusion is.
          #
          # The --ignore list below IS the baseline. The coverage contract in
          # backend/tests asserts it matches the categorised exceptions declared
          # there, so an entry cannot appear without a written reason, nor linger
          # once the debt is paid.
          #
          # BEZ pytest-xdist — świadomie, po pomiarze. Zrównoleglenie zostało
          # wdrożone i wycofane: 25 plików testowych porównuje globalne agregaty
          # (`COUNT(*)`, `total` z listy), więc przy wspólnej bazie workery
          # oskarżają się nawzajem o mutacje — w CI wywróciły się przez to
          # `test_engagement_inventory` i `test_contracts_search`, a łatanie ich
          # osłabia asercje. Izolacja bazy per worker (`CREATE DATABASE …
          # TEMPLATE` w conftest) rozwiązuje poprawność, ale lokalnie wydłużyła
          # pełny suite z 5 min 35 s do 39 min 46 s — cztery bazy przekraczają
          # domyślne `shared_buffers` postgresa. Praca zachowana na gałęzi
          # `xdist-per-worker-db-wip`; szczegóły i liczby w
          # docs/ci-deploy-latency-completion-report.md.
          #
          # Czas tego joba NIE bramkuje już wdrożenia — deploy wisi na
          # „CI Gate" (~1,5 min), więc pytest wpływa wyłącznie na czas
          # oczekiwania na PR-ze.
          pytest tests/ \
                 -v --tb=short \
                 --cov=app --cov-branch --cov-report=term-missing
      # Surowy plik danych (nie XML): tylko z niego `coverage combine` potrafi
      # zsumować 4 shardy w jeden raport. `include-hidden-files` jest
      # load-bearing — od upload-artifact v4.4 pliki z kropką są domyślnie
      # POMIJANE, a `.coverage.shard-N` zaczyna się od kropki: bez tej flagi
      # artefakt jest pusty, a job scalający nie ma czego scalić.
      - name: Upload coverage data (shard artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-shard-${{ matrix.shard }}
          path: backend/.coverage.shard-${{ strategy.job-index }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  backend-coverage-combine:
    # QA-01: jeden raport pokrycia (linie + gałęzie) z 4 shardów i bramka
    # „bez spadku": wynik poniżej `.github/coverage-baseline.json` minus
    # tolerancja kończy job czerwienią, a job zbiorczy „Backend (pytest)"
    # (wymagany kontekst) czyta jego wynik. Próg 80% zostaje RAPORTOWY.
    # `!cancelled()` zamiast `always()`: scalamy także po czerwonym shardzie
    # (częściowe pokrycie jest lepsze niż żadne), ale nie po anulowaniu biegu.
    name: Backend (coverage combine)
    runs-on: ubuntu-latest
    needs: backend-lint-test
    if: ${{ !cancelled() }}
    defaults:
      run:
        working-directory: backend
    env:
      # Sekret przez `env:` joba, żeby krok Codecov dało się WARUNKOWAĆ na jego
      # obecność (`if: env.CODECOV_TOKEN != ''`) — `secrets.*` nie jest
      # dostępne w `if:` kroku. Bez tokena upload jest pomijany jawnie,
      # zamiast padać po cichu pod `fail_ci_if_error: false`.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # Próg RAPORTOWY (nie blokujący). Zmiana progu = zmiana tej jednej linii.
      COVERAGE_REPORT_THRESHOLD: "80"
      # Liczba shardów w matrixie `backend-lint-test` — kontrakt w
      # tests/test_ci_deploy_workflows_contract.py pilnuje zgodności.
      EXPECTED_SHARDS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install coverage
        # Ta sama wersja, którą pytest-cov 7.1.0 ciągnie w shardach — format
        # pliku danych musi się zgadzać po obu stronach `combine`.
        run: pip install coverage==7.15.3
      - name: Download shard coverage data
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: backend-coverage-shard-*
          path: backend
          merge-multiple: true
      - name: Combine shards + report
        run: |
          set -eu
          shopt -s nullglob
          files=(.coverage.shard-*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::Brak plików .coverage.shard-* — żaden shard nie zostawił danych pokrycia (pytest nie doszedł do końca?)."
            echo "### Pokrycie backendu" >> "$GITHUB_STEP_SUMMARY"
            echo "Brak danych z shardów — raport nie powstał." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Komplet wejść: scalenie 3 z 4 shardów daje zaniżony wynik, który
          # bramka „bez spadku" wzięłaby za regresję — albo, gorzej, wynik
          # z niepełnego mianownika uznany za prawdziwy.
          if [ "${#files[@]}" -ne "$EXPECTED_SHARDS" ]; then
            echo "::error::Scalono ${#files[@]} z $EXPECTED_SHARDS shardów — raport pokrycia byłby niekompletny."
            exit 1
          fi
          echo "Scalam ${#files[@]} plik(ów): ${files[*]}"
          coverage combine "${files[@]}"
          coverage xml -o coverage.xml
          # `--format=total` daje samą liczbę (coverage ≥ 7.0); bez `|| true`
          # brak wsparcia formatu w przyszłej wersji wywaliłby krok raportujący.
          total=$(coverage report --format=total --precision=2 2>/dev/null || echo "")
          {
            echo "### Pokrycie backendu (4 shardy scalone: ${#files[@]} plik/ów)"
            echo
            echo "**Łącznie: ${total:-?}%** (próg raportowy: ${COVERAGE_REPORT_THRESHOLD}%, nie blokuje)"
            echo
            echo '```'
            coverage report --skip-covered --sort=cover | head -c 60000
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$total" ]; then
            echo "::error::Nie udało się odczytać łącznego pokrycia (coverage report --format=total)."
            exit 1
          fi
          if python3 -c "import sys; sys.exit(0 if float('$total') < float('$COVERAGE_REPORT_THRESHOLD') else 1)"; then
            echo "::warning::Pokrycie backendu ${total}% jest poniżej progu raportowego ${COVERAGE_REPORT_THRESHOLD}% (raport, nie blokuje)."
          fi
          # Bramka „bez spadku" (QA-01): baseline i tolerancja w jednym pliku
          # w repo, żeby podbicie progu było zwykłą, przeglądaną zmianą w PR.
          python3 ../.github/scripts/coverage_gate.py \
            --baseline ../.github/coverage-baseline.json \
            --key backend_line_branch_percent \
            --actual "$total" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload combined coverage.xml
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-combined
          path: backend/coverage.xml
          if-no-files-found: warn
          retention-days: 30
      - name: Upload backend coverage to Codecov
        # Jeden upload PO scaleniu zamiast czterech ćwiartek per shard —
        # Codecov i tak scalał po fladze, ale bez tokena nie przyjmował nic.
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage-combined
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Codecov skipped (no token)
        if: ${{ !cancelled() && env.CODECOV_TOKEN == '' }}
        run: echo "::notice::CODECOV_TOKEN nie jest ustawiony — upload do Codecov pominięty; scalony raport jest w artefakcie backend-coverage-combined i w podsumowaniu biegu."

  backend-pytest-gate:
    # Branch protection wymaga kontekstu o nazwie DOKŁADNIE "Backend (pytest)".
    # Shardy raportują się jako "Backend (pytest, shard N)", więc wymagany
    # status dostarcza ten job zbiorczy: zielony wyłącznie gdy KAŻDY shard
    # przeszedł. `if: always()` jest load-bearing — bez niego anulowane/
    # pominięte shardy zostawiłyby kontekst wiecznie „oczekujący" zamiast
    # jawnej czerwieni.
    name: Backend (pytest)
    runs-on: ubuntu-latest
    needs: [backend-lint-test, backend-coverage-combine]
    if: ${{ always() }}
    steps:
      - name: Zbierz wyniki shardów i bramki pokrycia
        run: |
          result="${{ needs.backend-lint-test.result }}"
          coverage="${{ needs.backend-coverage-combine.result }}"
          echo "Łączny wynik shardów: $result; bramka pokrycia: $coverage"
          if [ "$result" != "success" ]; then
            echo "::error::Co najmniej jeden shard pytest nie przeszedł (result=$result)"
            exit 1
          fi
          if [ "$coverage" != "success" ]; then
            echo "::error::Bramka pokrycia backendu nie przeszła (result=$coverage) — szczegóły w jobie „Backend (coverage combine)”."
            exit 1
          fi

  frontend-lint-build:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    # Same decoupling rationale as backend-lint-test above (PR #118).
    defaults:
      run:
        working-directory: frontend
    env:
      # Jak w `backend-coverage-combine`: token przez env joba, żeby upload
      # do Codecov dało się pominąć JAWNIE, gdy sekretu nie ma (QA-01).
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-
      - run: npm ci --legacy-peer-deps
      # Bramka sierot: usunięcie ostatniego miejsca montowania komponentu NIE
      # psuje builda ani testów (własny test komponentu trzyma go przy życiu),
      # więc funkcja potrafi zniknąć z produktu przy zielonym CI — tak zginął
      # nadzór nad kolejką kontaktu w #1031 i nikt nie zauważył przez 16 dni.
      # Zero zależności, więc może stać przed resztą kroków.
      - name: Nieosiągalne moduły (dead-code gate)
        run: node scripts/check-unreachable-modules.mjs
      - name: ESLint
        run: npm run lint
      - run: npm run type-check
      - name: Vitest with coverage
        # Progi w vitest.config.ts (`coverage.thresholds`) = bramka „bez spadku"
        # frontendu (QA-01); Vitest kończy się błędem poniżej nich.
        run: npm run test:coverage
      - name: Upload frontend coverage (artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30
      - name: Upload frontend coverage to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  security-scan:
    name: Trivy + hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hadolint zostaje advisory. Trivy od QA-05 (plan poprawy po audycie
      # 14.09.2026) BLOKUJE: każde znalezisko HIGH/CRITICAL z dostępną poprawką
      # kończy job czerwienią; świadome wyjątki tylko w `.trivyignore` z terminem
      # (`exp:`). Każdy skaner tutaj MUSI zostawić ślad, który da się przeczytać. Hadolint wystawia adnotacje `##[error]`
      # w UI i to jest wzorzec; Trivy do 2026-08 nie zostawiał nic (patrz niżej).
      - name: Hadolint (backend)
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning
        continue-on-error: true
      - name: Hadolint (frontend)
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning
        continue-on-error: true
      # „Report-only" znaczyło do 2026-08 „report-donikąd": `format: table` bez
      # `output:`, bez artefaktu i bez adnotacji, więc znaleziska istniały
      # wyłącznie jako zwykły tekst w okolicach 500. linii loga joba. Przez trzy
      # miesiące odraczany „triage" nie miał na czym pracować, a milczenie kroku
      # ukrywało dwa HIGH z opublikowaną poprawką w produkcyjnych wpisach
      # lockfile'a (postcss, sharp — ten drugi jest w runtime obrazu frontendu).
      # Teraz: tabela w podsumowaniu biegu (widoczna wprost na stronie PR-a),
      # adnotacja `::warning::` z liczbą znalezisk i artefakt do pobrania.
      # Dopiero mając czytelny raport można świadomie zdecydować o `exit-code: 1`.
      #
      # SARIF + zakładka Security świadomie NIE: `upload-sarif` wymaga Advanced
      # Security, którego prywatne repo na koncie osobistym nie ma — krok padłby
      # na 403 i zamienił advisory w czerwień, czyli powtórzył ten sam błąd
      # z drugiej strony.
      - name: Trivy filesystem scan (deps + Dockerfile misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: .claude,node_modules
          trivyignores: .trivyignore
          # Skan zawsze kończy się 0, żeby raport powstał w całości; o wyniku
          # joba decyduje krok niżej, który liczy znaleziska i wyjątki.
          exit-code: '0'
          format: table
          output: trivy-report.txt
      - name: Publish Trivy findings
        if: ${{ !cancelled() }}
        run: |
          set -eu
          report=trivy-report.txt
          if [ ! -s "$report" ]; then
            echo "Trivy: brak znalezisk HIGH/CRITICAL z dostępną poprawką." > "$report"
          fi
          # `Total: N` (podatności zależności) i `Failures: N` (błędna
          # konfiguracja, np. Dockerfile) występują raz na przeskanowany cel.
          # Do 09.2026 liczono tylko `Total:`, więc HIGH w Dockerfile nie
          # trafiał do licznika ostrzeżenia. `|| true` jest konieczne: grep bez
          # trafienia kończy się kodem 1, a `set -e` ubiłby krok przy ZERZE.
          count=$(grep -oE '(Total|Failures): [0-9]+' "$report" | awk '{s+=$2} END {print s+0}' || true)
          [ -n "$count" ] || count=0
          {
            echo "### Trivy — HIGH/CRITICAL z dostępną poprawką"
            echo
            echo '```'
            # Sufit podsumowania biegu to 1 MB; obcinamy, żeby duży raport nie
            # wywalił całego kroku i nie zabrał ze sobą także tej części, która
            # by się zmieściła.
            head -c 100000 "$report"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::error::Trivy: $count znalezisk HIGH/CRITICAL z dostępną poprawką — tabela w podsumowaniu biegu, pełny raport w artefakcie trivy-report. Napraw zależność albo dodaj uzasadniony wyjątek z terminem do .trivyignore."
            exit 1
          else
            echo "Trivy: brak znalezisk HIGH/CRITICAL z dostępną poprawką."
          fi
      - name: Upload Trivy report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30
