name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_LINUX_X64_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --show-error --silent --location --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree
        run: |
          gitleaks detect \
            --no-git \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1
      - name: Scan changed Git history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot resolve an immutable base SHA for the changed-history scan"
            exit 1
          fi
          gitleaks detect \
            --source . \
            --log-opts "$BASE_SHA..HEAD" \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

  standards-drift:
    name: Standards policy and drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout NEXUS
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Validate locked engineering standard
        uses: artur-t-96/engineering-standards/.github/actions/validate-consumer@fa4bb1123a3ea1b444e8bd4d36fb180567960a13
        with:
          expected-ref: fa4bb1123a3ea1b444e8bd4d36fb180567960a13
          consumer-root: .

  backend-lint-test:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Decoupled from secret-scan in PR #118 — GH Actions hosted runners
    # have been refusing to pick up the gitleaks job (runner stays
    # "waiting" for ~9s then job fails with no log). We still run the
    # secret scan, but its failure no longer blocks other CI lanes.
    # Re-couple once the upstream runner queue stabilises.
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-ci-password
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'ruff==0.15.18' pytest pytest-asyncio pytest-cov
      - name: Ruff lint
        run: ruff check app/
      - name: Ruff format check
        run: ruff format --check app/
      - name: Require exactly one Alembic head
        run: |
          set -euo pipefail
          heads="$(alembic -c alembic/alembic.ini heads | awk '{print $1}')"
          count="$(printf '%s\n' "$heads" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $count"
            exit 1
          fi
      - name: Alembic migration dry-run
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
        run: alembic -c alembic/alembic.ini upgrade head
      - name: Alembic applied-head and ORM schema contract
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
        run: |
          python -m scripts.assert_migration_head
          alembic -c alembic/alembic.ini check
      - name: Import smoke check
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
        run: python -c "from app.main import app; print('app importable:', app.title)"
      - name: Start process-only liveness probe
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 18000 \
            --lifespan off \
            >/tmp/nexus-ci-livez.log 2>&1 &
          echo "$!" >/tmp/nexus-ci-livez.pid
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:18000/api/livez >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          sed -n '1,120p' /tmp/nexus-ci-livez.log
          exit 1
      - name: Validate livez against the locked shared contract
        uses: artur-t-96/engineering-standards/.github/actions/validate-health@fa4bb1123a3ea1b444e8bd4d36fb180567960a13
        with:
          url: http://127.0.0.1:18000/api/livez
          kind: livez
          expected-sha: ${{ github.sha }}
      - name: Stop process-only liveness probe
        if: always()
        run: |
          if [ -f /tmp/nexus-ci-livez.pid ]; then
            kill "$(cat /tmp/nexus-ci-livez.pid)" 2>/dev/null || true
          fi
      - name: Pytest (unit + in-process integration)
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
          # Ensure live-server tests are skipped — our CI uses app_client fixture
          RUN_LIVE_TESTS: "0"
        run: >-
          pytest tests
          -v --tb=short
          --cov=app
          --cov-report=xml:coverage.xml
          --cov-report=term-missing
      - name: Upload backend coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend-lint-build:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same decoupling rationale as backend-lint-test above (PR #118).
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-
      - run: npm ci --legacy-peer-deps
      - name: ESLint
        run: npm run lint
      - run: npm run type-check
      - name: Vitest with coverage
        run: npm run test:coverage
      - name: Upload frontend coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'
          python -m pip_audit --requirement backend/requirements.txt --strict --progress-spinner off
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Audit production JavaScript dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  security-scan:
    name: Docker smoke + Trivy + hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Hadolint (backend)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error
      - name: Hadolint (frontend)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: error
      - name: Build backend production image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "nexus-backend-ci:${GITHUB_SHA}" \
            backend
      - name: Build frontend production image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="http://localhost:8000" \
            --build-arg NEXT_PUBLIC_GIT_SHA="${GITHUB_SHA}" \
            --tag "nexus-frontend-ci:${GITHUB_SHA}" \
            frontend
      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexus-backend-ci:${{ github.sha }}
          version: v0.70.0
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore
          exit-code: '1'
      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexus-frontend-ci:${{ github.sha }}
          version: v0.70.0
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore
          exit-code: '1'

  quality-gate:
    name: quality-gate
    if: always()
    needs:
      - secret-scan
      - standards-drift
      - backend-lint-test
      - frontend-lint-build
      - dependency-audit
      - security-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI gate
        env:
          SECRETS: ${{ needs.secret-scan.result }}
          STANDARDS: ${{ needs.standards-drift.result }}
          BACKEND: ${{ needs.backend-lint-test.result }}
          FRONTEND: ${{ needs.frontend-lint-build.result }}
          DEPENDENCIES: ${{ needs.dependency-audit.result }}
          SECURITY: ${{ needs.security-scan.result }}
        run: |
          set -euo pipefail
          for result in "$SECRETS" "$STANDARDS" "$BACKEND" "$FRONTEND" "$DEPENDENCIES" "$SECURITY"; do
            test "$result" = "success"
          done
