name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Replaced ``gitleaks/gitleaks-action@v2`` with a direct CLI install:
      # the action started returning failure with no retrievable logs (the
      # log blob 404s from Azure storage) so debugging was impossible.
      # Native install + ``--no-git`` scans the working tree so the result
      # is deterministic regardless of PR base/HEAD ref games.
      - name: Install gitleaks
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree
        run: |
          gitleaks detect \
            --no-git \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

  backend-lint-test:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    # Decoupled from secret-scan in PR #118 — GH Actions hosted runners
    # have been refusing to pick up the gitleaks job (runner stays
    # "waiting" for ~9s then job fails with no log). We still run the
    # secret scan, but its failure no longer blocks other CI lanes.
    # Re-couple once the upstream runner queue stabilises.
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-ci-password
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov
      - name: Ruff lint
        run: ruff check app/
      - name: Ruff format check
        run: ruff format --check app/
      - name: Alembic migration dry-run
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
        run: alembic -c alembic/alembic.ini upgrade heads
      - name: Import smoke check
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
        run: python -c "from app.main import app; print('app importable:', app.title)"
      - name: Pytest (unit + in-process integration)
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
          # Ensure live-server tests are skipped — our CI uses app_client fixture
          RUN_LIVE_TESTS: "0"
        run: |
          pytest tests/test_scoring_service.py tests/test_dedup_service.py \
                 tests/test_talent_radar_importer.py \
                 tests/test_ical_import.py \
                 tests/test_api_integration.py \
                 tests/test_health_v2.py \
                 tests/test_password_reset.py \
                 tests/test_autenti_client.py \
                 tests/test_autenti_pdf_renderer.py \
                 tests/test_autenti_send.py \
                 tests/test_autenti_webhook_verify.py \
                 tests/test_autenti_webhook_handler.py \
                 tests/test_autenti_webhook.py \
                 tests/test_m365_encryption.py \
                 tests/test_m365_oauth_state.py \
                 tests/test_m365_attachment_handler.py \
                 tests/test_m365_sync_helpers.py \
                 tests/test_m365_sender_idempotency.py \
                 tests/test_m365_rematch.py \
                 tests/test_m365_free_busy.py \
                 tests/test_m365_email_search.py \
                 tests/test_email_bulk_actions.py \
                 tests/test_auth_microsoft.py \
                 tests/test_calendar_conflicts.py \
                 tests/test_user_email_templates.py \
                 tests/test_aad_groups.py \
                 -v --tb=short \
                 --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Upload backend coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend-lint-build:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    # Same decoupling rationale as backend-lint-test above (PR #118).
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-
      - run: npm ci --legacy-peer-deps
      - name: ESLint
        run: npm run lint
      - run: npm run type-check
      - name: Vitest with coverage
        run: npm run test:coverage
      - name: Upload frontend coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
