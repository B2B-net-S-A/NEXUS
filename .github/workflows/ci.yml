name: CI

# Ciężka warstwa weryfikacji. Szybkie bramki (gitleaks, ruff, alembic, import
# smoke) mieszkają w ci-gate.yml — to na NIE jest podpięty deploy, żeby wdrożenie
# nie czekało 22 min na pytest. Ten workflow nadal leci na każdym PR-ze i na main,
# i nadal jest wymagany przez branch protection przed merge'em.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-ci-password
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-xdist
      # Ten job ma własny kontener postgresa, więc potrzebuje własnego schematu.
      # Pełna choreografia migracji (seed → downgrade → re-upgrade) żyje w
      # ci-gate.yml; tutaj wystarczy doprowadzić bazę do head.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
          CANDIDATE_IDENTITY_FINGERPRINT_KEY: ci-only-distinct-candidate-identity-key-at-least-48-chars
        run: alembic -c alembic/alembic.ini upgrade heads
      - name: Pytest (unit + in-process integration)
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
          CANDIDATE_IDENTITY_FINGERPRINT_KEY: ci-only-distinct-candidate-identity-key-at-least-48-chars
          # Ensure live-server tests are skipped — our CI uses app_client fixture
          RUN_LIVE_TESTS: "0"
          # Production HAS this set, so every token path that branches on it
          # (invite links mint v2 hash-at-rest instead of a plaintext PK, M365
          # tokens encrypt) took the *other* branch in CI. Green CI then proved
          # a code path prod does not run. Value is a deliberately zero-entropy
          # dummy — a valid 32-byte urlsafe-b64 Fernet key, obviously fake, and
          # never a real secret. Same constant as scripts/schema_inventory.py.
          # tests/test_ci_token_encryption_parity.py fails if this line is
          # dropped or the value stops being a usable key.
          M365_TOKEN_ENCRYPTION_KEY: "0000000000000000000000000000000000000000000="
        run: |
          # Auto-discovery: pytest collects EVERY module under tests/, minus the
          # explicit exceptions below. This replaced a hand-enumerated list of ~285
          # filenames, which made coverage opt-in — a new test file only ran if
          # whoever added it also remembered to append it here, and a test that does
          # not run protects nothing. Auto-discovery removes that whole class of gap:
          # forgetting is no longer possible, only deliberate exclusion is.
          #
          # The --ignore list below IS the baseline. The coverage contract in
          # backend/tests asserts it matches the categorised exceptions declared
          # there, so an entry cannot appear without a written reason, nor linger
          # once the debt is paid.
          #
          # `-n 4 --dist loadfile` — 4792 testy w jednym procesie zajmowały
          # 22 min 20 s i samodzielnie wyznaczały długość całego CI (reszta
          # jobów kończyła się w 5 min i czekała). `loadfile`, a nie `load`:
          # cały plik trafia do jednego workera, więc kolejność WEWNĄTRZ pliku
          # jest zachowana i zrównoleglenie może zepsuć tylko zależności MIĘDZY
          # plikami — a tych i tak nie powinno być.
          #
          # Suite jest na to gotowy z trzech powodów, sprawdzonych przed zmianą:
          # `app_client` seeduje unikatowego admina per test (uuid w mailu),
          # w całym tests/ nie ma ani jednego TRUNCATE/drop_all, a globalny stan
          # (taksonomia skilli w scoring_service/skill_normalize) jest
          # per-proces, więc każdy worker dostaje własny — pod xdist jest to
          # bezpieczniejsze niż przy jednym współdzielonym procesie.
          #
          # `-n 4` jawnie, nie `auto`: ubuntu-latest ma dziś 4 vCPU, więc to ta
          # sama liczba, ale jawna wartość nie zmieni cicho poziomu współbieżności
          # (i obciążenia współdzielonego postgresa) gdyby GitHub zmienił rozmiar
          # runnera na większy.
          pytest tests/ \
                 --ignore=tests/test_auth.py \
                 --ignore=tests/test_backfill_candidate_experience.py \
                 --ignore=tests/test_backfill_talent_pools.py \
                 --ignore=tests/test_bulk_cv_download.py \
                 --ignore=tests/test_candidates.py \
                 --ignore=tests/test_candidates_from_cv.py \
                 --ignore=tests/test_champion_ai_intake.py \
                 --ignore=tests/test_cv_enrichment.py \
                 --ignore=tests/test_cv_parser.py \
                 --ignore=tests/test_dl_portal_scheduler.py \
                 --ignore=tests/test_jobs.py \
                 --ignore=tests/test_jobs_auto_assign.py \
                 --ignore=tests/test_m365_matcher.py \
                 --ignore=tests/test_marketplace_flow.py \
                 --ignore=tests/test_marketplace_service.py \
                 --ignore=tests/test_new_endpoints.py \
                 --ignore=tests/test_notification_triggers.py \
                 --ignore=tests/test_pending_verification.py \
                 --ignore=tests/test_pipeline.py \
                 --ignore=tests/test_presence_manager.py \
                 --ignore=tests/test_procedures.py \
                 --ignore=tests/test_proposals.py \
                 --ignore=tests/test_recommendation_filters.py \
                 --ignore=tests/test_shortlist_and_proposal.py \
                 --ignore=tests/test_team_structure_dl_clients_dedup.py \
                 -n 4 --dist loadfile \
                 -v --tb=short \
                 --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Upload backend coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend-lint-build:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    # Same decoupling rationale as backend-lint-test above (PR #118).
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Next.js build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-
      - run: npm ci --legacy-peer-deps
      - name: ESLint
        run: npm run lint
      - run: npm run type-check
      - name: Vitest with coverage
        run: npm run test:coverage
      - name: Upload frontend coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  security-scan:
    name: Trivy + hadolint (report-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Report-only first pass — flip continue-on-error:false / exit-code:'1' after triaging findings.
      - name: Hadolint (backend)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning
        continue-on-error: true
      - name: Hadolint (frontend)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning
        continue-on-error: true
      - name: Trivy filesystem scan (deps + Dockerfile misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: .claude,node_modules
          exit-code: '0'
