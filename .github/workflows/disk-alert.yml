name: Disk alert

# Early-warning for host disk pressure — the root cause of the 2026-07-17 outage
# (Coolify build churn filled / to 98.8% → Postgres/Coolify crash-loop). Reads the
# `diskPercent` field exposed by /api/health and alerts at 75%, days before it
# becomes an outage. Informational only: the backend never 503s on disk, so this
# is the dedicated channel that turns "silent fill" into an actionable ping.

on:
  schedule:
    - cron: "37 * * * *" # hourly, offset from uptime-probe
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  disk:
    name: NEXUS host disk usage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 3
    steps:
      - name: Read diskPercent from /api/health
        id: disk
        run: |
          set -euo pipefail
          body=$(curl -sS --max-time 20 https://api.nexus.dynaminds.pl/api/health)
          pct=$(echo "$body" | jq -r '.diskPercent // empty')
          echo "diskPercent=$pct"
          if [ -z "$pct" ] || [ "$pct" = "null" ]; then
            echo "::warning::/api/health has no diskPercent yet (backend not on the version that exposes it) — skipping."
            echo "high=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          THRESHOLD=75
          if [ "$pct" -ge "$THRESHOLD" ]; then
            echo "::error::NEXUS host disk at ${pct}% (threshold ${THRESHOLD}%)."
            echo "high=1" >> "$GITHUB_OUTPUT"
          else
            echo "Disk OK: ${pct}% (threshold ${THRESHOLD}%)."
            echo "high=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh alert issue
        if: steps.disk.outputs.high == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PCT: ${{ steps.disk.outputs.pct }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker="NEXUS host disk high"
          existing=$(gh issue list --repo "$REPO" --state open \
            --search "$marker in:title" --json number --jq '.[0].number // empty' || echo "")
          read -r -d '' body <<EOF || true
          Host disk on **nexus-prod** is at **${PCT}%** (alert threshold 75%).

          This is the early-warning for the 2026-07-17 outage pattern: disk fills from
          Coolify build churn, then Postgres/Coolify crash-loop and the whole app goes down.

          **How to free space (safe):** on the server run
          \`docker image prune -af && docker builder prune -af\`.
          ⚠️ Do **NOT** run \`docker container prune\` — last time it deleted the Postgres
          and coolify-db containers. Named volumes (data) are never touched by image/builder prune.

          _Auto-generated by \`.github/workflows/disk-alert.yml\`._
          EOF
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "⚠️ ${marker}" --body "$body"
          fi

      - name: Fail run so GitHub emails the owner
        if: steps.disk.outputs.high == '1'
        run: exit 1
      - name: Checkout (tylko .github/scripts) do zamknięcia alarmu
        if: ${{ steps.disk.outputs.high == '0' && steps.disk.outputs.pct != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      # OPS-N08 (audyt 22.09.2026): zielony bieg zamyka alarm, który otworzył
      # czerwony — marker DOKŁADNIE ten sam co w kroku otwierającym.
      - name: Zamknij alarm po zielonym biegu
        if: ${{ steps.disk.outputs.high == '0' && steps.disk.outputs.pct != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/alert_issue.sh resolve "NEXUS host disk high" "Dysk hosta wrócił poniżej progu 75%."
