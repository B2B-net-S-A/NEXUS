name: Deploy

# Unified deployment workflow per ~/.claude/rules/deployment.md.
# Identyczny pattern dla wszystkich 3 apek (Compass, NEXUS, LeadGen).
#
# Push do main → "CI Gate" (gitleaks + ruff + alembic + import smoke, ~2 min)
# → on its success this workflow fires (via workflow_run, see the `on:` block)
# → trigger Coolify deploy via API → poll deployment status by UUID → smoke
# test /api/health. Coolify samo buduje + restart kontenerów.
#
# BRAMKĄ JEST "CI Gate", NIE pełne "CI" (przeniesione 2026-08-07 — uzasadnienie
# i świadomy kompromis w komentarzu przy `workflow_run` niżej). Dwie
# konsekwencje, obie łatwe do przeoczenia:
#   - czerwona BRAMKA → deploy pominięty (P1-CI-01);
#   - czerwone pełne "CI" na main deployu NIE zatrzymuje. Leci RÓWNOLEGLE
#     i jest sygnałem do ROLLBACKU, nie blokadą przed wdrożeniem.
# Stąd też czas od merge'u do produkcji liczy się w minutach bramki (~2), a nie
# całego "CI" (~24) — ten nagłówek do 09.2026 mówił "CI" i mylił o rząd
# wielkości w obie strony.
#
# 2026-07-16 (analytics plan PR 0): the old flow fired the webhook and then
# blind-slept 180s before polling /api/health. Two real failure modes slipped
# through or wedged it:
#   1. Coolify HTTP 429 "Deployment queue is full" — 3 fast retries (5/15/45s)
#      could never outlast a queue backed up by a slow ARM build, so every
#      main push after the first went red (2026-07-16 morning).
#   2. A deployment that FAILED server-side was invisible: the webhook said
#      "queued", the smoke test then burned 6 minutes polling a stale version
#      and reported a generic timeout with zero diagnostics (2026-07-15 evening).
# Now we save the deployment UUID, poll its status, fail fast on
# failed/cancelled with the server-side log tail, and only then health-check.
#
# 2026-08-07 (concurrent deployments): przy serii merge'y każdy push na main
# odpalał osobny pełny rebuild Coolify (429 "queue is full" 2026-07-15/16,
# disk-fill 2026-05-22). Stąd koalescencja burstów: deploy pomija rebuild,
# gdy produkcja serwuje już to, co ma wdrożyć.
#
# 2026-09-15 (DEP-01, audyt 14.09): Coolify buduje HEAD maina z chwili budowy
# (4.1.2 ignoruje nawet przypięty `git_commit_sha` — poprawione w 4.2.0), a smoke
# przyjmował każdego POTOMKA TARGET_SHA. Commit z czerwoną albo trwającą bramką
# "CI Gate" wjeżdżał więc na produkcję w deployu zielonego commitu obok. Teraz
# `select_release_sha.py` pilnuje obu końców budowy:
#   1. job `select`: deploy rusza TYLKO, gdy HEAD maina ma zieloną bramkę
#      (RELEASE_SHA = HEAD). HEAD z bramką w toku → odroczenie (wdroży go jego
#      własny przebieg); z czerwoną → wstrzymanie z ostrzeżeniem;
#   2. smoke: produkcja musi serwować RELEASE_SHA albo potomka z ZIELONĄ
#      bramką (merge w trakcie budowy; na bramkę w toku czekamy do 10 min).
#      Potomek z czerwoną bramką = czerwony deploy z instrukcją wycofania.
# Po aktualizacji Coolify do ≥ 4.2.0 można przypinać `git_commit_sha` i
# wymagać samej równości.
#
# Required GH secrets:
#   COOLIFY_URL       e.g. https://coolify-compass.dynaminds.pl
#   COOLIFY_TOKEN     Bearer token (Sanctum personal_access_tokens)
#   COOLIFY_APP_UUID  Application UUID (from Coolify panel resource URL)
#
# Required GH variables:
#   APP_URL           Production URL for smoke test (e.g. https://compass.dynaminds.pl)

on:
  # P1-CI-01: bramkuj deploy na przejściu weryfikacji dla TEGO SAMEGO SHA.
  #
  # Pierwotnie ten workflow odpalał się wprost na `push: branches: [main]`,
  # NIEZALEŻNIE od ci.yml. Nic ich nie łączyło, więc czerwone post-merge CI
  # (branch protection bramkuje PR, nie push na main) NIE zatrzymywało deployu —
  # zepsuty main mógł pojechać na prod. Dlatego deploy został wtedy podpięty
  # przez `workflow_run` pod workflow "CI".
  #
  # 2026-08-07: bramka przeniesiona z "CI" na "CI Gate". Powód — `workflow_run`
  # czeka na CAŁY workflow, a nie na konkretny job, więc deploy wisiał na
  # najwolniejszym jobie w ci.yml. Zmierzone na b4af6c58 (zmiana jednej stałej):
  # CI na main 24 min 24 s, z czego 22 min 20 s to sam pytest; z deployem
  # ~28 min od merge'u do produkcji. Te 22 min to POWTÓRKA — `strict: true`
  # gwarantuje, że gałąź była aktualna z main, więc pytest przeszedł już na PR
  # na tym samym kodzie.
  #
  # Teraz łańcuch to: push na main → "CI Gate" (gitleaks + ruff + alembic +
  # import smoke, ~2 min) → ten workflow → deploy. Pełne "CI" (pytest, frontend,
  # Trivy) leci na main RÓWNOLEGLE i nadal jest wymagane na PR przed merge'em.
  #
  # Świadomy kompromis: produkcja może żyć ~6 min zanim pytest na main się
  # skończy. To okno kryje przypadek dwóch PR-ów zmergowanych blisko siebie,
  # które osobno są zielone, a razem nie. Sygnałem jest wtedy czerwone "CI" na
  # main → rollback (deployment-runbook §2). Deep healthcheck poniżej łapie
  # osobną, częstszą klasę: migrację, która nie weszła.
  #
  # `workflow_run` zawsze bierze plik workflow z gałęzi domyślnej (main) i niesie
  # commit wyzwalającego przebiegu jako `github.event.workflow_run.head_sha` —
  # SHA, którego bramkę właśnie zweryfikowaliśmy — wystawiony niżej jako
  # TARGET_SHA. Smoke test asertuje RELEASE_SHA lub jego zielonego potomka (DEP-01).
  #
  # ROLLBACK (przywrócenie bramki na pełnym CI): zmień `workflows: ["CI Gate"]`
  # z powrotem na `workflows: ["CI"]` ORAZ `GATE_WORKFLOW` w
  # `.github/scripts/select_release_sha.py` na `ci.yml` — inaczej wybór wydania
  # pytałby o inną bramkę niż ta, która wyzwala deploy.
  workflow_run:
    workflows: ["CI Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # DEP-01: wybór wydania czyta wyniki "CI Gate" dla commitów maina.
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # NEXUS is DNS-only (gray cloud) today, but the UA contract from
  # ~/.claude/rules/observability.md applies to every dynaminds smoke curl so
  # the workflow keeps working if the domain ever goes behind the CF proxy.
  SMOKE_UA: "dynaminds-smoke-test/1.0 (+github-actions; nexus)"
  # The commit the deploy verifies. Under `workflow_run` this is the SHA whose
  # CI passed (head_sha of the triggering run); under manual `workflow_dispatch`
  # there is no workflow_run payload, so we fall back to github.sha (main HEAD
  # at dispatch). DEP-01: the deploy job works on RELEASE_SHA (main HEAD with
  # a green gate) chosen by the `select` job.
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # DEP-01: osobny job, żeby odroczony deploy nie wchodził w żaden krok
  # triggera ani smoke (jeden `if` na jobie zamiast warunku na każdym kroku).
  select:
    name: Wybierz wydanie (HEAD maina z zieloną bramką)
    runs-on: ubuntu-latest
    # 15 min grupowania (niżej) + wybór wydania.
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    outputs:
      release_sha: ${{ steps.release_select.outputs.release_sha }}
      defer: ${{ steps.release_select.outputs.defer }}
    steps:
      # Grupowanie deployów (22.09.2026). Przy wielu sesjach Claude pracujących
      # naraz kolejka merge'ów wypuszcza merge'e seriami, a każdy deploy to
      # ~7 min budowy i ~1,5 min przerwy dla użytkowników. Czekamy, aż na mainie
      # będzie cisza przez DEPLOY_QUIET_SECONDS (zmienna repo, domyślnie 300 s),
      # najwyżej 15 min, żeby ciągły strumień nie wstrzymał wdrożeń na zawsze.
      # Wybór wydania niżej bierze HEAD maina, więc cała seria jedzie jednym
      # deployem; kolejne przebiegi tej serii pomija krok koalescencji.
      # Ręczny „Run workflow” (wdróż teraz) nie czeka. `0` wyłącza grupowanie.
      - name: Poczekaj na ciszę na mainie (grupowanie deployów)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUIET: ${{ vars.DEPLOY_QUIET_SECONDS || '300' }}
        run: |
          set -u
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            last=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.commit.committer.date' 2>/dev/null || true)
            if [ -z "$last" ]; then
              echo "::warning::Nie udało się odczytać ostatniego commitu maina — deploy bez grupowania."
              break
            fi
            age=$(( $(date +%s) - $(date -d "$last" +%s) ))
            if [ "$age" -ge "$QUIET" ]; then
              echo "Ostatni merge ${age}s temu (próg ${QUIET}s) — wdrażamy."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Merge'e płyną bez przerwy od 15 min — wdrażamy bieżący HEAD."
              break
            fi
            echo "Ostatni merge ${age}s temu — czekam na ciszę (${QUIET}s)…"
            sleep 30
          done
      - name: Checkout (tylko .github/scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Wybierz wydanie
        id: release_select
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_UNVERIFIED: ${{ github.event_name == 'workflow_dispatch' && '--target-unverified' || '' }}
        run: |
          # Pusta flaga ma zniknąć, nie być "" — stąd brak cudzysłowu.
          # shellcheck disable=SC2086
          python3 .github/scripts/select_release_sha.py select \
            --repo "${{ github.repository }}" --branch main \
            --target "$TARGET_SHA" $TARGET_UNVERIFIED

  deploy:
    name: Deploy + smoke test
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Bramka zdarzenia (tylko zielone "CI Gate" na main albo ręczny dispatch)
    # siedzi na jobie `select`; tu dochodzi odroczenie, gdy HEAD maina nie ma
    # zielonej bramki.
    if: ${{ needs.select.outputs.defer == 'false' }}
    env:
      RELEASE_SHA: ${{ needs.select.outputs.release_sha }}
    steps:
      # Jedyny checkout w tym jobie — i to sparse: potrzebny WYŁĄCZNIE skryptowi
      # podsumowania wersji (DEP-01) na końcu. `workflow_run` zawsze bierze
      # plik workflow z main, a `github.sha` pod nim to HEAD maina — skrypt
      # renderuje tylko tekst, więc wersja skryptu nie wpływa na weryfikację.
      - name: Checkout (tylko .github/scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Skip if release already live (burst coalescing)
        id: precheck
        # Ręczny workflow_dispatch NIGDY nie skipuje — to ścieżka świadomego
        # redeployu (np. po zmianie env varów), gdzie rebuild jest celem.
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # Przy burstach merge'y wcześniejszy przebieg zwykle wdrożył już ten
          # sam RELEASE_SHA (HEAD z zieloną bramką). Kolejny pełny rebuild
          # niczego wtedy nie zmienia, a rebuild-churn zapychał kolejkę Coolify
          # (HTTP 429) i dysk serwera. Skip WYŁĄCZNIE przy równości z
          # RELEASE_SHA. Każdy błąd sondy = fail-open do deployu.
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ -z "$APP_URL" ]; then
            echo "APP_URL unset — deploying normally"
            exit 0
          fi
          response=$(curl -fsSL --max-time 15 -A "$SMOKE_UA" "$APP_URL/api/health" 2>/dev/null || echo '')
          version=$(echo "$response" | jq -r '.version // ""' 2>/dev/null || echo '')
          if [ "$version" = "$RELEASE_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ Produkcja już serwuje wydanie $RELEASE_SHA — pomijam redundantny rebuild."
          else
            echo "Live=${version:-brak}, wydanie=$RELEASE_SHA — deploying normally"
          fi

      - name: Configure release metadata from actual Coolify image tags
        if: ${{ steps.precheck.outputs.skip != 'true' }}
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: python3 .github/scripts/configure_coolify_release.py

      - name: Ensure dedicated candidate identity fingerprint key
        if: ${{ steps.precheck.outputs.skip != 'true' }}
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}"
          auth=(-H "Authorization: Bearer ${COOLIFY_TOKEN}" -H "Accept: application/json")
          curl -fsS "${auth[@]}" \
            "${base}/api/v1/applications/${COOLIFY_APP_UUID}/envs" \
            -o /tmp/candidate_identity_envs.json
          present=$(jq -r \
            'any(.[]?; .key=="CANDIDATE_IDENTITY_FINGERPRINT_KEY")' \
            /tmp/candidate_identity_envs.json)
          # Coolify may mask or indirect env values in this response. Presence
          # is the only safe automation signal: never rotate an existing key,
          # because that would invalidate the provenance HMAC trail. Settings
          # validation rejects an empty, placeholder or JWT-equal value before
          # the application starts.
          if [ "$present" = "true" ]; then
            echo "Dedicated candidate identity fingerprint key is present."
            exit 0
          fi

          value=$(openssl rand -base64 48 | tr -d '\n')
          payload=$(jq -n --arg v "$value" \
            '{key:"CANDIDATE_IDENTITY_FINGERPRINT_KEY", value:$v, is_buildtime:false, is_runtime:true, is_preview:false}')
          code=$(curl -sS -o /tmp/candidate_identity_env_response.json \
            -w "%{http_code}" -X POST "${auth[@]}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${base}/api/v1/applications/${COOLIFY_APP_UUID}/envs")
          unset value payload
          if [ "$code" -ge 400 ]; then
            echo "::error::Failed to provision candidate identity fingerprint key (HTTP $code)."
            exit 1
          fi
          echo "Provisioned a dedicated candidate identity fingerprint key."

      # ── Pomiar przerwy widzianej przez użytkowników (reaudyt 14.09.2026) ──
      # Zielony deploy i końcowy healthcheck NIE mówią, czy użytkownicy dostali
      # w trakcie 503. 14.09 deploy #1509 zakończył się sukcesem, a niezależne
      # sondy zarejestrowały ~105 s „no available server” na froncie i ~52 s
      # 502/503 na API. Ta sonda chodzi w tle od wywołania webhooka do końca
      # joba i raportuje sekundy bez 200 w podsumowaniu biegu. Nie blokuje
      # deployu — to pomiar, który ma pokazać postęp prac nad ciągłością (F03).
      - name: Start user-facing downtime probe
        id: downtime_meter
        if: ${{ steps.precheck.outputs.skip != 'true' }}
        env:
          APP_URL: ${{ vars.APP_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          probe_dir="$RUNNER_TEMP/downtime-probe"
          mkdir -p "$probe_dir"
          cat > "$probe_dir/probe.sh" <<'PROBE'
          #!/usr/bin/env bash
          # Co ~2 s: frontend /login (z przekierowaniami) i API /api/health/live.
          # Linia CSV: epoka_s,cel,kod_http. Kod 000 = brak odpowiedzi/timeout.
          set -u
          out="$1"; stop="$2"; deadline=$(( $(date +%s) + 1800 ))
          while [ ! -f "$stop" ] && [ "$(date +%s)" -lt "$deadline" ]; do
            now=$(date +%s)
            fe=$(curl -sS -o /dev/null -L --max-time 5 -A "$SMOKE_UA" -w '%{http_code}' "$FRONTEND_URL/login" 2>/dev/null || true)
            api=$(curl -sS -o /dev/null --max-time 5 -A "$SMOKE_UA" -w '%{http_code}' "$APP_URL/api/health/live" 2>/dev/null || true)
            echo "$now,frontend,${fe:-000}" >> "$out"
            echo "$now,api,${api:-000}" >> "$out"
            sleep 2
          done
          PROBE
          chmod +x "$probe_dir/probe.sh"
          nohup "$probe_dir/probe.sh" "$probe_dir/samples.csv" "$probe_dir/stop" \
            > "$probe_dir/probe.log" 2>&1 &
          echo $! > "$probe_dir/pid"
          echo "Downtime probe started (pid $(cat "$probe_dir/pid"))."
          # Czas startu Postgresa PRZED webhookiem (pole informacyjne deep health).
          # Porównany po deployu mówi, czy Coolify odtworzył kontener bazy.
          # Fail-open: brak odczytu = „nieznane” w raporcie, nigdy czerwony krok.
          curl -sSL --max-time 25 -A "$SMOKE_UA" "$APP_URL/api/health/deep" 2>/dev/null \
            | jq -r '.postgres_started_at // ""' > "$probe_dir/pg_before" 2>/dev/null || true
          echo "Postgres started_at before deploy: $(cat "$probe_dir/pg_before" 2>/dev/null || echo brak)"

      - name: Trigger deployment
        id: trigger
        if: ${{ steps.precheck.outputs.skip != 'true' }}
        # Sekrety przez `env:`, nie przez `${{ }}` w ciele skryptu. Interpolacja
        # wkleja WARTOŚĆ do tekstu polecenia, ZANIM powłoka je zobaczy — więc
        # wartość z metaznakiem powłoki jest wykonywana, a nie przekazywana.
        # Sprawdzone wykonaniem: dla wartości `abc$(id -u)def` wersja wklejana
        # inline wypisała `Bearer abc501def` (podstawienie WYKONANE), a wersja
        # przez `env:` — `Bearer abc$(id -u)def` (wartość literalna). Ten sam
        # plik używa już `env:` w krokach `Skip if target already live`
        # i `Ensure dedicated candidate identity fingerprint key`.
        env:
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CO_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          # One unified retry loop, 20 attempts × 30s ≈ 10 min ceiling:
          #  - HTTP 429 (queue full) needs to outlast an in-flight ARM build
          #    (4-6 min cold), not 3 quick retries.
          #  - HTTP 5xx (flaky webhook — audit-2026-05-07) heals within one or
          #    two 30s waits.
          http_code=""
          response=""
          for attempt in $(seq 1 20); do
            raw=$(curl -sS -X GET \
              -H "Authorization: Bearer $CO_TOKEN" \
              -H "Accept: application/json" \
              -w $'\nHTTP_CODE:%{http_code}' \
              "$CO_URL/api/v1/deploy?uuid=$CO_APP_UUID&force=false" \
              2>&1 || true)
            http_code=$(echo "$raw" | grep -oE 'HTTP_CODE:[0-9]+' | tail -1 | cut -d: -f2)
            response=$(echo "$raw" | sed -E 's/HTTP_CODE:[0-9]+$//')
            if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
              echo "Coolify responded $http_code on attempt $attempt"
              break
            fi
            # Do logu idzie JEDNO nazwane pole odpowiedzi, przycięte i bez
            # znaków sterujących — nie całe, nieograniczone ciało. Log biegu
            # zostaje w historii repo, a kształt i treść odpowiedzi dyktuje
            # zdalny serwer (dziś `{"message":"Unauthenticated."}`, jutro po
            # zmianie wersji cokolwiek). Nowa linia w treści potrafi zacząć
            # w logu własne polecenie `::warning::`. Ten sam filtr, co
            # w coolify-ops.yml.
            msg=$(printf '%s' "$response" | jq -r '((.message // .error // "brak pola .message w odpowiedzi") | tostring | gsub("[[:cntrl:]]"; " ") | .[0:200])' 2>/dev/null || echo "odpowiedź nie jest JSON-em")
            echo "::warning::Attempt $attempt/20 — Coolify HTTP $http_code — $msg"
            if [ $attempt -lt 20 ]; then
              sleep 30
            fi
          done
          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            echo "::error::Coolify deploy webhook failed after 20 attempts (last HTTP $http_code). If it was 429 the queue is stuck — run the 'Coolify Ops' workflow (action=list, then cancel the wedged deployment UUIDs) and re-dispatch Deploy."
            exit 1
          fi
          echo "Response: $response"
          deployment_uuid=$(echo "$response" | jq -r '.deployments[0].deployment_uuid')
          if [ -z "$deployment_uuid" ] || [ "$deployment_uuid" = "null" ]; then
            echo "::error::Failed to start deployment (no deployment_uuid in response)"
            exit 1
          fi
          echo "Deployment queued: $deployment_uuid"
          echo "deployment_uuid=$deployment_uuid" >> $GITHUB_OUTPUT

      - name: Wait for deployment to finish (fail fast on server-side failure)
        if: ${{ steps.precheck.outputs.skip != 'true' }}
        # Sekrety przez `env:`, nie przez `${{ }}` w ciele skryptu. Interpolacja
        # wkleja WARTOŚĆ do tekstu polecenia, ZANIM powłoka je zobaczy — więc
        # wartość z metaznakiem powłoki jest wykonywana, a nie przekazywana.
        # Sprawdzone wykonaniem: dla wartości `abc$(id -u)def` wersja wklejana
        # inline wypisała `Bearer abc501def` (podstawienie WYKONANE), a wersja
        # przez `env:` — `Bearer abc$(id -u)def` (wartość literalna). Ten sam
        # plik używa już `env:` w krokach `Skip if target already live`
        # i `Ensure dedicated candidate identity fingerprint key`.
        env:
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          # UUID nie jest sekretem, ale jedzie tą samą drogą z tego samego
          # powodu: to wartość zwrócona przez zdalne API, a nie nasz literał.
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          # Poll the exact deployment we queued instead of blind-sleeping.
          # Statuses: queued | in_progress | finished | failed | cancelled-by-user.
          # 180 × 5s = 15 min ceiling — ten sam sufit co wcześniej (60 × 15s),
          # ale drobniejsza ziarnistość. Coolify kończy w losowym momencie
          # względem pętli, więc przy 15 s marnowaliśmy średnio ~7 s na samo
          # niezauważenie, że już skończył. Odpytanie API jest tanie.
          status=""
          for i in $(seq 1 180); do
            resp=$(curl -sS \
              -H "Authorization: Bearer $CO_TOKEN" \
              -H "Accept: application/json" \
              "$CO_URL/api/v1/deployments/$DEPLOYMENT_UUID" 2>/dev/null || echo '')
            status=$(echo "$resp" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")
            case "$status" in
              finished)
                echo "✅ Deployment $DEPLOYMENT_UUID finished after ~$((i * 5))s"
                # DEP-01: tylko informacyjnie — bramkę zbudowanego commitu
                # rozstrzyga smoke (`select_release_sha.py accept`).
                built=$(echo "$resp" | jq -r '.commit // ""' 2>/dev/null || echo '')
                echo "Commit zgłoszony przez Coolify: ${built:-brak pola} (wydanie $RELEASE_SHA)"
                exit 0
                ;;
              failed|cancelled*|cancelled-by-user)
                echo "::error::Deployment $DEPLOYMENT_UUID ended with status=$status — server-side log tail below"
                # .logs is a JSON-encoded array of {output,type,hidden,...}.
                # Print the last non-hidden entries; fall back to a raw tail if
                # the shape ever changes. Build logs carry no secret values.
                logs=$(echo "$resp" | jq -r '.logs // ""' 2>/dev/null || echo '')
                if [ -n "$logs" ]; then
                  echo "$logs" | jq -r '.[-30:][] | select(.hidden != true) | "[\(.type // "out")] \((.output // "") | .[0:400])"' 2>/dev/null \
                    || echo "$logs" | tail -c 3000
                else
                  echo "(no logs returned by API)"
                fi
                exit 1
                ;;
              *)
                # Log co 6. próbę (~30 s), żeby 5-sekundowa ziarnistość nie
                # zalała logu 180 liniami. `if`, nie `[ … ] && echo`: kroki
                # `run:` chodzą pod `bash -e`, więc fałszywy test jako ostatnia
                # komenda iteracji wywaliłby krok.
                if [ $(( (i - 1) % 6 )) -eq 0 ]; then
                  echo "Attempt $i/180: status=$status, retrying every 5s..."
                fi
                sleep 5
                ;;
            esac
          done
          echo "::error::Deployment $DEPLOYMENT_UUID still '$status' after 15 min — treating as failed. Run the 'Coolify Ops' workflow to inspect/cancel it."
          exit 1

      # ── Smoke test scalony z jobem deploy (2026-08-07) ──────────────
      # Był osobnym jobem z `needs: deploy`. Same testy trwają ~5 s, a
      # GitHub kolejkował pod nie DRUGI runner: zmierzone 10 s luki między
      # jobami + ~7 s setupu, czyli narzut ~3x dłuższy niż praca. Scalenie
      # nic nie zmienia w kolejności (i tak biegły sekwencyjnie) ani
      # w bramkowaniu — `if:` joba deploy obejmuje teraz również te kroki,
      # a wcześniej `needs: deploy` dawał dokładnie ten sam efekt.
      - name: Healthcheck (standard shape + version match)
        env:
          APP_URL: ${{ vars.APP_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::vars.APP_URL not set in repo settings"
            exit 1
          fi
          EXPECTED_SHA=$(echo "$RELEASE_SHA" | cut -c1-7)
          # The deploy job already confirmed the deployment FINISHED server-side,
          # so this only needs to absorb the container swap + app boot —
          # 20 × 15s = 5 min is plenty (was: blind sleep 180 + 6 min).
          for i in $(seq 1 20); do
            response=$(curl -fsSL -A "$SMOKE_UA" "$APP_URL/api/health" 2>/tmp/curl_err || echo '')
            if [ -n "$response" ]; then
              status=$(echo "$response" | jq -r '.status // "missing"')
              version=$(echo "$response" | jq -r '.version // "missing"')
              version_short=$(echo "$version" | cut -c1-7)
              if [ "$status" != "unhealthy" ] && [ "$status" != "missing" ]; then
                # DEP-01: RELEASE_SHA albo jego potomek z ZIELONĄ bramką (merge
                # między wyborem wydania a klonem w Coolify). Potomek z bramką
                # czerwoną = twardy błąd; na bramkę w toku skrypt czeka ≤ 10 min.
                # Przyjęta wersja trafia do ACCEPTED_SHA (GITHUB_ENV) i wiąże
                # kolejne kroki smoke.
                set +e
                python3 .github/scripts/select_release_sha.py accept \
                  --repo "${{ github.repository }}" --release "$RELEASE_SHA" --live "$version"
                verdict=$?
                set -e
                if [ "$verdict" = "0" ]; then
                  echo "✅ Pass: status=$status version=$version"
                  exit 0
                fi
                if [ "$verdict" = "1" ]; then
                  exit 1
                fi
                echo "Attempt $i: stale version (got $version_short, expected $EXPECTED_SHA or its green descendant), retrying in 15s..."
              else
                echo "Attempt $i: status=$status, retrying in 15s..."
              fi
            else
              # Surface curl's actual error so future silent failures are
              # diagnosable in 1 attempt instead of 20 (e.g. Cloudflare WAF
              # 403 on the runner IP, like Atlas hit — see Atlas PR #96).
              echo "Attempt $i: no response — $(cat /tmp/curl_err 2>/dev/null | head -1), retrying in 15s..."
            fi
            sleep 15
          done
          echo "::error::Smoke test failed after 20 attempts (5 min) — deployment finished server-side but the app never served the new SHA"
          exit 1

      # Do 2026-08-24 CALY smoke test deployu pytal wylacznie `$APP_URL/api/health`,
      # czyli BACKEND. Frontend — aplikacje, ktorej uzywaja ludzie — nie dotykal zaden
      # krok wdrozenia; pytal go dopiero cron `uptime-probe.yml`, czyli po czasie i poza
      # kontekstem deployu, ktory to zepsul.
      #
      # Incydent 10:00 UTC tego dnia (run 32714117954): kontener frontendu "Created" ->
      # "Starting" -> "Error response from daemon: No such container". Backend, postgres
      # i qdrant wstaly, /api/health zwracalo 200 healthy — a https://nexus.dynaminds.pl
      # oddawalo uzytkownikom 503 "no available server". Deploy zaczerwienil sie WYLACZNIE
      # dlatego, ze blad startu wyszedl w kroku "Wait for deployment" po stronie Coolify.
      # Gdyby kontener wstal i wywrocil sie chwile pozniej albo zaczal serwowac bledy,
      # smoke test przeszedlby na zielono przy lezacej aplikacji — bo nie mial czym tego
      # zobaczyc.
      #
      # Osobna zmienna, NIE zmiana APP_URL: tamta zasila rowniez koalescencje burstow
      # (porownanie SHA z /api/health w kroku "Skip if target already live"), wiec jej
      # przestawienie na frontend zepsuloby pomijanie redundantnych rebuildow.
      - name: Frontend osiągalny (aplikacja użytkownika)
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          # Brak zmiennej = blad, nie ciche pominiecie. Kontrola, ktora po cichu nie
          # zachodzi, odtwarza dokladnie ten defekt, ktory ten krok ma zamykac.
          # Lustro istniejacej konwencji: "::error::vars.APP_URL not set in repo settings".
          if [ -z "$FRONTEND_URL" ]; then
            echo "::error::vars.FRONTEND_URL nie jest ustawione — smoke test nie ma czego sprawdzic"
            exit 1
          fi
          # `-L` jest LOAD-BEARING: `/` zwraca 307 -> `/login` dla niezalogowanych
          # (middleware deny-by-default). Probe bez sledzenia przekierowan widzi 307
          # i bierze je za awarie — w lipcu dalo to 24 falszywe alarmy pod rzad
          # (patrz komentarz w uptime-probe.yml), a 24.08 powtorzyl ten sam blad
          # obserwator pisany ad hoc podczas tego wlasnie incydentu.
          #
          # Kontener frontendu odtwarza sie niezaleznie od backendu (bez depends_on
          # od 14.09.2026), wiec w chwili, gdy /api/health serwuje juz nowy SHA,
          # frontend moze jeszcze wstawac. Stad wlasny budzet ponowien zamiast
          # pojedynczego zapytania.
          # Czas mierzony, NIE szacowany: przy `--max-time 15` + `sleep 15` jedna
          # iteracja trwa od 15 s (szybka odpowiedz) do 30 s (timeout curla), wiec
          # kazda liczba wpisana na sztywno klamie w polowie przypadkow — i to
          # akurat w tych, ktore sie diagnozuje.
          started=$SECONDS
          for i in $(seq 1 12); do
            # Bez `read` z podstawieniem procesu: tamto konczy na EOF ze statusem 1
            # i przy `set -e` ubija krok mimo poprawnej odpowiedzi (ta sama pulapka
            # jest udokumentowana w uptime-probe.yml).
            # `|| true`, NIE `|| echo "000 -"`: przy bledzie curl MIMO TO wypisuje `-w`
            # (kod 000 + adres), wiec `echo` doklejalby drugi komplet i adres koncowy
            # w diagnostyce wychodzil sklejony ("http://host/000 -"). Kod odpowiedzi byl
            # wtedy poprawny przez przypadek — jako pierwszy token.
            out=$(curl -sSL -o /dev/null -w '%{http_code} %{url_effective}' \
                  --max-time 15 "$FRONTEND_URL" 2>/tmp/fe_err) || true
            [ -z "$out" ] && out="000 -"
            code=${out%% *}
            final=${out#* }
            if [ "$code" = "200" ]; then
              echo "✅ Frontend: HTTP 200 (po przekierowaniach: $final)"
              exit 0
            fi
            echo "Proba $i: HTTP $code (adres koncowy: $final) $(head -1 /tmp/fe_err 2>/dev/null), ponawiam za 15s..."
            sleep 15
          done
          echo "::error::Frontend nie odpowiedzial 200 po $i probach ($((SECONDS-started))s) — backend moze byc zdrowy, a aplikacja uzytkownika lezec ($FRONTEND_URL)"
          exit 1

      # DEP-03 (audyt Codexa, 14.09.2026): HTTP 200 z frontendu mowi tylko, ze
      # JAKIS kontener odpowiada — stary obraz (build, ktory padl po cichu,
      # Traefik wciaz na poprzednim kontenerze) tez oddaje 200. Backend ma
      # `version` w /api/health; frontend od tej zmiany ma `public/version.json`
      # z SHA builda (frontend/scripts/write-version.mjs, wolany w Dockerfile
      # przed `next build`; SHA z build arga NEXT_PUBLIC_GIT_SHA = ${GIT_SHA}
      # z Coolify — to samo zrodlo, co `version` backendu).
      #
      # Ta sama wersja, ktora przyjal smoke backendu: RÓWNOŚĆ z ACCEPTED_SHA
      # (RELEASE_SHA albo jego potomek z zielona bramka — DEP-01). `sha: "unknown"` = build bez
      # build arga i jest odrzucane wprost, nie przepuszczane jako „cos”.
      # Middleware nie dotyka sciezek z kropka (`matcher` wyklucza `.*\..*`),
      # wiec plik jest publiczny bez logowania. Outputs zasilaja podsumowanie
      # wersji (DEP-01) na koncu joba.
      - name: Frontend serwuje oczekiwaną wersję (version.json)
        id: frontend_version
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          if [ -z "$FRONTEND_URL" ]; then
            echo "::error::vars.FRONTEND_URL nie jest ustawione — smoke test nie ma czego sprawdzic"
            exit 1
          fi
          EXPECTED_SHA=$(echo "$ACCEPTED_SHA" | cut -c1-7)
          sha=""
          started=$SECONDS
          for i in $(seq 1 12); do
            body=$(curl -sSL --max-time 15 -A "$SMOKE_UA" "$FRONTEND_URL/version.json" 2>/tmp/fe_ver_err || true)
            # 404 z Next.js to HTML, nie JSON — jq pada, `sha` zostaje puste.
            sha=$(printf '%s' "$body" | jq -r '.sha // ""' 2>/dev/null || true)
            sha_short=$(printf '%s' "$sha" | cut -c1-7)
            if [ -n "$sha" ] && [ "$sha" != "unknown" ] && [ ${#sha} -ge 7 ]; then
              echo "frontend_sha=$sha" >> "$GITHUB_OUTPUT"
              if [ "$sha" = "$ACCEPTED_SHA" ]; then
                echo "✅ Frontend: version.json sha=$sha_short == wydanie $EXPECTED_SHA"
                exit 0
              fi
              echo "Proba $i: frontend sha=$sha_short, oczekiwano $EXPECTED_SHA, ponawiam za 15s..."
            elif [ "$sha" = "unknown" ]; then
              echo "::error::Frontend release metadata missing: version.json sha=unknown"
              exit 1
            else
              echo "Proba $i: brak czytelnego version.json $(head -1 /tmp/fe_ver_err 2>/dev/null), ponawiam za 15s..."
            fi
            sleep 15
          done
          echo "frontend_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "::error::Frontend nie serwuje oczekiwanej wersji po $i probach ($((SECONDS-started))s): version.json sha='${sha:-brak}' vs wydanie $EXPECTED_SHA. Frontend odpowiada, ale STARYM buildem — sprawdz log builda frontendu w Coolify i czy GIT_SHA (is_buildtime) jest ustawione."
          exit 1

      - name: Deep healthcheck (core modules not 503)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # /api/health only pings `SELECT 1`, so a core module can 503 for real
          # users while the deploy ships green (it never touched that endpoint).
          # This probes /api/health/deep, which runs `SELECT ... LIMIT 1` per core
          # table via the ORM — catching the recurring alembic multi-head + partial
          # entrypoint safety-net trap where a migration column never lands on prod
          # (e.g. 2026-07-06: 0154 `contract_candidate_rates.effective_to` 503'd all
          # of /api/contracts for a day while every deploy stayed green — PR #647).
          #
          # No auth is needed (endpoint is public by design — avoids coupling the
          # deploy gate to CI-side login/token config that could itself go stale).
          # The previous step already confirmed the NEW build is live, so the
          # container is up; we re-check version here so module health is asserted
          # on the new build, not a stale container.
          #
          # NOTE: `curl` runs WITHOUT `-f` on purpose — a 503 is exactly the signal
          # we want, and `-f` would discard the JSON body that names the failing
          # table(s). A few retries absorb a transient DB blip; real schema drift is
          # deterministic and exhausts the loop → red.
          if [ -z "$APP_URL" ]; then
            echo "::error::vars.APP_URL not set in repo settings"
            exit 1
          fi
          EXPECTED_SHA=$(echo "$ACCEPTED_SHA" | cut -c1-7)
          for i in $(seq 1 6); do
            response=$(curl -sSL --max-time 25 -A "$SMOKE_UA" "$APP_URL/api/health/deep" 2>/tmp/curl_err || echo '')
            if [ -n "$response" ]; then
              status=$(echo "$response" | jq -r '.status // "missing"')
              version=$(echo "$response" | jq -r '.version // "missing"')
              version_short=$(echo "$version" | cut -c1-7)
              # DEP-01: deep health liczy się wyłącznie na przyjętej wersji.
              ok_version=false
              if [ "$version" = "$ACCEPTED_SHA" ]; then
                ok_version=true
              fi
              if [ "$ok_version" != "true" ]; then
                echo "Attempt $i: stale version (got $version_short, expected $EXPECTED_SHA), retrying in 15s..."
              elif [ "$status" = "healthy" ]; then
                echo "✅ Pass: all core modules healthy on $version_short"
                echo "$response" | jq -c '.checks'
                exit 0
              else
                # Unhealthy on the NEW build → a core module is down. Surface the
                # failing tables + exception classes so the cause is obvious in-log.
                echo "Attempt $i: status=$status on $version_short — core module(s) failing:"
                echo "$response" | jq -c '{checks: .checks, errors: .errors}'
                echo "retrying in 15s..."
              fi
            else
              echo "Attempt $i: no response — $(cat /tmp/curl_err 2>/dev/null | head -1), retrying in 15s..."
            fi
            sleep 15
          done
          echo "::error::Deep healthcheck failed after 6 attempts — a core module is 503-ing on the new build. See the {checks, errors} dump above; a likely cause is a migration column that never landed on prod — mirror it into backend/entrypoint.sh _COLUMN_STATEMENTS (see memory entrypoint-safetynet-new-columns)."
          exit 1

      - name: Alembic revision check (DB bookmark == code heads)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # DEP-02 (audyt Codexa, 14.09.2026): `backend/entrypoint.sh` CELOWO
          # toleruje bledy `alembic upgrade heads` (bookmark na prodzie bywal
          # osierocony, schemat domyka safety-net DDL), wiec deploy przechodzil
          # na zielono takze wtedy, gdy zadna nowa migracja nie weszla — a nikt
          # o tym nie wiedzial, bo /api/health/alembic nie byl nigdzie wolany.
          # Od stampa 2026-07-30 bookmark = head i migracje aplikuja sie
          # normalnie; ten krok pilnuje, zeby tak zostalo: zbior `db_versions`
          # ma byc rowny zbiorowi `code_heads`, a `orphaned` pusty.
          #
          # Bez `-f` (jak deep health): cialo JSON z obiema listami jest tym, co
          # ma wyladowac w logu. Ponowienia lapia chwilowa niedostepnosc bazy
          # (`db_error`) i restart kontenera; realny rozjazd rewizji jest
          # deterministyczny i wyczerpuje petle → czerwony deploy.
          # Deep health w kroku wyzej juz potwierdzil, ze na prodzie stoi
          # przyjeta wersja (ACCEPTED_SHA) — tu nie powtarzamy logiki wersji.
          if [ -z "$APP_URL" ]; then
            echo "::error::vars.APP_URL not set in repo settings"
            exit 1
          fi
          for i in $(seq 1 6); do
            response=$(curl -sSL --max-time 25 -A "$SMOKE_UA" "$APP_URL/api/health/alembic" 2>/tmp/curl_err || echo '')
            if [ -n "$response" ] && echo "$response" | jq -e 'type == "object"' >/dev/null 2>&1; then
              db_versions=$(echo "$response" | jq -c '(.db_versions // []) | sort')
              code_heads=$(echo "$response" | jq -c '(.code_heads // []) | sort')
              orphaned=$(echo "$response" | jq -c '.orphaned // []')
              # Kazdy warunek jawnie: puste `db_versions` przy `db_error` NIE moze
              # przejsc jako "[] == []" — brak odczytu to nie zgodnosc.
              if echo "$response" | jq -e '
                    (.db_error == null) and (.code_error == null)
                    and ((.db_versions // []) | length > 0)
                    and (((.db_versions // []) | sort) == ((.code_heads // []) | sort))
                    and ((.orphaned // []) | length == 0)' >/dev/null; then
                echo "✅ Pass: alembic bookmark $db_versions == code heads $code_heads, orphaned: $orphaned"
                exit 0
              fi
              echo "Attempt $i: alembic mismatch — db_versions=$db_versions code_heads=$code_heads orphaned=$orphaned $(echo "$response" | jq -c '{db_error, code_error}'), retrying in 15s..."
            else
              echo "Attempt $i: no response — $(cat /tmp/curl_err 2>/dev/null | head -1), retrying in 15s..."
            fi
            sleep 15
          done
          echo "::error::Alembic revision check failed after 6 attempts — prod alembic_version ${db_versions:-<no response>} != code heads ${code_heads:-<no response>} (orphaned: ${orphaned:-<no response>}). A migration did not apply on prod: read the entrypoint log for the failing revision, fix it (or stamp deliberately — see docs/alembic-0153-nda-signed-completion-report.md), then redeploy."
          echo "Last /api/health/alembic response: $(echo "${response:-}" | head -c 600)"
          exit 1

      # DEP-01 (audyt 14.09.2026): podsumowanie mówi, CO naprawdę stoi na
      # produkcji po TYM deployu: TARGET_SHA (commit, którego bramka wyzwoliła
      # bieg), RELEASE_SHA (HEAD maina z zieloną bramką), ACCEPTED_SHA (wersja
      # przyjęta przez smoke) i SHA serwowane przez backend oraz frontend.
      # `always()`: rozjazd jest najciekawszy właśnie wtedy, gdy smoke padł.
      # Każde wywołanie jest fail-open, a krok nigdy nie zmienia wyniku joba.
      - name: Podsumowanie wersji (wydanie vs produkcja)
        if: ${{ always() }}
        env:
          APP_URL: ${{ vars.APP_URL }}
          REBUILD_SKIPPED: ${{ steps.precheck.outputs.skip == 'true' }}
          FRONTEND_SHA: ${{ steps.frontend_version.outputs.frontend_sha }}
        run: |
          set +e
          live=""
          if [ -n "$APP_URL" ]; then
            live=$(curl -fsSL --max-time 15 -A "$SMOKE_UA" "$APP_URL/api/health" 2>/dev/null | jq -r '.version // ""' 2>/dev/null)
          fi
          if [ ! -f .github/scripts/deploy_version_summary.py ]; then
            echo "::warning::Brak .github/scripts/deploy_version_summary.py (checkout nie zaszedł?) — podsumowanie wersji pominięte. release=${RELEASE_SHA:-brak} live=${live:-brak}"
            exit 0
          fi
          python3 .github/scripts/deploy_version_summary.py \
            --target "$TARGET_SHA" \
            --release "${RELEASE_SHA:-}" \
            --accepted "${ACCEPTED_SHA:-}" \
            --backend-live "$live" \
            --frontend-live "$FRONTEND_SHA" \
            --rebuild-skipped "$REBUILD_SKIPPED" \
            --summary-out "$RUNNER_TEMP/version-summary.md" \
            --notice-out "$RUNNER_TEMP/version-notice.txt" \
            || { echo "::warning::Skrypt podsumowania wersji padł — release=${RELEASE_SHA:-brak} live=${live:-brak}"; exit 0; }
          cat "$RUNNER_TEMP/version-summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/version-notice.txt"
          exit 0

      # Plan skracania przerwy (Etap 0): bez czasu każdej fazy startu nie wiadomo,
      # co skracać. Świeży kontener ma w logu mało linii, więc odczyt zaraz po
      # smoke teście trafia w start TEGO deployu. Wyłącznie linie
      # `[startup-timing]` (logi Actions są publiczne); fail-open.
      - name: Czasy faz startu backendu
        if: ${{ always() && steps.trigger.outcome == 'success' }}
        env:
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set +e
          out=$(python3 .github/scripts/startup-timing-logs.py 2>/dev/null)
          echo "$out"
          total=$(printf '%s' "$out" | jq -r '.total_seconds // "brak"' 2>/dev/null)
          top=$(printf '%s' "$out" | jq -r '[.top_phases[:3][] | "\(.phase) \(.seconds)s"] | join(", ")' 2>/dev/null)
          echo "::notice title=Start backendu::przed uvicornem: ${total:-brak} s; najdłuższe fazy: ${top:-brak odczytu}"
          exit 0

      - name: Report user-facing downtime
        # `always()`: przerwa jest najciekawsza właśnie wtedy, gdy smoke test padł.
        if: ${{ always() && steps.downtime_meter.outcome == 'success' }}
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set +e
          probe_dir="$RUNNER_TEMP/downtime-probe"
          touch "$probe_dir/stop"
          sleep 3
          kill "$(cat "$probe_dir/pid" 2>/dev/null)" 2>/dev/null || true
          samples="$probe_dir/samples.csv"
          if [ ! -s "$samples" ]; then
            echo "::warning::Sonda przerwy nie zebrała próbek — brak pomiaru dla tego deployu."
            exit 0
          fi
          pg_after=$(curl -sSL --max-time 25 -A "$SMOKE_UA" "$APP_URL/api/health/deep" 2>/dev/null \
            | jq -r '.postgres_started_at // ""' 2>/dev/null)
          python3 .github/scripts/deploy_downtime_report.py \
            --samples "$samples" --target "${RELEASE_SHA:-$TARGET_SHA}" \
            --postgres-before "$(cat "$probe_dir/pg_before" 2>/dev/null)" \
            --postgres-after "$pg_after" \
            --summary-out "$probe_dir/summary.md" \
            --notice-out "$probe_dir/notices.txt" \
            || { echo "::warning::Skrypt raportu przerwy padł — brak pomiaru dla tego deployu."; exit 0; }
          cat "$probe_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$probe_dir/notices.txt"
          exit 0
