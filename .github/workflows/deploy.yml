name: Exact SHA release

# The legacy branch/webhook deployment path is intentionally gone. This
# workflow is fail-closed until the isolated staging inventory, protected
# GitHub Environments, snapshot endpoint, rollback floor and production-clone
# migration reconciliation have all been completed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-production-release
  cancel-in-progress: false

jobs:
  release-disabled:
    name: Release disabled until staging and reconciliation are ready
    if: vars.NEXUS_RELEASE_PIPELINE_ENABLED != 'true' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Explain the fail-closed state
        run: |
          echo "::notice::No deployment was attempted. Complete docs/ops/migration-reconciliation.md, configure the isolated NEXUS staging inventory, protected staging/production Environments, exact-SHA Coolify applications, backup endpoint and rollback floor; then set NEXUS_RELEASE_PIPELINE_ENABLED=true."

  quality-gate:
    name: Revalidate the exact release SHA
    if: vars.NEXUS_RELEASE_PIPELINE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Staging then approved production
    if: vars.NEXUS_RELEASE_PIPELINE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: quality-gate
    uses: ./.github/workflows/_reusable-coolify-release.yml
    secrets: inherit
    with:
      standards_ref: fa4bb1123a3ea1b444e8bd4d36fb180567960a13
      application: nexus
      coolify_deploy_method: GET
      staging_coolify_base_url: ${{ vars.STAGING_COOLIFY_BASE_URL }}
      production_coolify_base_url: ${{ vars.PRODUCTION_COOLIFY_BASE_URL }}
      staging_application_uuid: ${{ vars.NEXUS_STAGING_APPLICATION_UUID }}
      production_application_uuid: ${{ vars.NEXUS_PRODUCTION_APPLICATION_UUID }}
      staging_base_url: ${{ vars.NEXUS_STAGING_BASE_URL }}
      staging_health_url: ${{ vars.NEXUS_STAGING_BASE_URL }}/api/health
      production_health_url: https://api.nexus.dynaminds.pl/api/health
      production_snapshot_url: ${{ vars.NEXUS_PRODUCTION_SNAPSHOT_URL }}
      staging_migration_command: ./scripts/ci/migrate-staging
      production_snapshot_command: ./scripts/ci/snapshot-production
      production_migration_command: ./scripts/ci/migrate-production-expand
      staging_e2e_command: ./scripts/ci/e2e-staging
      migration_head_command: ./scripts/ci/migration-head
      rollback_guard_command: ./scripts/ci/assert-rollback-allowed
      rollback_floor_sha: ${{ vars.ROLLBACK_FLOOR_SHA }}
      staging_environment: staging
      production_environment: production
