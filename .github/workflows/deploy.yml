name: Deploy

# Unified deployment workflow per ~/.claude/rules/deployment.md.
# Identyczny pattern dla wszystkich 3 apek (Compass, NEXUS, LeadGen).
#
# Push do main → CI ("CI" workflow) runs → on its success this workflow fires
# (via workflow_run, see the `on:` block) → trigger Coolify deploy via API →
# poll deployment status by UUID → smoke test /api/health. Coolify samo buduje
# + restart kontenerów. Red CI → deploy skipped (P1-CI-01 gate).
#
# 2026-07-16 (analytics plan PR 0): the old flow fired the webhook and then
# blind-slept 180s before polling /api/health. Two real failure modes slipped
# through or wedged it:
#   1. Coolify HTTP 429 "Deployment queue is full" — 3 fast retries (5/15/45s)
#      could never outlast a queue backed up by a slow ARM build, so every
#      main push after the first went red (2026-07-16 morning).
#   2. A deployment that FAILED server-side was invisible: the webhook said
#      "queued", the smoke test then burned 6 minutes polling a stale version
#      and reported a generic timeout with zero diagnostics (2026-07-15 evening).
# Now we save the deployment UUID, poll its status, fail fast on
# failed/cancelled with the server-side log tail, and only then health-check.
#
# Required GH secrets:
#   COOLIFY_URL       e.g. https://coolify-compass.dynaminds.pl
#   COOLIFY_TOKEN     Bearer token (Sanctum personal_access_tokens)
#   COOLIFY_APP_UUID  Application UUID (from Coolify panel resource URL)
#
# Required GH variables:
#   APP_URL           Production URL for smoke test (e.g. https://compass.dynaminds.pl)

on:
  # P1-CI-01: gate the deploy on the SAME-SHA CI passing.
  #
  # Previously this workflow triggered directly on `push: branches: [main]`,
  # INDEPENDENTLY of ci.yml. Nothing coupled them, so a red post-merge push-CI
  # (branch protection only gates the PR, not the post-merge push to main) did
  # NOT stop the deploy — a broken main could still ship to prod.
  #
  # Now the deploy is chained to ci.yml (workflow name "CI") via `workflow_run`:
  #   push to main → "CI" runs → on its completion this workflow fires →
  #   the deploy job runs ONLY if that run's conclusion == success (see the
  #   `if:` guard on the deploy job). Red CI → deploy job skipped → no deploy.
  #
  # `workflow_run` always uses the workflow file from the default branch (main)
  # and carries the triggering run's commit as
  # `github.event.workflow_run.head_sha` — the SHA whose CI we just verified —
  # exposed below as TARGET_SHA and asserted by the smoke test.
  #
  # ROLLBACK: revert this `on:` block to the ungated form —
  #     on:
  #       push:
  #         branches: [main]
  #       workflow_dispatch:
  # and drop the `if:` guard + TARGET_SHA env added alongside it.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # NEXUS is DNS-only (gray cloud) today, but the UA contract from
  # ~/.claude/rules/observability.md applies to every dynaminds smoke curl so
  # the workflow keeps working if the domain ever goes behind the CF proxy.
  SMOKE_UA: "dynaminds-smoke-test/1.0 (+github-actions; nexus)"
  # The commit the deploy verifies. Under `workflow_run` this is the SHA whose
  # CI passed (head_sha of the triggering run); under manual `workflow_dispatch`
  # there is no workflow_run payload, so we fall back to github.sha (main HEAD
  # at dispatch). The smoke test asserts /api/health serves this SHA.
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Trigger Coolify deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deploy ONLY when the same-SHA CI passed on main. A manual
    # workflow_dispatch (no workflow_run payload) is kept as an escape hatch for
    # redeploys/rollbacks (deployment-runbook §4). A red — or non-main — CI run
    # leaves this false → this job is skipped → smoke-test (needs: deploy) is
    # skipped too → the whole workflow no-ops without touching prod.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    steps:
      - name: Trigger deployment
        id: trigger
        run: |
          # One unified retry loop, 20 attempts × 30s ≈ 10 min ceiling:
          #  - HTTP 429 (queue full) needs to outlast an in-flight ARM build
          #    (4-6 min cold), not 3 quick retries.
          #  - HTTP 5xx (flaky webhook — audit-2026-05-07) heals within one or
          #    two 30s waits.
          http_code=""
          response=""
          for attempt in $(seq 1 20); do
            raw=$(curl -sS -X GET \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              -H "Accept: application/json" \
              -w $'\nHTTP_CODE:%{http_code}' \
              "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}&force=false" \
              2>&1 || true)
            http_code=$(echo "$raw" | grep -oE 'HTTP_CODE:[0-9]+' | tail -1 | cut -d: -f2)
            response=$(echo "$raw" | sed -E 's/HTTP_CODE:[0-9]+$//')
            if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
              echo "Coolify responded $http_code on attempt $attempt"
              break
            fi
            echo "::warning::Attempt $attempt/20 — Coolify HTTP $http_code, body: $response"
            if [ $attempt -lt 20 ]; then
              sleep 30
            fi
          done
          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            echo "::error::Coolify deploy webhook failed after 20 attempts (last HTTP $http_code). If it was 429 the queue is stuck — run the 'Coolify Ops' workflow (action=list, then cancel the wedged deployment UUIDs) and re-dispatch Deploy."
            exit 1
          fi
          echo "Response: $response"
          deployment_uuid=$(echo "$response" | jq -r '.deployments[0].deployment_uuid')
          if [ -z "$deployment_uuid" ] || [ "$deployment_uuid" = "null" ]; then
            echo "::error::Failed to start deployment (no deployment_uuid in response)"
            exit 1
          fi
          echo "Deployment queued: $deployment_uuid"
          echo "deployment_uuid=$deployment_uuid" >> $GITHUB_OUTPUT

      - name: Wait for deployment to finish (fail fast on server-side failure)
        run: |
          # Poll the exact deployment we queued instead of blind-sleeping.
          # Statuses: queued | in_progress | finished | failed | cancelled-by-user.
          # 60 × 15s = 15 min ceiling (cold ARM build with heavy native deps).
          DEPLOYMENT_UUID="${{ steps.trigger.outputs.deployment_uuid }}"
          status=""
          for i in $(seq 1 60); do
            resp=$(curl -sS \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              -H "Accept: application/json" \
              "${{ secrets.COOLIFY_URL }}/api/v1/deployments/$DEPLOYMENT_UUID" 2>/dev/null || echo '')
            status=$(echo "$resp" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")
            case "$status" in
              finished)
                echo "✅ Deployment $DEPLOYMENT_UUID finished after ~$((i * 15))s"
                exit 0
                ;;
              failed|cancelled*|cancelled-by-user)
                echo "::error::Deployment $DEPLOYMENT_UUID ended with status=$status — server-side log tail below"
                # .logs is a JSON-encoded array of {output,type,hidden,...}.
                # Print the last non-hidden entries; fall back to a raw tail if
                # the shape ever changes. Build logs carry no secret values.
                logs=$(echo "$resp" | jq -r '.logs // ""' 2>/dev/null || echo '')
                if [ -n "$logs" ]; then
                  echo "$logs" | jq -r '.[-30:][] | select(.hidden != true) | "[\(.type // "out")] \((.output // "") | .[0:400])"' 2>/dev/null \
                    || echo "$logs" | tail -c 3000
                else
                  echo "(no logs returned by API)"
                fi
                exit 1
                ;;
              *)
                echo "Attempt $i/60: status=$status, retrying in 15s..."
                sleep 15
                ;;
            esac
          done
          echo "::error::Deployment $DEPLOYMENT_UUID still '$status' after 15 min — treating as failed. Run the 'Coolify Ops' workflow to inspect/cancel it."
          exit 1

  smoke-test:
    name: Smoke test /api/health
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Healthcheck (standard shape + version match)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::vars.APP_URL not set in repo settings"
            exit 1
          fi
          EXPECTED_SHA=$(echo "$TARGET_SHA" | cut -c1-7)
          # The deploy job already confirmed the deployment FINISHED server-side,
          # so this only needs to absorb the container swap + app boot —
          # 20 × 15s = 5 min is plenty (was: blind sleep 180 + 6 min).
          for i in $(seq 1 20); do
            response=$(curl -fsSL -A "$SMOKE_UA" "$APP_URL/api/health" 2>/tmp/curl_err || echo '')
            if [ -n "$response" ]; then
              status=$(echo "$response" | jq -r '.status // "missing"')
              version=$(echo "$response" | jq -r '.version // "missing"')
              version_short=$(echo "$version" | cut -c1-7)
              if [ "$status" != "unhealthy" ] && [ "$status" != "missing" ]; then
                if [ "$version_short" = "$EXPECTED_SHA" ]; then
                  echo "✅ Pass: status=$status version=$version"
                  exit 0
                fi
                echo "Attempt $i: stale version (got $version_short, expected $EXPECTED_SHA), retrying in 15s..."
              else
                echo "Attempt $i: status=$status, retrying in 15s..."
              fi
            else
              # Surface curl's actual error so future silent failures are
              # diagnosable in 1 attempt instead of 20 (e.g. Cloudflare WAF
              # 403 on the runner IP, like Atlas hit — see Atlas PR #96).
              echo "Attempt $i: no response — $(cat /tmp/curl_err 2>/dev/null | head -1), retrying in 15s..."
            fi
            sleep 15
          done
          echo "::error::Smoke test failed after 20 attempts (5 min) — deployment finished server-side but the app never served the new SHA"
          exit 1

      - name: Deep healthcheck (core modules not 503)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # /api/health only pings `SELECT 1`, so a core module can 503 for real
          # users while the deploy ships green (it never touched that endpoint).
          # This probes /api/health/deep, which runs `SELECT ... LIMIT 1` per core
          # table via the ORM — catching the recurring alembic multi-head + partial
          # entrypoint safety-net trap where a migration column never lands on prod
          # (e.g. 2026-07-06: 0154 `contract_candidate_rates.effective_to` 503'd all
          # of /api/contracts for a day while every deploy stayed green — PR #647).
          #
          # No auth is needed (endpoint is public by design — avoids coupling the
          # deploy gate to CI-side login/token config that could itself go stale).
          # The previous step already confirmed the NEW build is live, so the
          # container is up; we re-check version here so module health is asserted
          # on the new build, not a stale container.
          #
          # NOTE: `curl` runs WITHOUT `-f` on purpose — a 503 is exactly the signal
          # we want, and `-f` would discard the JSON body that names the failing
          # table(s). A few retries absorb a transient DB blip; real schema drift is
          # deterministic and exhausts the loop → red.
          if [ -z "$APP_URL" ]; then
            echo "::error::vars.APP_URL not set in repo settings"
            exit 1
          fi
          EXPECTED_SHA=$(echo "$TARGET_SHA" | cut -c1-7)
          for i in $(seq 1 6); do
            response=$(curl -sSL --max-time 25 -A "$SMOKE_UA" "$APP_URL/api/health/deep" 2>/tmp/curl_err || echo '')
            if [ -n "$response" ]; then
              status=$(echo "$response" | jq -r '.status // "missing"')
              version=$(echo "$response" | jq -r '.version // "missing"')
              version_short=$(echo "$version" | cut -c1-7)
              if [ "$version_short" != "$EXPECTED_SHA" ]; then
                echo "Attempt $i: stale version (got $version_short, expected $EXPECTED_SHA), retrying in 15s..."
              elif [ "$status" = "healthy" ]; then
                echo "✅ Pass: all core modules healthy on $version_short"
                echo "$response" | jq -c '.checks'
                exit 0
              else
                # Unhealthy on the NEW build → a core module is down. Surface the
                # failing tables + exception classes so the cause is obvious in-log.
                echo "Attempt $i: status=$status on $version_short — core module(s) failing:"
                echo "$response" | jq -c '{checks: .checks, errors: .errors}'
                echo "retrying in 15s..."
              fi
            else
              echo "Attempt $i: no response — $(cat /tmp/curl_err 2>/dev/null | head -1), retrying in 15s..."
            fi
            sleep 15
          done
          echo "::error::Deep healthcheck failed after 6 attempts — a core module is 503-ing on the new build. See the {checks, errors} dump above; a likely cause is a migration column that never landed on prod — mirror it into backend/entrypoint.sh _COLUMN_STATEMENTS (see memory entrypoint-safetynet-new-columns)."
          exit 1
