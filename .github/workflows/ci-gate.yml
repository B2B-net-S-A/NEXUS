name: CI Gate

# Szybka bramka (~2 min) — wszystko, co MUSI być zielone, zanim kod trafi na prod.
#
# Dlaczego osobny workflow, a nie job w ci.yml:
# `workflow_run` reaguje na ukończenie CAŁEGO workflow, nie pojedynczego joba.
# Dopóki bramka deployu wisiała na "CI", deploy czekał na najwolniejszy job w tym
# pliku — pytest, 22 min. Zmierzone 2026-08-06 na commicie b4af6c58 (zmiana
# jednej stałej): CI na main 24 min 24 s, z czego 22 min 20 s to sam pytest;
# deploy dokładał 4 min. Efekt: ~28 min od merge'u do prod za każdą zmianę,
# z czego 22 min to POWTÓRZENIE testów, które przeszły już na PR — bo
# `strict: true` w branch protection gwarantuje, że gałąź była aktualna z main,
# więc squash testuje praktycznie ten sam kod drugi raz.
#
# Rozdzielenie na dwa workflow pozwala bramkować deploy na tym, co jest tanie
# i naprawdę chroni prod, zostawiając pytest jako pełny (i nadal wymagany na PR)
# sygnał jakości, który leci równolegle.
#
# Co jest TUTAJ i dlaczego akurat to:
#   * gitleaks       — sekret w obrazie jest nieodwracalny, musi blokować deploy
#   * ruff           — 1 s, brak powodu, żeby nie
#   * alembic        — migracja, która nie wchodzi, to najczęstszy tryb awarii
#                      tego repo (patrz entrypoint safety-net); łapiemy PRZED
#                      deployem, nie przez 503 w /health/deep po nim
#   * import smoke   — aplikacja, która się nie importuje, nie wstanie
#
# Czego tu NIE ma i dlaczego to bezpieczne:
#   * pełny build frontendu — Coolify i tak buduje oba obrazy ze źródeł, więc
#     zepsuty build = nieudany deployment = czerwony job "Deploy" = brak wdrożenia.
#
# UWAGA (#213, audyt 21.08.2026): powyższe uzasadnienie NIE pokrywało błędów
# TYPÓW. `frontend/Dockerfile` odpala samo `npm run build`, a next.config.ts każe
# temu buildowi ignorować TS i ESLint (`ignoreBuildErrors`, `ignoreDuringBuilds`)
# — świadomie, żeby rebuildy prod były szybkie. Efekt: bramka deployu nie miała
# ŻADNEJ kontroli frontendu, bo `frontend-lint-build` mieszka w "CI", który na
# main leci RÓWNOLEGLE z deployem, nie przed nim. Scenariusz z komentarza niżej
# („dwa PR-y zmergowane blisko siebie, osobno zielone, razem nie") kończył się
# wtedy wdrożeniem bundla, który rzuca wyjątkiem przy montowaniu. Stąd job
# `frontend-fast` — sam `tsc --noEmit`, bez builda i bez lintu, żeby zmieścić się
# w budżecie czasowym bramki.
#     Bramkowanie na nim byłoby duplikatem tej samej weryfikacji.
#   * pytest — przeszedł już na PR na tym samym kodzie (strict: true) i nadal
#     leci na main w "CI". Świadomy kompromis: prod może żyć ~6 min przed
#     zakończeniem pełnego pytestu na main. Realne ryzyko to semantyczny konflikt
#     dwóch PR-ów zmergowanych blisko siebie — czerwone "CI" na main jest wtedy
#     sygnałem do rollbacku (runbook §2).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # Bezpośrednia instalacja CLI zamiast ``gitleaks/gitleaks-action@v2``:
      # akcja zaczęła zwracać porażkę bez możliwych do pobrania logów (blob
      # logu 404-uje z Azure storage), więc debugowanie było niemożliwe.
      # Natywna instalacja + ``--no-git`` skanuje drzewo robocze, więc wynik
      # jest deterministyczny niezależnie od gier na base/HEAD ref PR-a.
      - name: Install gitleaks
        run: |
          # Suma kontrolna z `gitleaks_8.21.2_checksums.txt` z tego samego
          # release'u, zweryfikowana niezależnie przez policzenie sha256
          # pobranego archiwum. Bez tego bramka — która decyduje o wdrożeniu —
          # wykonywałaby binarkę pobraną bez żadnej weryfikacji.
          # Przy podbiciu wersji trzeba podmienić OBIE wartości naraz.
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree
        run: |
          gitleaks detect \
            --no-git \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

  frontend-fast:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      # React 19 + kilka pakietów jeszcze na RC — bez tej flagi npm odmawia
      # instalacji (ta sama flaga co w ci.yml i w Dockerfile).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      # Samo `tsc --noEmit`. Pełny `next build` i lint zostają w "CI" — tutaj
      # liczy się to, czego build produkcyjny NIE sprawdza, a nie powtórzenie go.
      - name: Type check
        run: npm run type-check

  backend-fast:
    name: Backend (lint + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-ci-password
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.15.22
      - name: Ruff lint
        run: ruff check app/
      # Osobna bramka od `ruff check` — sam lint NIE łapie fail-i formatowania
      # (ruff 0.15.22).
      - name: Ruff format check
        run: ruff format --check app/
      - name: Alembic legacy-row, retry, and contact-queue rollback probe
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
          CANDIDATE_IDENTITY_FINGERPRINT_KEY: ci-only-distinct-candidate-identity-key-at-least-48-chars
        run: |
          alembic -c alembic/alembic.ini upgrade 0195_candidate_document_kind
          python scripts/verify_b2b_signature_migration.py seed
          # Zatrzymanie na ostatniej odwracalnej rewizji dla sondy rollbacku.
          # 0208 celowo usuwa wycofane kryteria zapisanych wyszukiwań i odmawia
          # downgrade'u, bo tych wyborów użytkownika nie da się odtworzyć.
          alembic -c alembic/alembic.ini upgrade 0207_candidate_summary_security
          alembic -c alembic/alembic.ini upgrade 0207_candidate_summary_security
          python scripts/verify_b2b_signature_migration.py verify
          alembic -c alembic/alembic.ini downgrade 0199_candidate_stage_removals
          alembic -c alembic/alembic.ini upgrade 0201_candidate_contact_coordination
          alembic -c alembic/alembic.ini upgrade heads
          alembic -c alembic/alembic.ini upgrade heads
          alembic -c alembic/alembic.ini upgrade heads
      - name: Import smoke check
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexus-ci-password@localhost:5432/nexus_test
          SECRET_KEY: ci-only-not-for-production-use-at-least-48-chars-long
          CANDIDATE_IDENTITY_FINGERPRINT_KEY: ci-only-distinct-candidate-identity-key-at-least-48-chars
        run: python -c "from app.main import app; print('app importable:', app.title)"
