name: E2E (Playwright)

on:
  # Efemeryczny stack (QA-02, plan poprawy po audycie 14.09.2026) chodził do
  # 2026-09-20 na KAŻDYM PR-ze. Przeniesiony do kolejki merge'ów, bo rachunek
  # i statystyka mówiły to samo: 1 506 min billable przez 5 dni (16–20.09) za
  # 226 przebiegów, z których czerwone były 3. To nie jest wymagany check, więc
  # na PR-ze nie bramkował niczego — zawiadamiał. W kolejce też tylko zawiadamia:
  # kolejka nie czeka na ten workflow, a czerwona grupa i tak wchodzi na main.
  # Czerwony bieg dociera do PR-a przez `queue-failure-feedback.yml`.
  #
  # `pull_request` wraca tu w dniu, w którym „E2E stack (ci-chromium)" trafi do
  # rulesetu jako wymagany kontekst — wtedy sygnał na PR-ze zaczyna mieć skutek.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      k6_profile:
        description: 'smoke: 3 VU / 20s; load: ramp 10/25/50/100 VU on the disposable CI stack'
        type: choice
        options: [smoke, load]
        default: smoke
  schedule:
    - cron: "17 3 * * *"  # nightly at 03:17 UTC
  # MON-02 (audyt 14.09.2026): po każdym udanym deployu biegnie projekt
  # `prod-smoke` (odczyty po zalogowaniu, bez `@stack`/`@writes`) na wdrożonej
  # wersji. Nie blokuje deployu — to osobny workflow; czerwień zakłada issue.
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  # Nocny bieg, od którego NIC nie zależy (nie jest required checkiem), nie
  # woła nikogo z siebie — czerwień przez 21 nocy z rzędu nie doczekała się
  # żadnej reakcji, bo nie było gdzie jej zobaczyć. Alert-issue to ten sam
  # wzorzec co w disk-alert.yml: cichy kanał zamieniony w pingnięcie.
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  # Nic już nie biegnie na `pull_request`, więc nie ma rewizji PR-a, którą
  # kolejny push unieważnia. Bieg z kolejki merge'ów i bieg po deployu muszą
  # dobiec do końca — anulowanie zostawiłoby grupę bez werdyktu.
  cancel-in-progress: false

jobs:
  stack:
    # Scenariusze `@stack` na świeżym stacku z docker-compose.e2e.yml: te same
    # Dockerfile'e i ten sam entrypoint co produkcja, pusta baza, konta ról
    # z backend/scripts/seed_e2e.py. Tu wolno zapisywać dane — stack znika po
    # biegu. Każdy przypadek ma się WYKONAĆ: pominięty test to czerwony bieg.
    name: E2E stack (ci-chromium)
    # OPS-N02 (audyt 22.09.2026): NIE po deployu. Stack buduje się ze źródeł
    # commitu, nie z produkcji, więc bieg po Deploy (także pominiętym) testował
    # drzewo sprawdzone już w kolejce merge'ów — 757 min w 2 dni bez sygnału.
    # Produkcję po deployu sprawdza job `playwright` (`prod-smoke`).
    # Warunek na POZIOMIE joba jest tu dozwolony: `workflow_run` nie należy do
    # żadnego PR-a ani grupy kolejki, więc nie zgłasza wymaganego kontekstu.
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:8000
      E2E_USER_EMAIL: e2e-admin@example.com
      E2E_REQUIRE_AUTH: "1"
      # `github.sha` na `merge_group` to scalone drzewo grupy — dokładnie to,
      # co zaraz wyląduje na mainie, i dokładnie to, co stawia ten stack.
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Jednorazowe hasło kont E2E
        # Generowane per bieg i maskowane — nie jest sekretem repozytorium,
        # bo stack i jego baza istnieją wyłącznie w tym jobie.
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "E2E_USER_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Zbuduj i uruchom stack
        working-directory: .
        run: docker compose -f docker-compose.e2e.yml up -d --build
      - name: Czekaj na backend i frontend
        working-directory: .
        run: |
          deadline=$(( $(date +%s) + 900 ))
          until curl -fsS http://localhost:8000/api/health/live >/dev/null 2>&1 \
             && curl -fsS -o /dev/null http://localhost:3000/login; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Stack E2E nie wstał w 15 minut."
              docker compose -f docker-compose.e2e.yml ps
              docker compose -f docker-compose.e2e.yml logs --tail 200 backend frontend
              exit 1
            fi
            sleep 5
          done
          echo "Stack gotowy."
      - name: Zasiej konta ról
        id: seed-roles
        working-directory: .
        run: |
          docker compose -f docker-compose.e2e.yml exec -T \
            -e E2E_SEED_CONFIRM=nexus-e2e -e E2E_SEED_PASSWORD="$E2E_USER_PASSWORD" \
            backend python scripts/seed_e2e.py
      - name: Zasiej zespół HR („Ludzie w NEXUSIE”)
        # Fikcyjny zespół z kartotekami, przełożoną i pulami urlopowymi oraz
        # włączone moduły HR (`app_settings['hr_modules']`) — tylko na tym
        # stacku. To samo jednorazowe hasło co konta ról; na te konta loguje
        # się `e2e/flow-hr-leave.spec.ts`.
        working-directory: .
        run: |
          docker compose -f docker-compose.e2e.yml exec -T \
            -e HR_DEMO_SEED_CONFIRM=nexus-hr-demo -e HR_DEMO_SEED_PASSWORD="$E2E_USER_PASSWORD" \
            backend python scripts/seed_hr_demo.py
      - name: Playwright — scenariusze @stack
        run: |
          set -o pipefail
          npx playwright test --project=ci-chromium --reporter=list,json \
            | tee playwright-output.txt
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
      # 27.10.2026 #2692 i #2732 zepsuły testy harnessów, kolejka była zielona,
      # a nocny bieg czerwony przez 5 nocy (#2745). Dlatego harnessy biegną też
      # w kolejce, ale tylko gdy grupa dotyka frontendu: 259 z 361 grup z 26.10–
      # 02.11, ok. 5,4 min na grupę. Harnessy to sam frontend, więc zmiana bez
      # `frontend/` nie ma ich jak zepsuć. `base_sha` to HEAD poprzedniego wpisu
      # kolejki, więc porównanie widzi zmianę tego wpisu, nie całej grupy.
      # Niepewna lista plików = bieg, tak jak E2E wtyczki w `ci.yml`.
      - name: Czy grupa dotyka frontendu?
        id: preview-scope
        if: ${{ github.event_name == 'merge_group' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -eu
          files=$(gh api "/repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" \
            --jq 'if (.files | length) >= 300 then "LIMIT" else .files[].filename end') || files=""
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qx LIMIT; then
            echo "::warning::Niepewna lista plików grupy — harnessy biegną."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if hit=$(printf '%s\n' "$files" | grep -E '^frontend/|^docker-compose\.e2e\.yml$|^\.github/workflows/e2e\.yml$' | head -1) && [ -n "$hit" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Harnessy: zmieniony $hit"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Grupa nie dotyka frontendu — harnessy pominięte."
          fi
      - name: Playwright — harnessy /preview/* (preview-chromium)
        # Runda 10 (R10-N10-1): na produkcji harnessy wymagają logowania, więc
        # publiczny projekt `preview-chromium` chodzi tu — na stacku zbudowanym
        # z `NEXT_PUBLIC_PREVIEW_PUBLIC=1`, ze źródeł tego samego commitu.
        # Nocą, ręcznie i w kolejce przy zmianie frontendu (krok wyżej).
        if: ${{ github.event_name != 'merge_group' || steps.preview-scope.outputs.run == 'true' }}
        run: |
          set -o pipefail
          npx playwright test --project=preview-chromium --reporter=list \
            | tee playwright-preview-output.txt
      - name: Podsumowanie i kontrola pominięć
        if: ${{ !cancelled() }}
        run: |
          set -eu
          if [ ! -s playwright-results.json ]; then
            echo "::error::Brak wyników Playwrighta — scenariusze nie wystartowały."
            exit 1
          fi
          node -e '
            const r = require("./playwright-results.json").stats;
            const rows = [["zaliczone", r.expected], ["niezaliczone", r.unexpected],
                          ["niestabilne (przeszły po ponowieniu)", r.flaky], ["pominięte", r.skipped]];
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "### E2E stack (ci-chromium)\n\n| | liczba |\n|---|---|\n" +
              rows.map(([k, v]) => `| ${k} | ${v} |`).join("\n") + "\n");
            if (r.skipped > 0) {
              console.log(`::error::${r.skipped} przypadków pominiętych — na stacku każdy scenariusz ma się wykonać.`);
              process.exit(1);
            }
            if (r.flaky > 0) console.log(`::warning::${r.flaky} przypadków niestabilnych — przeszły dopiero po ponowieniu.`);
          '
      # Reuse this job's disposable stack. Never target the production job below.
      - name: Python for HTTP contract tests
        if: ${{ !cancelled() && steps.seed-roles.outcome == 'success' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned QA tools
        id: qa-tools
        if: ${{ !cancelled() && steps.seed-roles.outcome == 'success' }}
        working-directory: .
        run: |
          python -m venv .qa/venv
          .qa/venv/bin/pip install -r qa/requirements.txt
          .qa/venv/bin/python -m pytest qa/tests -q
          mkdir -p .qa/bin qa/reports
          curl -fsSL --retry 3 https://github.com/grafana/k6/releases/download/v2.2.0/k6-v2.2.0-linux-amd64.tar.gz -o .qa/k6.tar.gz
          echo 'b5a8003c86f35f5cd5ceef1490312c48e587696c94d998cefc6d7b3b4cb1597d  .qa/k6.tar.gz' | sha256sum -c -
          tar -xzf .qa/k6.tar.gz --strip-components=1 -C .qa/bin
          .qa/bin/k6 version
      - name: Prepare QA data and export the running application's OpenAPI
        id: qa-seed
        if: ${{ !cancelled() && steps.qa-tools.outcome == 'success' }}
        working-directory: .
        env:
          QA_CONFIRM: nexus-e2e
        run: |
          .qa/venv/bin/python qa/prepare.py
          # OpenAPI is disabled publicly outside DEBUG. Export it inside the
          # tested container instead of exposing a new endpoint in production.
          docker compose -f docker-compose.e2e.yml exec -T backend python -c 'import json; from pathlib import Path; from app.main import app; Path("/tmp/qa-openapi.json").write_text(json.dumps(app.openapi()))'
          docker compose -f docker-compose.e2e.yml exec -T backend cat /tmp/qa-openapi.json > .qa/openapi.json
      - name: Schemathesis — five GET contracts and invalid pagination
        if: ${{ !cancelled() && steps.qa-seed.outcome == 'success' }}
        working-directory: .
        env:
          QA_CONFIRM: nexus-e2e
        run: .qa/venv/bin/pytest qa/api -q --junitxml=qa/reports/schemathesis.xml
      - name: k6 — recruitment, operations and reporting
        if: ${{ !cancelled() && steps.qa-seed.outcome == 'success' }}
        working-directory: .
        env:
          QA_CONFIRM: nexus-e2e
          K6_PROFILE: ${{ inputs.k6_profile || 'smoke' }}
        run: .qa/bin/k6 run qa/load/workflows.js
      - name: Summarize QA results
        if: ${{ !cancelled() && steps.qa-tools.outcome == 'success' }}
        working-directory: .
        run: .qa/venv/bin/python qa/summarize.py
      - name: Publish QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-qa-toolkit
          # Never upload .qa/: it contains session tokens and private fixtures.
          path: qa/reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Logi stacku przy porażce
        if: failure()
        working-directory: .
        run: docker compose -f docker-compose.e2e.yml logs --tail 400 backend frontend > frontend/stack-logs.txt 2>&1 || true
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-stack-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/stack-logs.txt
          retention-days: 7
      - name: Zatrzymaj stack
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.e2e.yml down -v || true
      # OPS-N08: zielony nocny bieg zamyka alarm, który otworzył czerwony.
      - name: Zamknij alarm nocnego stacku
        if: ${{ success() && github.event_name == 'schedule' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/alert_issue.sh resolve "Nocny E2E na stacku testowym jest czerwony" "Nocny bieg scenariuszy @stack przeszedł."

  e2e-account:
    # Pusty bieg nie może wyglądać jak sukces: do 04.11.2026 job `playwright` bez
    # sekretów kończył się na zielono przy 0 z 25 przypadków. Warunku na sekret
    # nie da się postawić na jobie (`secrets` nie ma w `if` joba), stąd ten krok:
    # bez konta `playwright` jest `skipped`, czyli szary, a nie zielony.
    # Tylko odczyty na produkcji: projekt `prod-smoke` wyklucza `@stack` i `@writes`.
    # Po deployu (MON-02) tylko przy włączniku repo. Bez konta E2E każdy udany
    # deploy dawałby czerwony bieg i komentarz w issue, zanim konto w ogóle
    # powstanie. Włącz: `gh variable set E2E_POST_DEPLOY_ENABLED --body true`.
    # Projekt `prod-smoke` bije w PRODUKCJĘ, więc nie ma go w biegu weryfikującym
    # kod przed merge'em (dawniej `pull_request`, od 2026-09-20 `merge_group`).
    # Ręcznie tylko z maina (jak OPS-N05): hasło konta E2E nie idzie do kodu z gałęzi.
    name: Konto E2E na produkcji
    if: ${{ github.event_name != 'merge_group' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && vars.E2E_POST_DEPLOY_ENABLED == 'true')) }}
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Czy są sekrety konta?
        id: check
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          if [ -n "$E2E_USER_EMAIL" ] && [ -n "$E2E_USER_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            # Włącznik włączony, a sekretów brak: to awaria, nie brak testu. Job
            # `playwright` idzie dalej, kończy się na czerwono i otwiera alarm.
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### E2E produkcja — NIE uruchomiono"
              echo ""
              echo "Brak sekretów \`E2E_USER_EMAIL\`/\`E2E_USER_PASSWORD\`, więc job"
              echo "\`Playwright against production\` jest pominięty: to brak testu, nie sukces."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::E2E produkcja NIE uruchomione — brak E2E_USER_EMAIL/E2E_USER_PASSWORD."
          fi

  playwright:
    name: Playwright against production
    needs: e2e-account
    if: ${{ needs.e2e-account.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    # Współbieżność na JOBIE, nie na workflow: pominięty bieg (deploy odroczony,
    # anulowany) nie może anulować trwającego smoke po ostatnim prawdziwym deployu.
    concurrency:
      group: e2e-${{ github.event_name }}
      cancel-in-progress: ${{ github.event_name == 'workflow_run' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run tests
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://nexus.b2bnetwork.pl' }}
          E2E_API_URL: ${{ secrets.E2E_API_URL || 'https://api.nexus.b2bnetwork.pl' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        # Harnessy `/preview/*` (`preview-chromium`) chodzą w jobie `stack`: na
        # produkcji wymagają logowania od rundy 10 audytu (R10-N10-1). Przepływy
        # zapisujące dane też są sprawdzane w jobie `stack`, nie na produkcji.
        run: |
          # Runda 7 (R7-X2-8): bieg idzie przeciw PRODUKCJI, a log Actions
          # publicznego repo widzi każdy. Reporter `list`/`dot`/`line` przy
          # porażce asercji drukuje „Received …”, czyli tekst ze strony
          # produkcyjnej. Tu reporter JSON trafia do pliku, a do logu idą
          # liczby i TYTUŁY nieudanych testów (tytuły pochodzą z naszych spec-ów),
          # bez treści błędu.
          run_pw() {
            local rc=0 summary executed
            PLAYWRIGHT_JSON_OUTPUT_NAME="${RUNNER_TEMP}/pw-results.json" \
              npx playwright test "$@" --reporter=json > /dev/null 2>&1 || rc=$?
            summary=$(node -e '
              const fs = require("fs");
              const path = process.argv[1];
              if (!fs.existsSync(path)) { console.log("brak wyników Playwrighta"); process.exit(0); }
              const r = JSON.parse(fs.readFileSync(path, "utf8"));
              const failed = [];
              let executed = 0;
              const walk = (suite, trail) => {
                for (const spec of suite.specs || []) {
                  for (const t of spec.tests || []) {
                    if (t.projectName === "prod-smoke" && t.status !== "skipped") executed += 1;
                    if (t.status === "unexpected" || t.status === "flaky") {
                      failed.push(`${t.status}: [${t.projectName}] ${[...trail, spec.title].join(" › ")}`);
                    }
                  }
                }
                for (const child of suite.suites || []) walk(child, [...trail, child.title]);
              };
              for (const suite of r.suites || []) walk(suite, [suite.title]);
              const s = r.stats || {};
              console.log(`Playwright: ok=${s.expected ?? 0} fail=${s.unexpected ?? 0} flaky=${s.flaky ?? 0} skipped=${s.skipped ?? 0}`);
              for (const line of failed) console.log(line);
              console.log(`Wykonane przypadki prod-smoke: ${executed}`);
            ' "${RUNNER_TEMP}/pw-results.json")
            echo "$summary"
            executed=$(sed -n 's/^Wykonane przypadki prod-smoke: //p' <<< "$summary")
            echo "| przypadki wykonane | ${executed:-0} |" >> "$GITHUB_STEP_SUMMARY"
            # Pominięty setup pomija wszystko i Playwright kończy się kodem 0.
            if [ "${executed:-0}" -eq 0 ]; then
              echo "::error::prod-smoke nie wykonał ani jednego przypadku — to nie jest sukces."
              [ "$rc" -ne 0 ] || rc=1
            fi
            return "$rc"
          }

          # Liczby bierzemy z narzędzia, które te testy URUCHAMIA, a nie z grepa
          # po źródle (pętle w spec-ach rozwijają się na wiele przypadków).
          count_tests() {
            npx playwright test --list "$@" 2>/dev/null \
              | sed -n 's/^Total: \([0-9]*\) tests* in \([0-9]*\) files*$/\1 \2/p' \
              | tail -1
          }
          read -r total_cases total_specs <<< "$(count_tests --project=prod-smoke)"
          be_sha=$(curl -fsS --max-time 15 "${E2E_API_URL%/}/api/health" 2>/dev/null | jq -r '.version // "brak"' || echo brak)
          fe_sha=$(curl -fsSL --max-time 15 "${E2E_BASE_URL%/}/version.json" 2>/dev/null | jq -r '.sha // "brak"' || echo brak)
          {
            echo "### E2E produkcja — \`prod-smoke\` ($GITHUB_EVENT_NAME)"
            echo ""
            echo "| | wartość |"
            echo "|---|---|"
            echo "| backend \`/api/health\` | \`${be_sha:0:7}\` |"
            echo "| frontend \`version.json\` | \`${fe_sha:0:7}\` |"
            echo "| przypadki wylistowane | ${total_cases:-0} (pliki: ${total_specs:-0}) |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Tu dociera tylko bieg po deployu: inne zdarzenia zatrzymuje `e2e-account`.
          if [ -z "$E2E_USER_EMAIL" ] || [ -z "$E2E_USER_PASSWORD" ]; then
            echo "::error::Brak sekretów E2E_USER_EMAIL/E2E_USER_PASSWORD — smoke po deployu nie może sprawdzić przepływów po zalogowaniu."
            exit 1
          fi
          run_pw --project=prod-smoke

      # Raportu Playwrighta z tego joba NIE wgrywamy (runda 6 audytu): bieg idzie
      # przeciw produkcji, a trace/wideo niosą token konta E2E i odpowiedzi API
      # z danymi z bazy — artefakt publicznego repo pobierze każdy. Przyczynę
      # porażki pokazuje log kroku „Run tests” (liczby i tytuły testów, runda 7); pełny raport
      # daje job `stack` na pustej bazie CI.

      # OPS-N08: marker musi być DOKŁADNIE ten sam co w kroku otwierającym niżej.
      - name: Close alert issue after a green run
        if: ${{ success() && (github.event_name == 'schedule' || github.event_name == 'workflow_run') }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="Nocny E2E przeciw produkcji jest czerwony"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            marker="E2E po deployu (prod-smoke) jest czerwony"
          fi
          bash .github/scripts/alert_issue.sh resolve "$marker" "Bieg przeciw produkcji przeszedł."

      - name: Open or refresh alert issue
        if: ${{ failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_run') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          marker="Nocny E2E przeciw produkcji jest czerwony"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            marker="E2E po deployu (prod-smoke) jest czerwony"
          fi
          existing=$(gh issue list --repo "$REPO" --state open \
            --search "$marker in:title" --json number --jq '.[0].number // empty' || echo "")
          body=$(printf '%s\n' \
            "Bieg \`e2e.yml\` (Playwright przeciw https://nexus.b2bnetwork.pl) nie przeszedł." \
            "" \
            "Log: ${RUN_URL}" \
            "" \
            "To jedyny automatyczny test dotykający produkcji. Trwale czerwony bieg jest" \
            "GORSZY niż brak biegu: prawdziwa regresja daje dokładnie ten sam czerwony X" \
            "co przeterminowana asercja i nie da się ich od siebie odróżnić." \
            "" \
            "Zamknij to zgłoszenie dopiero, gdy bieg jest zielony." \
            "" \
            "_Wygenerowane przez .github/workflows/e2e.yml._")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "⚠️ ${marker}" --body "$body"
          fi

  stack-alert:
    # Nocny bieg stacku też woła o uwagę — ten sam wzorzec co bieg produkcyjny.
    name: Alert nocnego stacku
    needs: stack
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or refresh alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          marker="Nocny E2E na stacku testowym jest czerwony"
          existing=$(gh issue list --repo "$REPO" --state open \
            --search "$marker in:title" --json number --jq '.[0].number // empty' || echo "")
          body="Nocny bieg scenariuszy @stack (docker-compose.e2e.yml) nie przeszedł. Log: ${RUN_URL}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "⚠️ ${marker}" --body "$body"
          fi
