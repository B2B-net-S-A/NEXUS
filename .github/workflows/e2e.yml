name: E2E (Playwright)

on:
  # Only run on demand + nightly — not blocking PR-level CI
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"  # nightly at 03:17 UTC

permissions:
  contents: read
  # Nocny bieg, od którego NIC nie zależy (nie jest required checkiem), nie
  # woła nikogo z siebie — czerwień przez 21 nocy z rzędu nie doczekała się
  # żadnej reakcji, bo nie było gdzie jej zobaczyć. Alert-issue to ten sam
  # wzorzec co w disk-alert.yml: cichy kanał zamieniony w pingnięcie.
  issues: write

jobs:
  playwright:
    name: Playwright against production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run tests
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://nexus.dynaminds.pl' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        # 2026-07-16 (analytics plan PR 0): without E2E_USER_PASSWORD the auth
        # setup project SKIPS, e2e/.auth/state.json is never written, and every
        # `chromium` spec dies on ENOENT loading storageState — nightly has been
        # red on that for weeks. Until the E2E_USER_* secrets are provisioned
        # (operator action — needs a dedicated prod E2E account), run only the
        # public `preview-chromium` project so nightly stays green and honest.
        run: |
          if [ -z "$E2E_USER_PASSWORD" ]; then
            echo "::warning::E2E_USER_PASSWORD secret not set — running only public (preview) specs. Provision E2E_USER_EMAIL/E2E_USER_PASSWORD repo secrets to enable the authenticated suite."
            npx playwright test --project=preview-chromium
          else
            npm run test:e2e
          fi
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Open or refresh alert issue
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          marker="Nocny E2E przeciw produkcji jest czerwony"
          existing=$(gh issue list --repo "$REPO" --state open \
            --search "$marker in:title" --json number --jq '.[0].number // empty' || echo "")
          body=$(printf '%s\n' \
            "Nocny bieg \`e2e.yml\` (Playwright przeciw https://nexus.dynaminds.pl) nie przeszedł." \
            "" \
            "Log: ${RUN_URL}" \
            "" \
            "To jedyny automatyczny test dotykający produkcji. Trwale czerwony bieg jest" \
            "GORSZY niż brak biegu: prawdziwa regresja daje dokładnie ten sam czerwony X" \
            "co przeterminowana asercja i nie da się ich od siebie odróżnić." \
            "" \
            "Zamknij to zgłoszenie dopiero, gdy bieg jest zielony." \
            "" \
            "_Wygenerowane przez .github/workflows/e2e.yml._")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "⚠️ ${marker}" --body "$body"
          fi
