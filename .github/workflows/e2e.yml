name: E2E (Playwright)

on:
  # Only run on demand + nightly — not blocking PR-level CI
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"  # nightly at 03:17 UTC

permissions:
  contents: read
  # Nocny bieg, od którego NIC nie zależy (nie jest required checkiem), nie
  # woła nikogo z siebie — czerwień przez 21 nocy z rzędu nie doczekała się
  # żadnej reakcji, bo nie było gdzie jej zobaczyć. Alert-issue to ten sam
  # wzorzec co w disk-alert.yml: cichy kanał zamieniony w pingnięcie.
  issues: write

jobs:
  playwright:
    name: Playwright against production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run tests
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://nexus.dynaminds.pl' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        # 2026-07-16 (analytics plan PR 0): without E2E_USER_PASSWORD the auth
        # setup project SKIPS, e2e/.auth/state.json is never written, and every
        # `chromium` spec dies on ENOENT loading storageState. Do czasu
        # sprovisionowania E2E_USER_* (działanie operatorskie — potrzebne
        # dedykowane prodowe konto E2E) chodzi wyłącznie publiczny projekt
        # `preview-chromium`.
        #
        # WAŻNE: zielony bieg w tym trybie NIE znaczy „E2E przechodzi". Chodzi
        # 1 z 12 plików spec. Pierwotny komentarz twierdził, że zawężenie
        # zakresu utrzymuje nocny bieg „green and honest" — zielony przy
        # kilkunastu procentach pokrycia nie jest uczciwy, tylko cichy, i jest
        # dokładnie tą samą klasą co awaria udająca pustkę: sygnał, który
        # wygląda na potwierdzenie, a niczego nie potwierdza. Dlatego bieg
        # WYPISUJE swoje własne pokrycie do podsumowania zadania — żeby
        # „zielone" dało się przeczytać razem z „ile z czego".
        run: |
          # Liczby bierzemy z narzędzia, które te testy URUCHAMIA, a nie z grepa
          # po źródle. Pierwsza wersja tego kroku liczyła LINIE `test(` i przez to
          # kłamała w trzech miejscach naraz: pętle w spec-ach rozwijają się na
          # wiele przypadków (6 linii -> 13 testów), `test.fixme(` w ogóle nie
          # miało linii z `test(`, a `auth.setup.ts` nie jest `*.spec.ts`. Raport
          # pokazywał 6/46 tam, gdzie Playwright widzi 13/81 — czyli podsumowanie
          # zbudowane po to, by „zielone" dało się przeczytać razem z „ile z
          # czego", samo podawało złe „ile z czego".
          count_tests() {
            npx playwright test --list "$@" 2>/dev/null \
              | sed -n 's/^Total: \([0-9]*\) tests* in \([0-9]*\) files*$/\1 \2/p' \
              | tail -1
          }
          read -r total_cases total_specs <<< "$(count_tests)"
          total_cases="${total_cases:-0}"; total_specs="${total_specs:-0}"

          if [ -z "$E2E_USER_PASSWORD" ]; then
            read -r ran_cases ran_specs <<< "$(count_tests --project=preview-chromium)"
            ran_cases="${ran_cases:-0}"; ran_specs="${ran_specs:-0}"
            {
              echo "### E2E — bieg CZĘŚCIOWY"
              echo ""
              echo "| | wykonane | wszystkie |"
              echo "|---|---|---|"
              echo "| pliki spec | $ran_specs | $total_specs |"
              echo "| przypadki | $ran_cases | $total_cases |"
              echo ""
              echo "Brak sekretów \`E2E_USER_EMAIL\`/\`E2E_USER_PASSWORD\`, więc projekt"
              echo "\`chromium\` (wszystkie przepływy po zalogowaniu) NIE został uruchomiony."
              echo "**Zielony wynik tego biegu nie znaczy, że E2E przechodzi.**"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::E2E CZĘŚCIOWE — $ran_cases z $total_cases przypadków ($ran_specs z $total_specs plików). Brak E2E_USER_EMAIL/E2E_USER_PASSWORD, więc przepływy po zalogowaniu nie są weryfikowane. Zielony wynik NIE znaczy, że E2E przechodzi."
            npx playwright test --project=preview-chromium
          else
            # Tu też TABELA, nie zapewnienie. Poprzednia wersja pisała
            # „Uruchomiono wszystkie N przypadków" — nieprawda niezależnie od
            # licznika, bo `test.fixme(` Playwright LISTUJE, ale nie wykonuje
            # (dziś 27 sztuk w flow-stubs-todo.spec.ts). Zapewnienie o
            # kompletności znikało dokładnie wtedy, gdy zaczynało być
            # weryfikowalne — czyli po dodaniu sekretów.
            parked=$(grep -rch "^[[:space:]]*test\.fixme(" e2e/*.spec.ts 2>/dev/null | awk "{s+=\$1} END {print s+0}")
            {
              echo "### E2E — bieg PEŁNY"
              echo ""
              echo "| | liczba |"
              echo "|---|---|"
              echo "| przypadki wylistowane | $total_cases |"
              echo "| w tym zaparkowane (\`test.fixme\`) | $parked |"
              echo "| pliki spec | $total_specs |"
              echo ""
              echo "Zaparkowane przypadki są listowane, ale NIE wykonywane."
            } >> "$GITHUB_STEP_SUMMARY"
            npm run test:e2e
          fi

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Open or refresh alert issue
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          marker="Nocny E2E przeciw produkcji jest czerwony"
          existing=$(gh issue list --repo "$REPO" --state open \
            --search "$marker in:title" --json number --jq '.[0].number // empty' || echo "")
          body=$(printf '%s\n' \
            "Nocny bieg \`e2e.yml\` (Playwright przeciw https://nexus.dynaminds.pl) nie przeszedł." \
            "" \
            "Log: ${RUN_URL}" \
            "" \
            "To jedyny automatyczny test dotykający produkcji. Trwale czerwony bieg jest" \
            "GORSZY niż brak biegu: prawdziwa regresja daje dokładnie ten sam czerwony X" \
            "co przeterminowana asercja i nie da się ich od siebie odróżnić." \
            "" \
            "Zamknij to zgłoszenie dopiero, gdy bieg jest zielony." \
            "" \
            "_Wygenerowane przez .github/workflows/e2e.yml._")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "⚠️ ${marker}" --body "$body"
          fi
