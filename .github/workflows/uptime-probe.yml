name: Uptime probe

on:
  schedule:
    # Co godzinę. (Komentarz mówił wcześniej "every 10 minutes", ale cron zawsze był
    # godzinowy — świadomy kompromis kosztowy, bo GHA zaokrągla każdy run do pełnej minuty.)
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Check nexus.dynaminds.pl health
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Frontend
        id: frontend
        run: |
          set -euo pipefail
          # `-L` jest tu load-bearing: `/` zwraca 307 -> `/login` dla niezalogowanych
          # (middleware deny-by-default). Bez śledzenia przekierowań probe widział 307,
          # uznawał to za awarię i failował co godzinę od 2026-07-19 09:36 — 24 fałszywe
          # alarmy pod rząd, przez które prawdziwa awaria nie byłaby odróżnialna od szumu.
          # Sprawdzamy kod PO przekierowaniach; %{url_effective} zostaje w logu na dowód.
          # `\n` w -w jest konieczny: bez niego `read` kończy na EOF ze statusem 1,
          # co przy `set -e` ubija krok mimo poprawnej odpowiedzi.
          read -r code final_url < <(curl -sSL -o /dev/null \
            -w '%{http_code} %{url_effective}\n' --max-time 15 https://nexus.dynaminds.pl/)
          echo "frontend_code=$code" >> "$GITHUB_OUTPUT"
          echo "Frontend: HTTP $code (po przekierowaniach: $final_url)"
          if [ "$code" -ne 200 ]; then
            echo "::error::Frontend returned $code (final URL: $final_url)"
            exit 1
          fi
      - name: Backend health
        id: backend
        run: |
          set -euo pipefail
          # Primary: /api/health (standard shape per deployment.md).
          # Fallback: /health (legacy alias, do usunięcia po 7 dniach od merge).
          body=$(curl -sS --max-time 15 https://api.nexus.dynaminds.pl/api/health)
          echo "body=$body"
          echo "$body" | jq -e '.status != "unhealthy"' > /dev/null
      - name: TLS expiry check
        run: |
          set -euo pipefail
          for host in nexus.dynaminds.pl api.nexus.dynaminds.pl; do
            expiry=$(echo | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null \
              | openssl x509 -noout -enddate | cut -d= -f2)
            echo "$host expires: $expiry"
            expiry_epoch=$(date -d "$expiry" +%s)
            now_epoch=$(date +%s)
            days_left=$(( (expiry_epoch - now_epoch) / 86400 ))
            echo "$host has $days_left days left"
            if [ "$days_left" -lt 14 ]; then
              echo "::warning::$host TLS expires in $days_left days"
            fi
          done
