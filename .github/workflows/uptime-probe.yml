name: Uptime probe

on:
  schedule:
    # Co godzinę. (Komentarz mówił wcześniej "every 10 minutes", ale cron zawsze był
    # godzinowy — świadomy kompromis kosztowy, bo GHA zaokrągla każdy run do pełnej minuty.)
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Check nexus.dynaminds.pl health
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Frontend
        id: frontend
        run: |
          set -euo pipefail
          # `-L` jest tu load-bearing: `/` zwraca 307 -> `/login` dla niezalogowanych
          # (middleware deny-by-default). Bez śledzenia przekierowań probe widział 307,
          # uznawał to za awarię i failował co godzinę od 2026-07-19 09:36 — 24 fałszywe
          # alarmy pod rząd, przez które prawdziwa awaria nie byłaby odróżnialna od szumu.
          # Sprawdzamy kod PO przekierowaniach; %{url_effective} zostaje w logu na dowód.
          # `\n` w -w jest konieczny: bez niego `read` kończy na EOF ze statusem 1,
          # co przy `set -e` ubija krok mimo poprawnej odpowiedzi.
          read -r code final_url < <(curl -sSL -o /dev/null \
            -w '%{http_code} %{url_effective}\n' --max-time 15 https://nexus.dynaminds.pl/)
          echo "frontend_code=$code" >> "$GITHUB_OUTPUT"
          echo "Frontend: HTTP $code (po przekierowaniach: $final_url)"
          if [ "$code" -ne 200 ]; then
            echo "::error::Frontend returned $code (final URL: $final_url)"
            exit 1
          fi
      - name: Backend health
        id: backend
        run: |
          set -euo pipefail
          # Primary: /api/health (standard shape per deployment.md).
          # Fallback: /health (legacy alias, do usunięcia po 7 dniach od merge).
          body=$(curl -sS --max-time 15 https://api.nexus.dynaminds.pl/api/health)
          echo "body=$body"
          echo "$body" | jq -e '.status != "unhealthy"' > /dev/null
      - name: TLS expiry check
        run: |
          set -euo pipefail
          for host in nexus.dynaminds.pl api.nexus.dynaminds.pl; do
            expiry=$(echo | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null \
              | openssl x509 -noout -enddate | cut -d= -f2)
            echo "$host expires: $expiry"
            expiry_epoch=$(date -d "$expiry" +%s)
            now_epoch=$(date +%s)
            days_left=$(( (expiry_epoch - now_epoch) / 86400 ))
            echo "$host has $days_left days left"
            if [ "$days_left" -lt 14 ]; then
              echo "::warning::$host TLS expires in $days_left days"
            fi
          done

  # ── Backup freshness ────────────────────────────────────────────────────────
  # Consumer for `LATEST.json`, the manifest backup/backup.sh writes after every
  # run. Until now that object had NO reader anywhere in the repository: the
  # script wrote it, nothing ever looked, so "the backup stopped running" had no
  # symptom at all — exactly how the host's off-site script spent weeks exiting 0
  # without copying a byte.
  #
  # Why here and not as `checks.backup` in /api/health (the other candidate):
  #
  #   1. It would not alarm. uptime-probe accepts anything except "unhealthy",
  #      and a stale backup must NOT be "unhealthy" — that status gates HTTP 503,
  #      which restarts containers and fails deploys. A backup problem would
  #      resolve to "degraded" and be tolerated forever, i.e. another silent
  #      green.
  #   2. It would need the backend — the internet-facing service — to hold read
  #      credentials for the backup bucket, widening what a compromise reaches
  #      from "production data" to "production data plus its backups".
  #   3. It would go down with the host. The scenario this monitors is losing
  #      the VPS; an in-process check cannot report on the disaster it exists to
  #      warn about. Here it runs on GitHub's infrastructure, from separate
  #      credentials, on a schedule the VPS cannot influence.
  backup-freshness:
    name: Backup manifest is fresh and clean
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Off until the owner provisions the bucket credentials and flips this
    # variable. Deliberately a skipped job rather than a passing one: this
    # workflow claims the app is up, and never claims anything about backups it
    # did not actually read.
    if: vars.BACKUP_MONITORING_ENABLED == 'true'
    env:
      BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX || 'nexus' }}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${{ vars.BACKUP_S3_PROVIDER || 'Other' }}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
      RCLONE_CONFIG_OFFSITE_REGION: ${{ vars.BACKUP_S3_REGION }}
      RCLONE_S3_NO_CHECK_BUCKET: "true"
      # Daily run at 02:00 UTC, plus room for a long CV sync and the retry
      # ladder in loop.sh before this is treated as "the backups have stopped".
      MAX_AGE_HOURS: ${{ vars.BACKUP_MAX_AGE_HOURS || '30' }}
      # Obecność, nie wartość — do porównania „czy w ogóle jest".
      HAS_S3_ACCESS: ${{ secrets.BACKUP_S3_ACCESS_KEY != '' }}
      HAS_S3_SECRET: ${{ secrets.BACKUP_S3_SECRET_KEY != '' }}
    steps:
      # Bramka włączona, a poświadczeń brak — to jedyna kombinacja, w której ten
      # job nie ma czego czytać. Bez tego kroku `rclone` dostaje puste klucze
      # i pada na uwierzytelnieniu B2, czyli komunikatem, który MYLI: wygląda
      # jak awaria dostawcy, a jest brakiem konfiguracji. Diagnoza szłaby wtedy
      # w stronę Backblaze zamiast w stronę `gh secret set`.
      #
      # `exit 1`, nie `exit 0`: job bramkowany na `BACKUP_MONITORING_ENABLED`
      # został WŁĄCZONY świadomie, więc jego cisza znaczyłaby, że ktoś włączył
      # monitoring kopii i dostał zielono, nie czytając ani jednego bajtu.
      - name: Refuse to claim anything without credentials
        if: env.HAS_S3_ACCESS != 'true' || env.HAS_S3_SECRET != 'true'
        run: |
          echo "::error::BACKUP_MONITORING_ENABLED=true, ale brakuje sekretów repo:"
          [ "${HAS_S3_ACCESS}" = "true" ] || echo "::error::  BACKUP_S3_ACCESS_KEY"
          [ "${HAS_S3_SECRET}" = "true" ] || echo "::error::  BACKUP_S3_SECRET_KEY"
          echo "::error::Bez nich nie da się odczytać LATEST.json, więc ten job nie"
          echo "::error::może orzec NIC o świeżości kopii — a milczące przejście"
          echo "::error::twierdziłoby, że kopie są monitorowane."
          echo "::error::Kroki: docs/runbook-backup-201.md, sekcja (d)."
          echo "::error::Albo ustaw sekrety, albo cofnij BACKUP_MONITORING_ENABLED na false."
          exit 1

      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rclone

      - name: Read and validate LATEST.json
        run: |
          set -euo pipefail
          DEST="offsite:${BACKUP_S3_BUCKET}/${BACKUP_S3_PREFIX}"

          if ! rclone cat "${DEST}/LATEST.json" > /tmp/manifest.json; then
            echo "::error::cannot read ${DEST}/LATEST.json — either no backup has ever"
            echo "::error::completed, or the bucket/credentials are wrong. Both mean the"
            echo "::error::off-site copy is not confirmed to exist."
            exit 1
          fi
          jq . /tmp/manifest.json

          finished="$(jq -r '.finished_at' /tmp/manifest.json)"
          age_h=$(( ( $(date -u +%s) - $(date -u -d "$finished" +%s) ) / 3600 ))
          echo "last completed backup: ${finished} (${age_h}h ago)"
          if [ "$age_h" -gt "$MAX_AGE_HOURS" ]; then
            echo "::error::no backup has completed for ${age_h}h (limit ${MAX_AGE_HOURS}h)."
            exit 1
          fi

          failures="$(jq -r '.failures' /tmp/manifest.json)"
          if [ "$failures" != "0" ]; then
            echo "::error::last backup run recorded ${failures} failed artefact(s):"
            jq -r '.artefacts[] | select(.status != "ok") | "  \(.artefact): \(.status) — \(.detail)"' /tmp/manifest.json
            exit 1
          fi

          # Presence check, not just status. Dropping an artefact from backup.sh
          # produces a manifest that is fresh, has zero failures, and is missing
          # a whole dataset — which is precisely how ~136k CV files came to be
          # backed up by nothing while every signal stayed green.
          for required in postgres uploads cv_corpus; do
            jq -e --arg a "$required" \
              'any(.artefacts[]; .artefact == $a and .status == "ok")' \
              /tmp/manifest.json > /dev/null || {
                echo "::error::artefact '${required}' is missing from the manifest or not ok."
                echo "::error::A backup missing one dataset is not a backup; see backup/backup.sh."
                exit 1
              }
          done
          jq -e 'any(.artefacts[]; (.artefact | startswith("qdrant")) and .status == "ok")' \
            /tmp/manifest.json > /dev/null || {
              echo "::error::no Qdrant collection was backed up successfully."
              exit 1
            }

          objects="$(jq -r '.artefacts[] | select(.artefact == "cv_corpus") | .objects' /tmp/manifest.json)"
          bytes="$(jq -r '.artefacts[] | select(.artefact == "cv_corpus") | .bytes' /tmp/manifest.json)"
          echo "CV corpus mirrored: ${objects} objects / ${bytes} bytes"
          echo "All artefacts present and ok."

  # ── Per-check degradation ───────────────────────────────────────────────────
  # Drugi (i do dziś jedyny obok `disk-alert.yml`) czytelnik tego, co
  # `/api/health` naprawdę wylicza. Job `probe` wyżej asertuje `.status`, a
  # `.status` z konstrukcji zależy WYŁĄCZNIE od `checks.database`
  # (`app/main.py`: `overall = "healthy" if db_healthy else "unhealthy"`).
  # Każdy pozostały check jest udokumentowany jako „informacyjny, nigdy nie
  # przestawia overall" — czyli trzynaście sond pisało do kanału bez odbiorcy.
  # Martwa baza to jedyna awaria, którą `probe` umie wykryć, i akurat ona kładzie
  # całą aplikację, więc sondy nie potrzebuje.
  #
  # Dlaczego OSOBNY job, a nie krok w `probe`:
  #   1. Potrzebuje `issues: write` (wzorzec z `disk-alert.yml`), a `probe` ma
  #      świadomie `contents: read` — nie rozszerzamy uprawnień kroku, który
  #      dotyka TLS-a i frontendu.
  #   2. Nie zależy od `probe`. Gdy baza padnie, `probe` failuje na `.status`;
  #      wtedy tym bardziej chcemy wiedzieć, co jeszcze jest zdegradowane.
  #   3. Ten job NIE dotyka `.status`, więc nie ma jak zwrócić 503 kontenerowi
  #      ani wywalić deployu — jedynym skutkiem jest issue i czerwony cron.
  #
  # Progi (dwa poziomy, świadomie):
  #   • ERROR (issue + exit 1): `unhealthy` / `misconfigured` / `critical` /
  #     `crashed: …`. To stany, w których coś JEST zepsute i ma właściciela.
  #   • WARN (podsumowanie runu, run zostaje zielony): `degraded`, `warning`,
  #     `unknown`, `uncapped: …`, `disabled`/`unconfigured` spoza allowlisty.
  #     Twarde padanie na `degraded` dałoby czerwień permanentną (np. Traffit
  #     bywa zdegradowany całymi dniami z powodów operacyjnych), a stały
  #     czerwony alarm jest dokładnie tak samo niewidoczny jak brak alarmu.
  #
  # `ALLOWLIST` jest JAWNA i celowo minimalna — bez niej `autenti=unconfigured`
  # i `priority_work=disabled` (stan produkcji na 2026-08-21, oba wynikają z
  # wyłączonych kill-switchy) hałasowałyby przy każdym biegu, a nowy check
  # zaczynałby życie już na czerwono. Dopisuj tu WYŁĄCZNIE stany, o których
  # wiadomo, że są oczekiwane — cichnięcie stanu jest decyzją, nie sprzątaniem.
  health-checks:
    name: /api/health per-check degradation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Classify .checks
        id: classify
        run: |
          set -euo pipefail
          # UA wymagana przez bypass-rule Cloudflare (patrz observability.md);
          # api.nexus.* jest dziś DNS-only, ale zgodność kosztuje jedną flagę.
          body=$(curl -sS --max-time 20 \
            -A "dynaminds-smoke-test/1.0 (+github-actions; Nexus)" \
            https://api.nexus.dynaminds.pl/api/health || true)
          if ! printf '%s' "$body" | jq -e 'has("checks")' > /dev/null 2>&1; then
            # Backend nieosiągalny albo bez `.checks` — to jest awaria, którą job
            # `probe` już zgłasza głośno. Tutaj cisza, żeby jedna awaria nie
            # otwierała dwóch alarmów o różnej treści.
            echo "::warning::/api/health nie zwrócił JSON-a z polem .checks — patrz job 'probe'."
            echo "fail=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$body" | jq '.checks'

          # `configured` to zdrowa wartość checku `anthropic` (mapa
          # {"ok": "configured"} w app/main.py) — bez tego wyjątku ostrzeżenie
          # wisiałoby stale przy poprawnie skonfigurowanym kluczu.
          ALLOWLIST='{"autenti":["unconfigured"],"priority_work":["disabled"]}'
          classified=$(printf '%s' "$body" | jq -r --argjson allow "$ALLOWLIST" '
            .checks
            | to_entries
            | map(.value |= tostring)
            | map(select(.value != "healthy" and .value != "configured"))
            | map(. as $e | select(($allow[$e.key] // []) | index($e.value) | not))
            | map(. + {sev: (
                if (.value | test("^(unhealthy|misconfigured|critical|crashed)"))
                then "error" else "warn" end)})
            | .[] | "\(.sev)\t\(.key)\t\(.value)"
          ')

          errors=$(printf '%s' "$classified" | grep -c '^error' || true)
          warns=$(printf '%s' "$classified" | grep -c '^warn' || true)
          echo "errors=$errors warns=$warns"

          {
            echo "### /api/health — checks poza stanem zdrowym"
            echo
            if [ -z "$classified" ]; then
              echo "Wszystkie checki zdrowe (albo na allowliście)."
            else
              echo "| poziom | check | stan |"
              echo "| --- | --- | --- |"
              printf '%s\n' "$classified" | awk -F'\t' '{printf "| %s | `%s` | `%s` |\n", $1, $2, $3}'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          printf '%s\n' "$classified" | awk -F'\t' '
            $1 == "warn"  { printf "::warning::health check %s = %s\n", $2, $3 }
            $1 == "error" { printf "::error::health check %s = %s\n", $2, $3 }'

          if [ "$errors" -gt 0 ]; then
            echo "fail=1" >> "$GITHUB_OUTPUT"
            {
              echo "detail<<CLASSIFIED_EOF"
              printf '%s\n' "$classified" | awk -F'\t' '$1 == "error" { printf "- `%s` = `%s`\n", $2, $3 }'
              echo "CLASSIFIED_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "fail=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or refresh alert issue
        if: steps.classify.outputs.fail == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          DETAIL: ${{ steps.classify.outputs.detail }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="NEXUS health checks unhealthy"
          existing=$(gh issue list --repo "$REPO" --state open \
            --search "$marker in:title" --json number --jq '.[0].number // empty' || echo "")
          # --body-file zamiast inline heredoca: treść niesie backticki i
          # wartości z sieci, więc nie chcemy jej przepuszczać przez kolejny
          # poziom interpretacji powłoki.
          {
            echo "Sonda \`/api/health\` zgłasza checki w stanie awaryjnym:"
            echo
            printf '%s\n' "$DETAIL"
            echo
            echo "\`/api/health\` zwraca \`status: healthy\` mimo tego — \`status\` zależy"
            echo "wyłącznie od \`checks.database\`. Reszta checków jest informacyjna i to"
            echo "issue jest ich jedynym kanałem."
            echo
            echo "Bieg: ${RUN_URL}"
            echo
            echo "_Auto-generated by \`.github/workflows/uptime-probe.yml\`._"
          } > /tmp/health-issue.md
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file /tmp/health-issue.md
          else
            gh issue create --repo "$REPO" --title "⚠️ ${marker}" --body-file /tmp/health-issue.md
          fi

      - name: Fail run so GitHub emails the owner
        if: steps.classify.outputs.fail == '1'
        run: exit 1
