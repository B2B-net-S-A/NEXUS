name: Contract docs secure provisioning

# Narrow alternative when the operator can dispatch the established Coolify
# operations but cannot create GitHub repository secrets. Never a plaintext input.
on:
  pull_request:
    paths:
      - .github/workflows/contract-docs-secret.yml
      - .github/scripts/contract_docs_secret.py
      - .github/scripts/tests/test_contract_docs_secret.py
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [receive, submit]
        required: true
      receiver_identity:
        description: 'Public receiving run ID-attempt (submit only)'
        required: false
        default: ''
      ciphertext:
        description: 'RSA-4096 OAEP-SHA256 ciphertext only; never a secret value'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  transport-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s .github/scripts/tests -p test_contract_docs_secret.py
  receive:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'receive'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: coolify-set-env
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create ephemeral transport key
        run: python3 .github/scripts/contract_docs_secret.py prepare
      - name: Publish public key only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-docs-key-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract-docs-transport/offer.json
          retention-days: 1
          if-no-files-found: error
      - name: Verify and save dedicated credential
        env:
          GH_TOKEN: ${{ github.token }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: python3 .github/scripts/contract_docs_secret.py receive
      - name: Remove ephemeral private key
        if: always()
        run: rm -f "${RUNNER_TEMP}/contract-docs-transport/private.pem"
  submit:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'submit'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate encrypted envelope
        run: python3 .github/scripts/contract_docs_secret.py submit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-docs-envelope-${{ inputs.receiver_identity }}
          path: ${{ runner.temp }}/contract-docs-transport/envelope.txt
          retention-days: 1
          if-no-files-found: error
