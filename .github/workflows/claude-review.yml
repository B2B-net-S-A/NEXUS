name: Claude review

# Automated Claude Code review on every PR. INERT until activated:
#   1. run `claude setup-token` (Max subscription) -> set repo secret CLAUDE_CODE_OAUTH_TOKEN
#   2. flip repo variable CLAUDE_ENABLED to 'true'
# Runs on the Max subscription (no API cost). Kill-switch: set CLAUDE_ENABLED=false.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: vars.CLAUDE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # dynaminds-codex-bot pushes fix commits to PR branches; without this entry the
          # actor check fails the job (rerun keeps the actor, so it can never recover).
          # Deliberately a single named bot, not '*'.
          allowed_bots: "dynaminds-codex-bot"
          # Post the review to the PR (sticky tracking comment + inline comments)
          # instead of leaving it buried in the Actions log.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for bugs, security issues, and missing test
            coverage. Be concise — only flag real problems and cite file:line.
            Skip style nitpicks. Use inline comments for specific findings; finish
            with a short summary of your overall verdict.

            Work within a turn budget — a review that never posts is worth nothing:
            - Fetch the diff ONCE with `gh pr diff` and review from it. Do not use
              `git diff origin/main...HEAD`; the checkout is shallow (fetch-depth 1)
              and it will fail.
            - Open files with Read only where the diff genuinely lacks the context
              needed to confirm a suspicion. Do not read every changed file.
            - On a large diff, prioritise: backend logic, auth/permissions, DB
              migrations, and anything touching candidate data. Skim lockfiles,
              snapshots, generated output and pure-formatting hunks.
            - Each inline comment costs a turn. Post at most the 10 most severe
              findings inline; fold the rest into the summary.
            - Post the summary verdict while you still have budget left. If you are
              running out of turns, post what you have — a partial review beats a
              failed job with no output at all.
          # Turn history: 5 was razor-thin (error_max_turns on a 3-line diff,
          # dynaminds-elevate PR #122, run 29494194302) -> 15. But 15 is BELOW the
          # floor of a normal review: dynaminds-elevate at --max-turns 45 spends
          # 15-23 turns on ordinary PRs (runs 30263361383, 30260709398, 30262668831),
          # so on 2026-07-27 every Nexus run was dying at turn 16 regardless of PR
          # size — zero inline comments, no verdict (e.g. PR #919, run 30265654190).
          # 50 gives ~2x headroom over the observed 23-turn ceiling and covers the
          # bigger diffs this monorepo produces. Elevate proved 30 was still too low.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 50
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
