name: Claude review

# Automated Claude Code review on every PR. INERT until activated:
#   1. run `claude setup-token` (Max subscription) -> set repo secret CLAUDE_CODE_OAUTH_TOKEN
#   2. flip repo variable CLAUDE_ENABLED to 'true'
# Runs on the Max subscription (no API cost). Kill-switch: set CLAUDE_ENABLED=false.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: vars.CLAUDE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # dynaminds-codex-bot pushes fix commits to PR branches; without this entry the
          # actor check fails the job (rerun keeps the actor, so it can never recover).
          # dependabot dopisany 21.08.2026 (#208): review padał na 100% jego PR-ów,
          # czyli jedyna klasa zmian dotykająca CUDZEGO kodu była jedyną bez recenzji.
          # Nadal jawna lista dwóch botów, nie '*'.
          allowed_bots: "dynaminds-codex-bot,dependabot"
          # Post the review to the PR (sticky tracking comment + inline comments)
          # instead of leaving it buried in the Actions log.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for bugs, security issues, and missing test
            coverage. Be concise — only flag real problems and cite file:line.
            Skip style nitpicks. Use inline comments for specific findings; finish
            with a short summary of your overall verdict.

            Work within a turn budget — a review that never posts is worth nothing:
            - Start with `gh pr diff --name-only` and decide the scope from the file
              list BEFORE you pull the patch.
            - Then fetch the patch with `gh pr diff`. Do not use
              `git diff origin/main...HEAD`; the checkout is shallow (fetch-depth 1)
              and it will fail. If the output is too large and lands in a file, read
              that file with Read in chunks (offset/limit) — do NOT re-run
              `gh pr diff`, it returns the same bytes. Never pipe `gh pr diff`
              through head/sed/grep: those tools are NOT allowed here and every
              attempt is a wasted turn (4 such denials in PR #1218).
            - On a large diff, prioritise: backend logic, auth/permissions, DB
              migrations, and anything touching candidate data. Skim lockfiles,
              snapshots, generated output and pure-formatting hunks. Treat test
              files as EVIDENCE for findings you already have, not as material to
              review — in this repo they are routinely half the diff (51.5% of the
              characters in PR #1218).
            - Open files with Read only where the diff genuinely lacks the context
              needed to confirm a suspicion. Do not read every changed file.
            - As soon as you finish reading the diff, and BEFORE you open a single
              file, post a preliminary verdict with `gh pr comment`: what you already
              have and what you have not touched yet. This is NOT optional. Refine it
              later if the budget allows.
            - Each inline comment costs a turn. Post at most the 10 most severe
              findings inline; fold the rest into the summary.
            - If you are running out of turns, post what you have and name the files
              you never got to. A partial review beats a failed job with no output.
          # Turn history: 5 was razor-thin (error_max_turns on a 3-line diff,
          # dynaminds-elevate PR #122, run 29494194302) -> 15. But 15 is BELOW the
          # floor of a normal review: dynaminds-elevate at --max-turns 45 spends
          # 15-23 turns on ordinary PRs (runs 30263361383, 30260709398, 30262668831),
          # so on 2026-07-27 every Nexus run was dying at turn 16 regardless of PR
          # size — zero inline comments, no verdict (e.g. PR #919, run 30265654190).
          # 50 gave ~2x headroom over that 23-turn ceiling and Elevate proved 30 was
          # still too low — but 50 only held for ordinary PRs. It kept dying on the
          # >=25-file class (~10% of traffic): runs 32384345811, 32140289551 and
          # 31843049474 all ended at num_turns 51 / error_max_turns, and PR #1218
          # (75 files) burned $2.24 to produce literally nothing ("No buffered
          # inline comments"). A 64-file PR finished in 42 turns, so the job IS
          # doable inside a budget — what was missing is headroom, not an order of
          # magnitude. The actual fix is the forced preliminary verdict in the prompt
          # above: the model has no turn counter, so "post while you still have
          # budget" was never executable. 80 is the safety margin (~1.9x the measured
          # 42-turn success, the way 50 was ~2.2x the earlier 23-turn ceiling) and is
          # invisible to the 90% of PRs that spend 4-13 turns.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 80
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # Bez tego kroku czerwony `review` jest NIEROZRÓŻNIALNY od recenzji, która nic
      # nie znalazla. `review` swiadomie NIE jest wymaganym checkiem (kill-switch
      # CLAUDE_ENABLED znaczy, ze moze sie nie odpalic), wiec awaria niczego nie
      # blokuje, a `track_progress: true` i tak dopisuje do PR-a komentarz z linkiem
      # do joba — PR wyglada na zrecenzowany. To ta sama klasa defektu co #408:
      # awaria nie moze udawac zera.
      #
      # Okno 2026-08-24 04:15-08:12 UTC: 10 przebiegow padlo, w tym PIEC PR-ow
      # dependabota w ciagu 90 sekund (rozne diffy), a ta sama galaz
      # fix/m365-attachment-savepoint padla o 08:07 i przeszla o 08:17 bez zadnej
      # zmiany w repo. Rozpoznanie zajelo godzine czytania 969-linijkowego logu,
      # w ktorym jedynym sladem bylo `is_error: true` przy `num_turns: 1`.
      - name: Rozpoznaj, dlaczego recenzja padła
        if: failure() && steps.claude.conclusion == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          FILE="${EXECUTION_FILE:-${RUNNER_TEMP}/claude-execution-output.json}"

          emit() {  # $1=tytul annotacji, $2=tresc
            echo "::error title=$1::$2"
            {
              echo "## Recenzja Claude: $1"
              echo
              echo "$2"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ ! -f "$FILE" ]; then
            emit "nie wystartowała" \
              "Akcja padła, zanim model wykonał cokolwiek (brak $FILE). Szukaj w uwierzytelnieniu (CLAUDE_CODE_OAUTH_TOKEN) albo w samym kroku akcji — nie w treści PR-a."
            exit 0
          fi

          # Plik bywa tablicą zdarzeń stream-json albo pojedynczym obiektem wyniku.
          RESULT="$(jq -c 'if type=="array" then (map(select(.type=="result")) | last // empty) else . end' "$FILE" 2>/dev/null || true)"

          # Plik pusty, uszkodzony albo bez zdarzenia `result` znaczy NIE WIEM — a nie
          # "model przeszedl". Bez tej galezi krok orzekalby "padla poza modelem",
          # czyli stawialby teze o stanie, o ktorym nie ma danych. To dokladnie ta klasa
          # defektu, ktora ten krok ma wykrywac.
          OK="$(printf '%s' "$RESULT" | jq -r 'if type=="object" and has("subtype") then "y" else "n" end' 2>/dev/null || echo n)"
          if [ -z "$RESULT" ] || [ "$OK" != "y" ]; then
            emit "nie do rozpoznania" \
              "Plik wyniku ($FILE) jest pusty, uszkodzony albo nie zawiera zdarzenia \`result\` — NIE WIADOMO, czy model w ogóle wystartował. Czytaj log akcji i nie zakładaj, że recenzja się odbyła."
            exit 0
          fi

          IS_ERROR="$(printf '%s' "$RESULT" | jq -r '.is_error // false')"
          SUBTYPE="$(printf '%s' "$RESULT" | jq -r '.subtype // "unknown"')"
          # `tonumber? // 0 | floor` — zapis 1.0 rozjezdzalby porownanie calkowitoliczbowe
          # nizej i awaria "zero tur" ladowalaby jako "recenzja czesciowa".
          TURNS="$(printf '%s' "$RESULT" | jq -r '(.num_turns // 0) | tonumber? // 0 | floor')"
          COST="$(printf '%s' "$RESULT" | jq -r '.total_cost_usd // 0')"

          echo "subtype=$SUBTYPE is_error=$IS_ERROR num_turns=$TURNS cost_usd=$COST"
          if [ "$SUBTYPE" = "error_max_turns" ]; then
            emit "wyczerpała budżet tur" \
              "Model zużył wszystkie $TURNS tur i nie zdążył opublikować werdyktu. To jest NASZE do naprawy: patrz komentarz przy \`--max-turns\` w tym pliku. Recenzja NIE jest kompletna, choć na PR-ze może wisieć komentarz."
          elif [ "$IS_ERROR" = "true" ] && [ "$TURNS" -le 1 ]; then
            emit "NIE ODBYŁA SIĘ" \
              "Model nie wykonał ani jednej tury — żądanie zostało odrzucone, zanim recenzja się zaczęła. Przyczyna jest POZA tym repo (limit konta, niedostępność usługi). Sprawdź, czy w tym samym oknie padają niepowiązane PR-y: \`gh run list --repo ${{ github.repository }} --workflow claude-review.yml --limit 20\`. Jeśli tak — ustąpi samo, ponawianie pojedynczego przebiegu nic nie da. Jeśli pada tylko ten PR — szukaj w jego treści. UWAGA: komentarz Claude'a na PR-ze mimo to został dopisany i NIE oznacza, że recenzja się odbyła."
          elif [ "$IS_ERROR" = "true" ]; then
            emit "przerwała się w trakcie" \
              "Model wykonał tur: $TURNS, i zakończył błędem (\`$SUBTYPE\`). Recenzja jest częściowa — traktuj PR jako NIEZRECENZOWANY."
          else
            emit "padła poza modelem" \
              "Sam przebieg modelu zakończył się bez błędu (\`$SUBTYPE\`, $TURNS tur), więc job wywrócił się na kroku wokół niego — czytaj log akcji."
          fi

          {
            echo "| pole | wartość |"
            echo "|---|---|"
            echo "| subtype | \`$SUBTYPE\` |"
            echo "| is_error | \`$IS_ERROR\` |"
            echo "| tury | \`$TURNS\` |"
            echo "| koszt USD | \`$COST\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
