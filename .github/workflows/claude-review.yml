name: Claude review

# Automated Claude Code review on every PR. INERT until activated:
#   1. run `claude setup-token` (Max subscription) -> set repo secret CLAUDE_CODE_OAUTH_TOKEN
#   2. flip repo variable CLAUDE_ENABLED to 'true'
# Runs on the Max subscription (no API cost). Kill-switch: set CLAUDE_ENABLED=false.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: vars.CLAUDE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # dynaminds-codex-bot pushes fix commits to PR branches; without this entry the
          # actor check fails the job (rerun keeps the actor, so it can never recover).
          # dependabot dopisany 21.08.2026 (#208): review padał na 100% jego PR-ów,
          # czyli jedyna klasa zmian dotykająca CUDZEGO kodu była jedyną bez recenzji.
          # Nadal jawna lista dwóch botów, nie '*'.
          allowed_bots: "dynaminds-codex-bot,dependabot"
          # Post the review to the PR (sticky tracking comment + inline comments)
          # instead of leaving it buried in the Actions log.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for bugs, security issues, and missing test
            coverage. Be concise — only flag real problems and cite file:line.
            Skip style nitpicks. Use inline comments for specific findings; finish
            with a short summary of your overall verdict.

            Work within a turn budget — a review that never posts is worth nothing:
            - Start with `gh pr diff --name-only` and decide the scope from the file
              list BEFORE you pull the patch.
            - Then fetch the patch with `gh pr diff`. Do not use
              `git diff origin/main...HEAD`; the checkout is shallow (fetch-depth 1)
              and it will fail. If the output is too large and lands in a file, read
              that file with Read in chunks (offset/limit) — do NOT re-run
              `gh pr diff`, it returns the same bytes. Never pipe `gh pr diff`
              through head/sed/grep: those tools are NOT allowed here and every
              attempt is a wasted turn (4 such denials in PR #1218).
            - On a large diff, prioritise: backend logic, auth/permissions, DB
              migrations, and anything touching candidate data. Skim lockfiles,
              snapshots, generated output and pure-formatting hunks. Treat test
              files as EVIDENCE for findings you already have, not as material to
              review — in this repo they are routinely half the diff (51.5% of the
              characters in PR #1218).
            - Open files with Read only where the diff genuinely lacks the context
              needed to confirm a suspicion. Do not read every changed file.
            - As soon as you finish reading the diff, and BEFORE you open a single
              file, post a preliminary verdict with `gh pr comment`: what you already
              have and what you have not touched yet. This is NOT optional. Refine it
              later if the budget allows.
            - Each inline comment costs a turn. Post at most the 10 most severe
              findings inline; fold the rest into the summary.
            - If you are running out of turns, post what you have and name the files
              you never got to. A partial review beats a failed job with no output.
          # Turn history: 5 was razor-thin (error_max_turns on a 3-line diff,
          # dynaminds-elevate PR #122, run 29494194302) -> 15. But 15 is BELOW the
          # floor of a normal review: dynaminds-elevate at --max-turns 45 spends
          # 15-23 turns on ordinary PRs (runs 30263361383, 30260709398, 30262668831),
          # so on 2026-07-27 every Nexus run was dying at turn 16 regardless of PR
          # size — zero inline comments, no verdict (e.g. PR #919, run 30265654190).
          # 50 gave ~2x headroom over that 23-turn ceiling and Elevate proved 30 was
          # still too low — but 50 only held for ordinary PRs. It kept dying on the
          # >=25-file class (~10% of traffic): runs 32384345811, 32140289551 and
          # 31843049474 all ended at num_turns 51 / error_max_turns, and PR #1218
          # (75 files) burned $2.24 to produce literally nothing ("No buffered
          # inline comments"). A 64-file PR finished in 42 turns, so the job IS
          # doable inside a budget — what was missing is headroom, not an order of
          # magnitude. The actual fix is the forced preliminary verdict in the prompt
          # above: the model has no turn counter, so "post while you still have
          # budget" was never executable. 80 is the safety margin (~1.9x the measured
          # 42-turn success, the way 50 was ~2.2x the earlier 23-turn ceiling) and is
          # invisible to the 90% of PRs that spend 4-13 turns.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 80
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
