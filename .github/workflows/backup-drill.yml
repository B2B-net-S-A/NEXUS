name: Backup Restore Drill

on:
  schedule:
    # Monday 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    name: pg_restore dry-run + alembic upgrade
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drill
          POSTGRES_PASSWORD: drill-password
          POSTGRES_DB: nexus_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup SSH to backup host
        if: env.BACKUP_DRILL_SSH_KEY != ''
        env:
          BACKUP_DRILL_SSH_KEY: ${{ secrets.BACKUP_DRILL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$BACKUP_DRILL_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.BACKUP_DRILL_HOST || '91.99.199.112' }} >> ~/.ssh/known_hosts

      - name: Fetch latest backup from VPS
        if: env.BACKUP_DRILL_SSH_KEY != ''
        env:
          BACKUP_DRILL_SSH_KEY: ${{ secrets.BACKUP_DRILL_SSH_KEY }}
        run: |
          scp -q root@${{ secrets.BACKUP_DRILL_HOST || '91.99.199.112' }}:/var/backups/nexus/postgres/$(date -u +%Y-%m-%d).dump /tmp/latest.dump \
            || scp -q root@${{ secrets.BACKUP_DRILL_HOST || '91.99.199.112' }}:/var/backups/nexus/postgres/$(date -u -d 'yesterday' +%Y-%m-%d).dump /tmp/latest.dump
          ls -lh /tmp/latest.dump

      - name: Restore dump into ephemeral Postgres
        if: env.BACKUP_DRILL_SSH_KEY != '' && success()
        env:
          PGPASSWORD: drill-password
        run: |
          # A drill that swallows ALL pg_restore output (the old `|| echo …
          # continuing`) reports green even when the restore genuinely failed —
          # the exact class of fake-green this whole workflow exists to kill.
          # Instead: capture the exit code, print the stderr, and fail UNLESS the
          # only diagnostics are the known-harmless DROP / extension noise a
          # clean-restore into a vanilla postgres:16-alpine always emits.
          set +e
          pg_restore --clean --if-exists --no-owner --no-privileges \
            -h localhost -U drill -d nexus_drill /tmp/latest.dump 2>/tmp/restore.err
          rc=$?
          set -e
          echo "----- pg_restore stderr -----"
          cat /tmp/restore.err || true
          echo "-----------------------------"
          if [ "$rc" -eq 0 ]; then
            echo "pg_restore exited 0 — clean restore."
            exit 0
          fi
          # Non-zero exit. Keep only lines pg_restore itself flagged as error/
          # warning, then drop the ones that are expected and harmless here:
          #   • DROP of an object that does not exist yet (fresh DB + --clean)
          #   • CREATE/COMMENT on an extension not bundled in the drill image
          #   • the trailing "errors ignored on restore: N" summary line
          # Anything left is a real restore failure and must turn the drill red.
          unexpected="$(grep -E '^pg_restore: (error|warning):' /tmp/restore.err \
            | grep -viE 'does not exist|already exists|errors ignored on restore|extension|EXTENSION' \
            || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::pg_restore reported errors beyond harmless DROP/extension noise:"
            echo "$unexpected"
            exit 1
          fi
          echo "pg_restore reported only harmless DROP/extension warnings; continuing."

      - name: Alembic upgrade head on restored DB
        if: env.BACKUP_DRILL_SSH_KEY != '' && success()
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://drill:drill-password@localhost:5432/nexus_drill
          SECRET_KEY: drill-only-not-for-production-at-least-48-chars-long
        run: alembic -c alembic/alembic.ini upgrade head

      - name: Sample query (smoke — restored data must be non-empty)
        if: env.BACKUP_DRILL_SSH_KEY != '' && success()
        env:
          PGPASSWORD: drill-password
        run: |
          # A restore that leaves the candidates table present but EMPTY is a
          # silent failure: the schema arrived, the data did not. Counting is not
          # enough — assert the count is actually > 0 so an empty dump fails loud.
          count="$(psql -tAc 'SELECT count(*) FROM candidates' -h localhost -U drill -d nexus_drill)"
          echo "candidates restored: ${count}"
          test "${count}" -gt 0

      - name: No SSH key — drill cannot run (FAIL)
        if: env.BACKUP_DRILL_SSH_KEY == ''
        run: |
          echo "::error::BACKUP_DRILL_SSH_KEY is not configured, so every step that"
          echo "::error::actually verifies anything was skipped: fetch, restore,"
          echo "::error::alembic upgrade and smoke query never ran."
          echo ""
          echo "This step used to emit a warning and let the job pass. That made the"
          echo "drill report GREEN every week while restoring nothing — the worst"
          echo "possible signal, because docs/disaster-recovery.md then cited this"
          echo "workflow as proof the restore path was verified."
          echo ""
          echo "A disaster-recovery drill that cannot run is a FAILING drill."
          echo "There is currently no evidence that a NEXUS backup can be restored."
          echo ""
          echo "To make this green, the drill has to genuinely pass — see"
          echo "docs/disaster-recovery.md for what is still missing."
          exit 1
