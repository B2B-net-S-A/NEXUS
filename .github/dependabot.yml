version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    # Wydanie musi mieć co najmniej 7 dni, zanim Dependabot je zaproponuje
    # (zizmor `dependabot-cooldown`, 27.11.2026). Przejęte tagi i paczki
    # (marzec 2026: `aquasecurity/trivy-action`, CVE-2026-33634) wycofano
    # w ciągu dni; PR z dnia publikacji wciągnąłby je w poniedziałek rano.
    # Aktualizacje bezpieczeństwa Dependabota cooldown omijają.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # Wersja klienta = wersja serwera Qdranta (v1.17.1 w docker-compose.yml,
      # #1136); różnica najwyżej o jeden minor. Kod woła już tylko
      # query_points (14.11.2026), ale bump klienta idzie razem z obrazem
      # serwera w jednym PR-ze, nie jako propozycja dependabota.
      - dependency-name: "qdrant-client"
    groups:
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # eslint-config-next trzymamy w tej samej linii major co next (15.x);
      # 16.x wróci razem z upgradem frameworka.
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # ESLint 10 nie działa z eslint-config-next 15: jego
      # `@rushstack/eslint-patch` kończy `next lint` błędem „Failed to patch
      # ESLint because the calling module was not recognized” (sprawdzone
      # 24.11.2026, #1632). Wraca razem z Next 16 i eslint-config-next 16.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Typy Node trzymamy w majorze runtime'u z frontend/Dockerfile
      # (node:24-alpine). Nowszy major podpowiada API, których produkcja
      # nie ma (#1630 proponował 26). Podnosimy razem z obrazem.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
      radix-ui:
        patterns:
          - "@radix-ui/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
      - "backend"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
    commit-message:
      prefix: "chore(docker)"
