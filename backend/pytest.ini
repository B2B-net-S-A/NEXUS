[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
markers =
    static: strażnik repo bez bazy, biegnie na każdym PR-ze (nadawany w tests/_static_marker.py)
    not_static: wyjęty z zestawu static mimo spełnienia reguły
