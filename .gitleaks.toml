# Gitleaks configuration for Nexus ATS.
# Docs: https://github.com/gitleaks/gitleaks
title = "Nexus ATS gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Build artefacts and untracked per-developer scratch — NO tracked files"
# W tej liście mogą być WYŁĄCZNIE pliki, których git nie śledzi.
#
# Wpis ścieżkowy nie wycisza jednego trafienia — wyłącza skaner na CAŁYM pliku,
# na zawsze, także dla reguł, które dopiero powstaną. Ten konfig sam ostrzegał
# przed tą techniką: to ona pozwoliła przeleżeć w repo działającemu hasłu
# administratora. Placeholdery allowlistuj po WARTOŚCI — globalnie w
# ``regexes`` niżej albo, dla reguły z własnym blokiem, w jej
# ``[rules.allowlist]`` (per-reguła NADPISUJE globalny).
#
# Zdjęte 21.08.2026 (#211) — każde usunięcie zweryfikowane skanem, żaden nowy
# finding nie doszedł:
#   * .github/workflows/backup-drill.yml — jedyne miejsce w repo dotykające
#     PRYWATNEJ połowy klucza age (odszyfrowuje CAŁĄ archiwalną kopię
#     kandydatów) oraz kluczy Backblaze B2. Ślepota skanera akurat tam była
#     najgorszym możliwym wyborem. Jego DSN siedzi teraz w bloku per-reguła
#     przy ``hardcoded-db-password``.
#   * .github/workflows/ci.yml — j.w., DSN po WARTOŚCI.
#   * frontend/package-lock.json — plik śledzony; lockfile npm potrafi nieść
#     ``_authToken`` do prywatnego rejestru.
#   * .claude/ — prefiks obejmował ŚLEDZONE ``.claude/commands/*.md`` i
#     ``.claude/ops.yaml`` (procedury SSH/DB), czyli dokładnie te pliki, w które
#     ktoś wkleja poświadczenie „na chwilę". Zostają dwa konkretne pliki
#     NIEŚLEDZONE, żeby lokalny skan nie hałasował.
#   * NEXUS_AUDIT_AND_PLAN.md, REQUIREMENTS_V<n>.md, QA_STRATEGY.md,
#     .env.example, backend/app/core/config.py, backend/embed_all.py —
#     martwe ślepe plamy: żaden z tych plików nie zapala dziś ANI JEDNEJ
#     reguły, więc wpisy nie kupowały nic, a kosztowały bezterminowe
#     wyłączenie sześciu plików ze skanowania.
#   * backend/tests/test_schema_inventory.py — ten JEDEN naprawdę zapalał
#     regułę (placeholdery ``u:p``), więc trafiły one do bloku per-reguła.
#     Test o hasłach jest ostatnim plikiem, który chcemy mieć niezeskanowany.
#
# Niezmiennika pilnuje
# ``backend/tests/test_gitleaks_no_tracked_path_blindspots.py`` — dopisanie tu
# pliku śledzonego przez gita zapala czerwone, zamiast po cichu oślepić bramkę.
paths = [
  '''frontend/tsconfig\.tsbuildinfo''',
  '''__pycache__/''',
  '''\.pyc$''',
  '''\.claude/settings\.local\.json''',
  '''\.claude/scheduled_tasks\.lock''',
]
regexes = [
  '''change-me''',
  '''your-[a-z-]+-key-here''',
  '''change-me-to-a-strong-password''',
  # CI-only test creds (clearly marked, no prod secret value)
  '''nexus:nexus-ci-password''',
  '''drill:drill-password''',
  # Local dev defaults — used by seed scripts, entrypoint, and Settings()
  # default. Documented as local-only in backend/CLAUDE.md; the production
  # DATABASE_URL is injected by Coolify env vault and never matches this.
  '''postgresql\+asyncpg://nexus:nexus@''',
  # Placeholder examples in docstrings / error messages (no real secret)
  '''postgresql://user:pass@db\.<project-ref>\.supabase\.co''',
  # Stały, publiczny nagłówek JWT — base64 z ``{"alg":"HS256","typ":"JWT"}``.
  # Nie niesie ŻADNEGO materiału klucza (podpis to trzeci segment, którego tu
  # nie ma), a pojawia się w testach redakcji logów jako realistyczna atrapa.
  # Po WARTOŚCI, nie po ścieżce: allowlistowanie ``backend/tests/`` oślepiłoby
  # skaner na katalog, w którym prawdziwy token wkleja się najłatwiej.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9''',
  # Dosłowna atrapa z asercji ``redact_sensitive("token=abcdef123456")``.
  # Zakotwiczona, bo ten globalny blok dopasowuje regexy do SAMEGO SEKRETU
  # (``regexTarget`` domyślnie ``"secret"``, nie ``"line"`` jak w blokach
  # per-reguła niżej) — wpis z prefiksem ``token=`` nigdy by nie zadziałał.
  '''^abcdef123456$''',
  # Identyfikator rewizji alembica użyty jako klucz markera jednorazowej
  # korekty danych w ``app_settings`` (``WHERE key = '0243_revive_...'``).
  # ``generic-api-key`` widzi tam przypisanie długiego ciągu do pola o nazwie
  # `key` i liczy entropię — 0243 przeszło próg (3,99), a 0242 o tym samym
  # kształcie nie. To loteria, więc kolejne migracje trafią w to losowo.
  #
  # Zakotwiczony kształt: cztery cyfry + snake_case ASCII, czyli dokładnie
  # konwencja `revision` w tym repo. Prawdziwe poświadczenia mają inny kształt
  # (mieszana wielkość liter, base64/hex, znaki spoza [a-z0-9_]), więc ten wpis
  # nie oślepia skanera na nic, co mogłoby być sekretem.
  #
  # Po WARTOŚCI, nie po ścieżce — allowlistowanie ``backend/alembic/versions/``
  # wyłączyłoby skaner na katalogu, w którym migracje danych operują na realnych
  # tabelach i do którego najłatwiej wkleić DSN-a z produkcji.
  '''^[0-9]{4}_[a-z0-9_]+$''',
]

[[rules]]
id = "voyage-api-key"
description = "Voyage AI API key"
regex = '''pa-[A-Za-z0-9_-]{30,}'''
tags = ["voyage", "api-key"]

# Klucz API konta serwisowego NEXUS-a (nagłówek X-API-Key).
# Format ``nxs_v2_<24 hex>_<sekret>`` ma rozpoznawalny prefiks WŁAŚNIE po to,
# żeby dało się go tu złapać: klucz wklejony do repo (skrypt operacyjny,
# workflow, notatka) zapala CI zamiast leżeć w historii gita. Sekret jest
# pokazywany raz i nie da się go odczytać z bazy, więc bez tej reguły wyciek
# do repo byłby wykrywalny dopiero po fakcie.
[[rules]]
id = "nexus-service-account-key"
description = "NEXUS service account API key (X-API-Key)"
regex = '''nxs_v2_[0-9a-f]{24}_[A-Za-z0-9_-]{32,}'''
tags = ["nexus", "api-key", "service-account"]

[[rules]]
id = "fireflies-api-key"
description = "Fireflies API key (UUID format used for bearer tokens)"
regex = '''[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}'''
tags = ["fireflies", "api-key"]
# Office Add-in manifests carry a stable GUID in `<Id>` that's public by
# design (Microsoft 365 Admin Center looks it up). Allowlist the file so
# the UUID-shape doesn't trip the Fireflies bearer-token rule.
# Plus M365/Phase-7.5 docs that record Azure AD tenant id, app client id, OAM
# provider id — all public Microsoft identifiers, NOT secrets (the secrets
# would be client_secret / refresh_token / state_signing_key, none of which
# appear in these files).
[rules.allowlist]
paths = [
  '''frontend/public/outlook-addin/manifest\.xml''',
  '''docs/ops/actionable-messages-setup\.md''',
  '''docs/m365-phase-7\.5-actionable-messages-completion-report\.md''',
]
# Linki do opublikowanych artefaktów Claude'a (raporty audytowe linkowane
# z docs/). UUID w ścieżce URL-a ma kształt tej reguły, ale jest identyfikatorem
# publicznej strony, nie poświadczeniem.
#
# Po WARTOŚCI, nie po ścieżce — z tego samego powodu, który opisuje komentarz
# przy ``hardcoded-db-password`` niżej. Dopisanie tu
# ``docs/tech-debt-backlog\.json`` oślepiłoby skaner na 640 KB cytatów z kodu
# produkcyjnego, czyli na plik, w którym przypadkowy sekret jest NAJBARDZIEJ
# prawdopodobny. Ten wpis przepuszcza wyłącznie URL-e artefaktów.
regexTarget = "line"
regexes = [
  '''claude\.ai/code/artifact/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
]

[[rules]]
id = "hardcoded-db-password"
description = "Postgres URL with password embedded"
regex = '''postgresql(\+asyncpg)?://[a-zA-Z0-9_]+:[^@:/\s"]+@'''
tags = ["db", "password"]
# Per-rule allowlist OVERRIDES the top-level [allowlist] for this rule —
# every legitimate placeholder must appear here too.
[rules.allowlist]
regexTarget = "line"
regexes = [
  '''postgresql\+asyncpg://nexus:change-me-to-a-strong-password@''',
  # Wariant SYNCHRONICZNY lokalnego DSN-a (bez ``+asyncpg``) — używany przez
  # skrypty seed/backfill i ``entrypoint.sh``. Jego brak TUTAJ był powodem,
  # dla którego allowlistowano całe ścieżki zamiast wartości.
  '''postgresql://nexus:nexus@''',
  # Placeholder w przykładzie użycia w docstringu (hasło zapisane dosłownie
  # jako ``...``) — nie sekret.
  '''postgresql://nexus:\.\.\.@''',
  '''postgresql\+asyncpg://\$\{POSTGRES_USER''',
  # Local dev default — used by seed scripts, entrypoint.sh, and the
  # ``Settings()`` Pydantic default in backend/app/core/config.py. Never
  # used in production: Coolify env vault overrides DATABASE_URL on every
  # deploy. Documented in backend/CLAUDE.md "Local dev" section.
  '''postgresql\+asyncpg://nexus:nexus@''',
  # DSN kontenera usługowego postgresa w hostowanym CI. Hasło pochodzi z
  # ``POSTGRES_PASSWORD`` ustawianego w tym samym pliku workflow i żyje tyle,
  # co job; produkcyjny DATABASE_URL wstrzykuje Coolify.
  #
  # Po WARTOŚCI, nie po ścieżce — dokładnie z powodu opisanego wyżej przy
  # wariancie synchronicznym: allowlistowanie ścieżki oślepia skaner na CAŁY
  # plik. Wersja globalna ``nexus:nexus-ci-password`` w [allowlist].regexes
  # nie wystarcza, bo ten per-regułowy blok ją nadpisuje.
  '''postgresql\+asyncpg://nexus:nexus-ci-password@''',
  # DSN kontenera postgresa w ``backup-drill.yml``. Hasło pochodzi z
  # ``POSTGRES_PASSWORD`` ustawianego w tym samym pliku i żyje tyle, co job.
  #
  # Ten wpis JEST konieczny, mimo że ``drill:drill-password`` figuruje już
  # w globalnym ``[allowlist].regexes``: blok per-reguła NADPISUJE globalny.
  # Dopóki plik był allowlistowany po ścieżce, nikt tego nie zauważył — to
  # dokładnie ta zależność, która sprawiała, że wpisu ścieżkowego „nie dało
  # się" usunąć.
  '''postgresql\+asyncpg://drill:drill-password@''',
  # Dosłowne placeholdery ``u``/``p`` w parametryzacji
  # ``tests/test_schema_inventory.py`` — sprawdza tam, że bramka kasowania
  # schematu ODRZUCA DSN-y wyglądające produkcyjnie. Wcześniej cały ten plik
  # był allowlistowany po ścieżce; test o hasłach to ostatnie miejsce, które
  # chcemy mieć wyłączone ze skanowania.
  '''postgresql(\+asyncpg)?://u:p@''',
]
