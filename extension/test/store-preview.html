<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEXUS — demonstracja panelu na fikcyjnych danych</title>
  <link rel="stylesheet" href="../src/panel/panel.css">
  <style>
    body { display: grid; grid-template-columns: 1fr 450px; background: #eef0ff; padding: 32px; gap: 36px; }
    .intro { padding: 36px 28px 28px 20px; display: flex; flex-direction: column; }
    .intro .brand { font-size: 30px; }
    .eyebrow { margin-top: 54px; font-size: 13px; color: #5145ce; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .intro h1 { font-size: 44px; line-height: 1.12; letter-spacing: -.04em; max-width: 560px; margin: 18px 0 22px; }
    .intro p { font-size: 19px; line-height: 1.5; max-width: 530px; margin: 0; color: #4f5b70; }
    .benefits { display: grid; gap: 14px; margin-top: 32px; font-size: 16px; }
    .benefits div { display: flex; align-items: center; gap: 12px; }
    .number { display: inline-grid; place-items: center; width: 29px; height: 29px; border-radius: 50%; background: #dedafa; color: #5145ce; font-size: 13px; font-weight: 700; }
    .intro footer { margin-top: auto; font-size: 12px; color: #637084; }
    .panel { min-height: 0; display: flex; flex-direction: column; border: 1px solid #d8dbea; background: var(--bg); box-shadow: 0 14px 50px #25245619; overflow: hidden; }
    .panel .view { min-height: 0; }
    .demo-label { padding: 6px 14px; font-size: 10px; text-align: center; background: #fff; border-top: 1px solid var(--border); color: var(--muted); }
  </style>
</head>
<body>
  <section class="intro">
    <span class="brand">Nexus<span class="brand__dot">.</span></span>
    <div class="eyebrow">Panel rekrutera na LinkedInie</div>
    <h1 id="title"></h1>
    <p id="lead"></p>
    <div class="benefits" id="benefits"></div>
    <footer>Wymaga konta NEXUS i uprawnień rekrutera.<br>Demonstracja interfejsu na fikcyjnych danych.</footer>
  </section>
  <section class="panel" aria-label="Panel NEXUS">
    <header class="bar">
      <span class="brand">Nexus<span class="brand__dot">.</span></span>
      <span class="user"><span class="avatar">MT</span><span class="user__name">Malwina</span><span class="user__chevron">▾</span></span>
    </header>
    <main class="view" id="view"></main>
    <div class="demo-label">Fikcyjne dane • rzeczywiste komponenty wtyczki</div>
  </section>
  <script type="module" src="store-preview.mjs"></script>
</body>
</html>
