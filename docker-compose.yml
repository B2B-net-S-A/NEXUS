# Base docker-compose for Nexus ATS.
# This file works both for Coolify (Hetzner production) AND local dev.
# - It does NOT publish ports (Coolify routes traffic via its internal Traefik).
# - For local dev, `docker-compose.override.yml` re-adds host port bindings and
#   is loaded automatically by `docker compose up`.
# - For explicit production tuning (resource limits, healthchecks), overlay
#   `docker-compose.prod.yml`.
#
# Secrets are read from .env (see .env.example). Never commit the real .env.

# Standardized log driver — bounded rotation + tag consumed by Grafana Alloy
# (~/.claude/rules/deployment.md + observability rollout plan). Tag emits
# the `service`/`app` Loki label so LogQL can filter per-container.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"
    tag: "{{.ImageName}}/{{.Name}}/{{.ID}}"

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  args:
    GIT_SHA: ${GIT_SHA:-unknown}
    BUILT_AT: ${BUILT_AT:-unknown}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    logging: *default-logging

  # One-shot schema owner. A non-zero Alembic exit blocks `backend` through
  # `service_completed_successfully`; the web process never runs DDL itself.
  migrate:
    build: *backend-build
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  backend:
    build: *backend-build
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override endpoints to point at the compose service names.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    expose:
      - "8000"
    # Docker liveness is process-only.  Release promotion separately validates
    # `/api/health` readiness and therefore never restarts a live process just
    # because PostgreSQL/Qdrant has a transient dependency incident.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/livez"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/tmp/nexus/uploads
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SESSION_COOKIE_PREFIX: ${NEXT_PUBLIC_SESSION_COOKIE_PREFIX:-nexus}
        # Sentry build-time args. DSN is public (browser bundle); auth token is
        # public and safe to inline. The private auth token is supplied below
        # as a BuildKit secret and never becomes a Docker ARG/ENV.
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-unknown}
      secrets:
        - sentry_auth_token
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_SESSION_COOKIE_PREFIX: ${NEXT_PUBLIC_SESSION_COOKIE_PREFIX:-nexus}
      # Server-side (RSC) fetches need the compose-internal URL. Browser
      # requests continue to use NEXT_PUBLIC_API_URL (inlined at build time).
      INTERNAL_API_URL: http://backend:8000
      # Sentry runtime envs (server-side, NOT NEXT_PUBLIC_). DSN unset = SDK no-op.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    expose:
      - "3000"
    depends_on:
      - backend
    logging: *default-logging

  # Grafana Alloy log shipper. Profile-gated so this PR is safe to merge
  # before Grafana Cloud credentials land in Coolify env vault. Once
  # GRAFANA_LOKI_* are set, flip COMPOSE_PROFILES=observability and Alloy
  # boots up. See ~/.claude/rules/observability.md.
  alloy:
    image: grafana/alloy:latest
    container_name: nexus-alloy
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER}
      GRAFANA_LOKI_TOKEN: ${GRAFANA_LOKI_TOKEN}
      HOSTNAME: ${ALLOY_HOSTNAME:-nexus-prod}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:

secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN
