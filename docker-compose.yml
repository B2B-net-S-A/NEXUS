services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dynaminds
      POSTGRES_PASSWORD: dynaminds
      POSTGRES_DB: dynaminds
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynaminds"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6340:6333"
      - "6341:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://dynaminds:dynaminds@postgres:5432/dynaminds
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      DEBUG: "false"
      SECRET_KEY: dynaminds-ats-b2bnet-2026-jarvis-secret-key-change-in-prod
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      CORS_ORIGINS: '["http://localhost:3001","http://localhost:8000","http://frontend:3000"]'
      FIREFLIES_API_KEY: "5d18f533-cedf-4bfd-865d-e2cda3d9a373"
      VOYAGE_API_KEY: "pa-AUA3I7fqhrMi2J7UdrTmNzgUwxbiq_TrlcU-wPGqiM1"
      VOYAGE_MODEL: "voyage-3"
      EMBEDDING_DIMENSION: "1024"
      QDRANT_COLLECTION: "nexus_candidates"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/tmp/dynaminds/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
