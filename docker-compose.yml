# Base docker-compose for Nexus ATS.
# This file works both for Coolify (Hetzner production) AND local dev.
# - It does NOT publish ports (Coolify routes traffic via its internal Traefik).
# - For local dev, `docker-compose.override.yml` re-adds host port bindings and
#   is loaded automatically by `docker compose up`.
# - For explicit production tuning (resource limits, healthchecks), overlay
#   `docker-compose.prod.yml`.
#
# Secrets are read from .env (see .env.example). Never commit the real .env.

# Standardized log driver — bounded rotation + tag consumed by Grafana Alloy
# (~/.claude/rules/deployment.md + observability rollout plan). Tag emits
# the `service`/`app` Loki label so LogQL can filter per-container.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"
    tag: "{{.ImageName}}/{{.Name}}/{{.ID}}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Strojenie pod hosta prod (CCX33: 8 vCPU / 32 GB RAM, NVMe). Zmierzone 2026-07-20:
    # baza 2583 MB, shared_buffers 128 MB (fabryczne) => mieściło się w nim ~5% bazy,
    # cache hit ratio 83.16% (zdrowy OLTP to 99%+), kontener PG zużywał 208 MiB.
    #
    # Uczciwie o dowodach (po weryfikacji adwersarialnej — nie przeceniaj ich):
    #  - 299 GB zrzutów tymczasowych pochodzi z liczników o NIEZNANYM oknie
    #    (pg_stat_database.stats_reset = NULL, czyli nigdy nie resetowane). Okno
    #    obejmuje jednorazowe operacje masowe (import 49k z Traffit, backfille CV i CC),
    #    więc NIE jest to charakterystyka stanu ustalonego OLTP.
    #  - "host marnuje 25 GB RAM" jest mylące: to page cache systemu, który obsłużył
    #    ~12,8 TB odczytów. Ta pamięć pracuje. Przenosimy jej część bliżej Postgresa,
    #    a nie zagospodarowujemy coś bezczynnego.
    #  - NIE uruchamiaj pg_stat_reset() żeby "zmierzyć efekt" — skasujesz jedyny
    #    istniejący baseline. Zrzuć liczniki do pliku przed jakimkolwiek resetem.
    #
    # UWAGA przy zmianie: to NIE jest zaproszenie do dokładania workerów uvicorna.
    # Backend odpala 24 pętle w tle bezwarunkowo i 22 z nich nie mają leader-election,
    # więc drugi worker = zdublowane maile, alerty i importy. Patrz `entrypoint.sh`
    # (uvicorn bez --workers) oraz `backend/app/main.py` (rejestr background_tasks).
    command:
      - postgres
      - -c
      - shared_buffers=8GB              # było 128MB — cała baza mieści się z zapasem
      - -c
      - effective_cache_size=24GB       # było 4GB — podpowiedź dla planisty, nie alokacja
      - -c
      # było 4MB. UWAGA na arytmetykę: work_mem przydzielany jest PER WĘZEŁ PLANU
      # (każde sortowanie / hash join z osobna), NIE per połączenie — więc "100 połączeń
      # x work_mem" to PODŁOGA zużycia, nie sufit. Przy braku swapu na tym hoście
      # trzymamy się konserwatywnych 16MB zamiast kuszących 32-64MB.
      - work_mem=16MB
      - -c
      - maintenance_work_mem=1GB        # było 64MB — szybszy VACUUM i budowa indeksów
      - -c
      # Bez tego strojenie jest zgadywaniem: pg_stat_statements pokazuje, KTÓRE zapytania
      # zrzucają na dysk. Rozszerzenie jest dostępne w obrazie, ale nie było ładowane.
      # Po deployu jednorazowo: CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
      - shared_preload_libraries=pg_stat_statements
      - -c
      - random_page_cost=1.1            # było 4 (ustawienie dla dysków talerzowych, host ma NVMe)
      - -c
      - effective_io_concurrency=200
      - -c
      - max_connections=100             # bez zmian, jawnie — pula aplikacji to 20+40 na proces
    # Domyślne /dev/shm w Dockerze to 64MB; przy równoległych zapytaniach Postgres
    # potrafi się o to rozbić ("could not resize shared memory segment").
    shm_size: 1gb
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Build metadata for /api/health endpoint (~/.claude/rules/deployment.md).
        # Coolify może ustawić te env vars w resource config (np. SOURCE_COMMIT
        # webhook payload dla GIT_SHA, build-time stamp dla BUILT_AT).
        # Defaultują do "unknown" gdy nie ustawione — endpoint nadal działa.
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override endpoints to point at the compose service names.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/tmp/nexus/uploads
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        # Sentry build-time args. DSN is public (browser bundle); auth token is
        # build-only (stripped from runtime image). Both come from Coolify env
        # vault with is_buildtime=true.
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-unknown}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server-side (RSC) fetches need the compose-internal URL. Browser
      # requests continue to use NEXT_PUBLIC_API_URL (inlined at build time).
      INTERNAL_API_URL: http://backend:8000
      # Sentry runtime envs (server-side, NOT NEXT_PUBLIC_). DSN unset = SDK no-op.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    expose:
      - "3000"
    depends_on:
      - backend
    logging: *default-logging

  # Grafana Alloy log shipper. Profile-gated so this PR is safe to merge
  # before Grafana Cloud credentials land in Coolify env vault. Once
  # GRAFANA_LOKI_* are set, flip COMPOSE_PROFILES=observability and Alloy
  # boots up. See ~/.claude/rules/observability.md.
  alloy:
    image: grafana/alloy:latest
    container_name: nexus-alloy
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER}
      GRAFANA_LOKI_TOKEN: ${GRAFANA_LOKI_TOKEN}
      HOSTNAME: ${ALLOY_HOSTNAME:-nexus-prod}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Off-site backup sidecar. Ships an encrypted copy of Postgres, the uploaded
  # CV files and the Qdrant collections to S3-compatible object storage
  # (Hetzner Object Storage, Germany — same jurisdiction as the VPS, so no
  # extra transfer basis is needed for candidate personal data).
  #
  # Ships disabled: `BACKUP_ENABLED` defaults to false and the script exits
  # immediately, matching the kill-switch convention used by CLOUDTALK_ENABLED
  # and TRAFFIT_SYNC_ENABLED. Activation is one env-var flip in the Coolify
  # vault once the bucket and keys exist — no redeploy of anything else.
  #
  # Why this exists at all: until now the only backup was an unversioned script
  # on the VPS writing to that same VPS's disk, verified by a drill that never
  # ran. See docs/disaster-recovery.md.
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: nexus-backup:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-false}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # Public half of an age key pair. The private half never touches this
      # server, so a compromised sidecar cannot read the backups it writes.
      BACKUP_AGE_PUBLIC_KEY: ${BACKUP_AGE_PUBLIC_KEY:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-eu-central-1}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-nexus}
      BACKUP_QDRANT_URL: ${BACKUP_QDRANT_URL:-http://qdrant:6333}
      BACKUP_UPLOADS_DIR: /data/uploads
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      # Read-only: the sidecar must never be able to modify application data.
      - uploads_data:/data/uploads:ro
    logging: *default-logging

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
