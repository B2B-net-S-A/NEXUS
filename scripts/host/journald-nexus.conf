# NEXUS, decyzja Artura 16.11.2026: journal maks. 1 GB na / (domyślnie 4 GB). Logi aplikacji idą do Loki.
# Na hoście: /etc/systemd/journald.conf.d/nexus.conf. Opis: docs/claude/podstawy/wzrost-danych-na-dysku-root.md
# Cofnięcie: rm tego pliku + systemctl restart systemd-journald.
[Journal]
SystemMaxUse=1G
