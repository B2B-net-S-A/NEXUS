# Reguly NEXUSA (27.11.2026). Dopisuj wyjatki tutaj, nie w falco_rules.yaml z obrazu.
- macro: nexus_app_container
  condition: >
    (container.name startswith backend-ocgkw or container.name startswith postgres-ocgkw or
     container.name startswith worker-ocgkw or container.name startswith cpro-robot-ocgkw or
     container.name startswith qdrant-ocgkw or container.name startswith vkzwwgdlcla78kjkjl8pogg3)

- list: nexus_app_parents
  items: [python, python3, python3.12, python3.13, uvicorn, gunicorn, celery, postgres, node, next-server, qdrant]

# 1. Shell w kontenerze aplikacji: interaktywny (tty) albo uruchomiony przez sam proces aplikacji
#    (typowy objaw RCE). Healthchecki Dockera nie maja tty ani rodzica-aplikacji, wiec nie pasuja.
- rule: NEXUS shell w kontenerze aplikacji
  desc: Shell w kontenerze backendu, workera, frontu albo Postgresa (tty albo rodzic = proces aplikacji)
  condition: >
    spawned_process and container and nexus_app_container and proc.name in (shell_binaries)
    and (proc.tty != 0 or proc.pname in (nexus_app_parents))
  output: >
    Shell w kontenerze aplikacji (kontener=%container.name obraz=%container.image.repository
    proces=%proc.name rodzic=%proc.pname tty=%proc.tty uzytkownik=%user.name cmd=%proc.cmdline)
  priority: WARNING
  tags: [nexus, container, shell, mitre_execution]

# 2. Odczyt sekretow Coolify i kluczy SSH na hoscie przez cos innego niz sshd/Coolify.
- list: nexus_secret_readers
  items: [sshd, sshd-session, php, php-fpm, php-fpm8.4, php8.4, falco, crowdsec, rsync, tar, gzip]

- rule: NEXUS odczyt sekretow Coolify lub kluczy SSH
  desc: Otwarcie do odczytu .env Coolify, kluczy SSH Coolify albo authorized_keys roota
  condition: >
    open_read and (fd.name = /data/coolify/source/.env or fd.name startswith /data/coolify/ssh/keys/
    or fd.name = /root/.ssh/authorized_keys or fd.name startswith /data/coolify/applications/)
    and not proc.name in (nexus_secret_readers)
  output: >
    Odczyt pliku z sekretami (plik=%fd.name proces=%proc.name rodzic=%proc.pname
    uzytkownik=%user.name kontener=%container.name cmd=%proc.cmdline)
  priority: NOTICE
  tags: [nexus, host, secrets, mitre_credential_access]

# 3. Nowy proces nasluchujacy: listen() od procesu spoza znanej listy (np. bind shell, nc -l).
- list: nexus_known_listeners
  items: [uvicorn, python, python3, python3.12, python3.13, gunicorn, postgres, qdrant, node, next-server,
          traefik, php, php-fpm, php-fpm8.4, php8.4, redis-server, sentinel, crowdsec, falco, falcosidekick,
          sshd, docker-proxy, dockerd, containerd, systemd-resolve, systemd, chronyd, nginx, soketi,
          frankenphp, ssh, sshd-session, vector, alloy, wazuh-agentd, wazuh-execd, wazuh-modulesd]

- rule: NEXUS nowy proces nasluchujacy
  desc: Proces spoza listy znanych zaczal nasluchiwac na gniezdzie sieciowym
  condition: >
    evt.type = listen and evt.rawres = 0 and (fd.typechar = 4 or fd.typechar = 6)
    and not proc.name in (nexus_known_listeners)
  output: >
    Nowy proces nasluchujacy (proces=%proc.name port=%fd.sport rodzic=%proc.pname
    kontener=%container.name obraz=%container.image.repository cmd=%proc.cmdline)
  priority: WARNING
  tags: [nexus, network, mitre_command_and_control]
