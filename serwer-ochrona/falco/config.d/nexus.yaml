# Nadpisania falco.yaml dla nexus-prod.
json_output: true
json_include_output_property: true
priority: notice
http_output:
  enabled: true
  url: http://falcosidekick:2801/
webserver:
  enabled: true
  listen_port: 8765
  k8s_healthz_endpoint: /healthz
  prometheus_metrics_enabled: false
# Plik dla agenta Wazuha (27.11.2026, sesja "Serwer bezpieczenstwa"): jedna linia JSON = zdarzenie.
# Na hoscie /var/log/falco/events.json, logrotate /etc/logrotate.d/falco-events.
file_output:
  enabled: true
  keep_alive: false
  filename: /var/log/falco/events.json
