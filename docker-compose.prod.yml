# Production overlay for Nexus ATS.
# Usage (Coolify manages this, but this is the reference):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Secrets come from the managed env (Coolify vault / Docker secrets).
# Ports are NOT exposed — Coolify's Traefik handles reverse proxy + TLS.
services:
  postgres:
    ports: []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  qdrant:
    ports: []
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  backend:
    ports: []
    environment:
      DEBUG: "false"
      SENTRY_ENVIRONMENT: production
    healthcheck:
      # /api/health = standard shape per ~/.claude/rules/deployment.md.
      # /health zachowane jako alias przez 7 dni dla uptime-probe.yml legacy.
      # start_interval=2s → kontener zostaje `healthy` ~2s po gotowości uvicorna
      # (nie czeka pełnego start_period), więc Coolify szybko przełącza proxy i
      # okno „no available server" przy deployu jest krótkie. start_period=60s =
      # zapas na `alembic upgrade head` uruchamiany w entrypoint na starcie.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  frontend:
    ports: []
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
