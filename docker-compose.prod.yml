# Production overlay for Nexus ATS.
# Usage (Coolify manages this, but this is the reference):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Secrets come from the managed env (Coolify vault / Docker secrets).
# Ports are NOT exposed — Coolify's Traefik handles reverse proxy + TLS.
services:
  postgres:
    ports: []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  qdrant:
    ports: []
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  backend:
    ports: []
    environment:
      DEBUG: "false"
      SENTRY_ENVIRONMENT: production
    healthcheck:
      # Liveness checks only the process. Deployment readiness separately calls
      # /api/health and fails closed on PostgreSQL or Qdrant.
      # start_interval=2s → kontener zostaje `healthy` ~2s po gotowości uvicorna.
      # Migracje wykonał wcześniej osobny one-shot service `migrate`; start_period
      # pokrywa wyłącznie bounded read-only head gate i startup aplikacji.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/livez"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  migrate:
    environment:
      DEBUG: "false"
      SENTRY_ENVIRONMENT: production
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 128M

  frontend:
    ports: []
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
