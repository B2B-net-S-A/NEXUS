# Pre-commit hooks for Nexus ATS.
# Install: pre-commit install
# Run manually: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: no-dynaminds-branding
        name: "Reject lingering DynaMinds branding in code"
        language: pygrep
        entry: 'DynaMinds|dynaminds(?!-theme-key-legacy)'
        files: \.(py|ts|tsx|js|json|yml|yaml|sh|Dockerfile|md)$
        exclude: '^(README\.md|NEXUS_AUDIT_AND_PLAN\.md|REQUIREMENTS_V[0-9]+\.md|QA_STRATEGY\.md|frontend/package-lock\.json)$'
