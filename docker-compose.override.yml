# Local development overrides — loaded automatically by `docker compose up`.
# Re-publishes host ports so you can curl localhost:8000 etc.
# NOT used by Coolify (Coolify only reads docker-compose.yml + optionally prod overlay).
services:
  postgres:
    ports:
      - "5433:5432"

  qdrant:
    ports:
      - "6340:6333"
      - "6341:6334"

  backend:
    ports:
      - "8000:8000"

  frontend:
    ports:
      - "3001:3000"
