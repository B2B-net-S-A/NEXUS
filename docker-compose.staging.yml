# Stały staging NEXUSA na laptopie (docs/staging-laptop-plan.md, etap 1).
#
# Inaczej niż docker-compose.e2e.yml (jednorazowy, tmpfs, dane demo) ten stos
# trzyma PEŁNĄ KOPIĘ PRODUKCJI na trwałych wolumenach. Dlatego:
#   - backend startuje z NEXUS_ENV=staging: pętle w tle domyślnie stoją,
#     a połączenia wychodzą tylko do sieci lokalnej i dostawców AI
#     (`backend/app/core/staging.py`);
#   - poczta idzie do Mailpita (http://localhost:8125), dokumenty do lokalnego S3 (versitygw);
#   - porty są wystawione wyłącznie na 127.0.0.1 — nie na sieć Wi-Fi;
#   - sekrety stagingu leżą w `.env.staging.local` (gitignore `.env.*.local`),
#     wzór w `scripts/staging/env.staging.example`.
#
# Obrazy budują się z TYCH SAMYCH Dockerfile'i co na produkcji, a entrypoint
# puszcza `alembic upgrade heads` — czyli dzisiejsze migracje biegną na kopii
# wczorajszej produkcji, zanim pójdą na prawdziwą.
#
# Użycie:
#   scripts/staging/restore_from_backup.sh     # kopia produkcji → wolumeny
#   docker compose -f docker-compose.staging.yml --env-file .env.staging.local up -d --build
#   front http://localhost:3100 · API http://localhost:8100 · poczta http://localhost:8125
name: nexus-staging

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Ten sam tag co produkcja — od niego zależy porządek sortowania tekstu
    # (komentarz w docker-compose.yml). Inny obraz = inne indeksy.
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 8g
    # Przy braku pamięci w całej maszynie Dockera jądro zabija proces z największym
    # RSS, a każdy proces Postgresa liczy w nim 2 GB shared_buffers, choć prywatnie
    # ma kilka MB. 24.11.2026 dwa takie zabicia (global_oom) przerwały staging, kopie
    # nocne i przebiegi poczty. Limit 8g dalej łapie Postgresa, który urośnie sam.
    # → docs/claude/podstawy/staging-na-laptopie.md
    oom_score_adj: -500
    shm_size: 1gb
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      # Backendy sesji na gałęziach dzielą ten serwer: 02.11.2026 osiem wyczerpało domyślne 100.
      - -c
      - max_connections=200
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required (.env.staging.local)}
      POSTGRES_DB: nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    mem_limit: 3g
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6335:6333"
    logging: *default-logging

  # Magazyn dokumentów kandydatów (na produkcji Hetzner Object Storage).
  # versitygw `posix`: bucket = katalog, obiekt = zwykły plik, więc kopia
  # z backupu to po prostu pliki w wolumenie. MinIO nie wydaje już obrazów.
  s3:
    image: versity/versitygw:v1.8.0
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --access
      - ${STAGING_S3_ACCESS_KEY:?STAGING_S3_ACCESS_KEY required (.env.staging.local)}
      - --secret
      - ${STAGING_S3_SECRET_KEY:?STAGING_S3_SECRET_KEY required (.env.staging.local)}
      - --port
      - :7070
      - posix
      - /data
    volumes:
      - s3_data:/data
    ports:
      - "127.0.0.1:7170:7070"
    logging: *default-logging

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:8125:8025"
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-staging}
        BUILT_AT: ${BUILT_AT:-staging}
    restart: unless-stopped
    mem_limit: 4g
    env_file:
      - .env.staging.local
    environment: &backend-environment
      NEXUS_ENV: staging
      # SSH clone uses a new nexus_staging_* DB. The bootstrap/offsite default
      # remains nexus; select the successfully restored DB before starting app.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${STAGING_DATABASE_NAME:-nexus}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      # 3101 = front z gałęzi (`npm run dev`) na danych stagingu — wariant „po”
      # w makietach, docs/claude/ui/makiety-na-stagingu.md
      CORS_ORIGINS: '["http://localhost:3100", "http://localhost:3101"]'
      PUBLIC_BASE_URL: http://localhost:3100
      PUBLIC_API_BASE_URL: http://localhost:8100
      OBJECT_STORAGE_ENDPOINT: http://s3:7070
      OBJECT_STORAGE_ACCESS_KEY: ${STAGING_S3_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${STAGING_S3_SECRET_KEY}
      OBJECT_STORAGE_BUCKET: nexus-candidate-documents
      # Poczta: wszystko do Mailpita, bez TLS (lokalna skrzynka testowa).
      SMTP_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_USE_TLS: "false"
      SMTP_REQUIRE_TLS: "false"
      M365_APP_MAIL_ENABLED: "false"
      # Druga warstwa za zaporą wyjścia: integracje wyłączone też flagami,
      # żeby ekrany mówiły „wyłączone”, a nie sypały błędami połączenia.
      M365_INTEGRATION_ENABLED: "false"
      TRAFFIT_SYNC_ENABLED: "false"
      ORDER_MAIL_INGEST_ENABLED: "false"
      AUTENTI_ENABLED: "false"
      JJIT_ENABLED: "false"
      # JustJoin.IT w oknie „Ogłoszenie” jak na produkcji. Publikacji nie będzie:
      # `job_portal_worker` stoi, a host portalu jest poza listą wyjścia.
      PORTAL_JJIT_ENABLED: "true"
      PROXYCURL_ENABLED: "false"
      # Moduł „Ludzie” widoczny jak na produkcji, pętle zatrzymane wierszem niżej.
      HR_PROGRAM_ENABLED: "true"
      HR_LOOPS_ENABLED: "false"
      # Ekran „Przepisy” jak na produkcji (decyzja Artura z 23.11.2026), bo tester
      # nocny nie przechodził obszaru 14. Pętla `law_radar` stoi w `STAGING_BLOCKED_TASKS`.
      LAW_RADAR_ENABLED: "true"
      SELF_REGISTRATION_ENABLED: "false"
      PASSWORD_LOGIN_ENABLED: "true"
      SLACK_WEBHOOK_URL: ""
      SENTRY_DSN: ""
      SENTRY_ENVIRONMENT: staging
      UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN: "8"
      NEXUS_PROCESS_ROLE: ${NEXUS_BACKEND_PROCESS_ROLE:-web}
      # Ranking jak na produkcji, bo wnioski ze stagingu idą do decyzji Artura.
      # Trzy pierwsze wchodzą do stempla `ranker_version`; bez nich wyniki różniły
      # się do 22 pkt. Reszta zmienia pulę i kolejność, a stempla nie, więc ich
      # rozjazdu strażnik `scripts/staging_ranking_parity.py` nie zobaczy.
      # `MATCH_POOL_SIZE` to ta sama wartość co domyślna w `config.py`; wpis zostaje,
      # żeby pomiar drugiej puli (`-e MATCH_POOL_SIZE=...`) miał jedno miejsce odniesienia.
      CHAMPION_MATCH_SIGNALS_ENABLED: ${CHAMPION_MATCH_SIGNALS_ENABLED:-true}
      CHAMPION_SENIORITY_PENALTY_ENABLED: ${CHAMPION_SENIORITY_PENALTY_ENABLED:-true}
      SKILL_ALIAS_EXTENDED_ENABLED: ${SKILL_ALIAS_EXTENDED_ENABLED:-true}
      HYBRID_POOL_ENABLED: ${HYBRID_POOL_ENABLED:-true}
      KNOWN_PEOPLE_BOOST_ENABLED: ${KNOWN_PEOPLE_BOOST_ENABLED:-true}
      KEYWORD_SEARCH_FOLDED_FTS: ${KEYWORD_SEARCH_FOLDED_FTS:-true}
      MATCH_POOL_SIZE: ${MATCH_POOL_SIZE:-2000}
      # Reszta `_SCORING_CACHE_INPUTS`: wartość z produkcji zapisuje co noc
      # `scripts/staging/nightly_sync.py` w `.env.staging-flags.local`. Bez tego
      # pliku obowiązuje wartość domyślna z `config.py`. Przełączniki integracji
      # wyżej są na sztywno, więc nocna kopia flag ich nie włączy.
      CHAMPION_AVAILABILITY_FALLBACK_ENABLED:
      CHAMPION_AVAILABILITY_CONFLICT_ENABLED:
      AI_SCORING_CONTRACT_V2:
      AI_SCORING_SKILL_RECENCY:
      VOYAGE_MODEL:
      SEMANTIC_CALIBRATION_GAMMA:
      SCORE_UNKNOWN_NEUTRAL_FRACTION:
      AI_TEXT_SCHEMA_V2:
      AI_TEXT_SCHEMA_V3:
      QDRANT_COLLECTION:
      SCORE_RENORMALIZE_UNSCORED_LAYERS:
      CV_PASSAGES_ENABLED:
      # Adapter wektora zapytania, poza `_SCORING_CACHE_INPUTS`. Włączony zmienia
      # kolejność i stempel `ranker_version`.
      QUERY_ADAPTER_ENABLED:
      # Listy klientów, też z produkcji i przez ten sam plik: decydują, co widać
      # na karcie klienta. Bez nich stare zamówienia bez `order_type` są ukryte.
      MULTI_CONSULTANT_ORDER_CLIENT_IDS:
      COST_ORDER_CLIENT_IDS:
      EXTENDED_ORDER_ALERT_CLIENT_IDS:
      # Sprzedaż (karta firmy, zadania bota, rejestry MF i KRS), też z produkcji.
      # Pętla `sales_signals` stoi na stagingu, więc zmieniają tylko trasy.
      SALES_BOT_TASKS_ENABLED:
      SALES_REGISTRY_ENABLED:
      # Dzienny limit próśb o warunki od kandydata, też z produkcji (20, decyzja
      # Artura z 19.11.2026). Pętla wysyłki stoi na stagingu, więc limit zmienia
      # tylko liczby kolejki warunków.
      CANDIDATE_TERMS_DAILY_LIMIT:
      # Pozostałe flagi `*_ENABLED`, też z produkcji (decyzja Artura z 25.11.2026,
      # po rozjeździe `CV_NEW_LAYOUT_ENABLED`). Pętle i wysyłki z `FORBIDDEN_FLAGS`
      # w `nightly_sync.py` tu nie wchodzą; ich pętle trzyma `STAGING_BLOCKED_TASKS`.
      RERANKER_ENABLED:
      AI_MATCH_TELEMETRY_ENABLED:
      AI_INDEX_OUTBOX_ENABLED:
      AI_INDEX_WORKER_ENABLED:
      AI_INDEX_RECONCILER_ENABLED:
      MULTI_QUERY_RETRIEVAL_ENABLED:
      EXPERIENCE_DATES_ON_DEMAND_ENABLED:
      CV_CENTRAL_POLICIES_ENABLED:
      CV_INTERACTIVE_ENABLED:
      CV_NEW_LAYOUT_ENABLED:
      CV_JOB_INPUT_RETENTION_ENABLED:
      STRUCTURED_POOL_ENABLED:
      RUBRIC_DEALBREAKERS_ENABLED:
      PRIOR_SCREENING_LAYER_ENABLED:
      TALENT_RADAR_STRUCTURED_SKILLS_ENABLED:
      FRAMEWORK_CONTRACT_EMBEDDINGS_ENABLED:
      CV_ENRICHMENT_ENABLED:
      FROM_CV_SIEVE_ENABLED:
      CV_PARSER_BATCH_ENABLED:
      AUTO_MATCH_ENABLED:
      AUTO_MATCH_WRITE_POOL_ENABLED:
      AUTO_FULL_REVIEW_ENABLED:
      AUTO_FULL_REVIEW_DAYTIME_FIRST_ENABLED:
      NEW_COLUMN_AUTOFILL_ENABLED:
      NEW_COLUMN_FRESH_FIRST_ENABLED:
      REVIEW_BATCH_ENABLED:
      NEW_COLUMN_TEMPO_TARGET_ENABLED:
      SINGLE_CANDIDATE_LIST_ENABLED:
      CV_CONSENT_DOWNLOAD_GATE_ENABLED:
      CV_QC_GATE_ENABLED:
      CV_SELECTION_AI_ENABLED:
      CV_EDITOR_COMMAND_ENABLED:
      VERIFIED_GATE_ENABLED:
      VERIFIED_MINIMUM_FIELDS_ENABLED:
      CLIENT_FORM_QC_GATE_ENABLED:
      JARVIS_ENABLED:
      APPLICATION_SCREENING_ENABLED:
      RECOMMENDATION_CARD_IMPORT_ENABLED:
      RECOMMENDATION_CARD_ASSIST_ENABLED:
      SCREENING_NOTE_SYNC_ENABLED:
      SCREENING_NOTE_SYNC_OTHER_NOTES_ENABLED:
      CANDIDATE_RATE_FROM_ENABLED:
      JARVIS_WEB_ENABLED:
      PLAIN_KNOWLEDGE_WEB_ENABLED:
      MY_PEOPLE_MATCH_ENABLED:
      ORDER_EXTRACTION_ENABLED:
      SERVICE_ACCOUNTS_ENABLED:
      LINKEDIN_EXTENSION_ENABLED:
      MARKETPLACE_ENABLED:
      SIMILAR_JOB_NOTIFY_ENABLED:
      JOB_DEADLINE_ALERTS_ENABLED:
      JOB_IDLE_ENABLED:
      SCREENING_STALE_RETURN_ENABLED:
      SALES_ARCHIVE_SHADOW_ENABLED:
      SALES_BOT_LISTS_ENABLED:
      CONTRACT_RATE_DOCS_READ_ENABLED:
      CONTRACT_RATE_HISTORY_ENABLED:
      MONTH_CHECK_ENABLED:
      CONTRACT_PARTNER_READ_ENABLED:
      RECRUITMENT_ALLOCATION_ENABLED:
      QUEUE_RETENTION_ENABLED:
      NOTES_INSIGHTS_SYNC_ENABLED:
      CONVERSATION_FACTS_ENABLED:
      WEEKLY_EVAL_ENABLED:
      MATCH_DIGEST_ENABLED:
      CANDIDATE_SEARCH_RETENTION_ENABLED:
      CANDIDATE_CONTACT_ENABLED:
      CANDIDATE_CONTACT_ASSIGNMENT_ENABLED:
      CANDIDATE_CONTACT_TRAFFIT_INTAKE_ENABLED:
      CANDIDATE_FOLLOWUP_ENABLED:
      INSIGHTS_SENIORITY_JOURNAL_ENABLED:
      INTEGRATION_STALE_ALERTS_ENABLED:
      DL_ALERTS_ENABLED:
      ACCESS_USAGE_COUNTER_ENABLED:
      ORDER_GAPS_ENABLED:
      LEGAL_CORPUS_EMBEDDINGS_ENABLED:
    volumes:
      - uploads_data:/tmp/nexus/uploads
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_interval: 2s
      start_period: 600s
    logging: *default-logging

  # Pętle w tle osobno, jak na produkcji (`docs/claude/podstawy/web-i-worker-osobno.md`).
  # Na stagingu i tak biegną tylko te z `STAGING_ALLOWED_TASKS`.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-staging}
        BUILT_AT: ${BUILT_AT:-staging}
    restart: unless-stopped
    mem_limit: 4g
    env_file:
      - .env.staging.local
    environment:
      <<: *backend-environment
      NEXUS_PROCESS_ROLE: worker
      WEB_CONCURRENCY: "1"
    volumes:
      - uploads_data:/tmp/nexus/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_interval: 2s
      start_period: 720s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8100
        NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-staging}
        NEXT_PUBLIC_NEXUS_ENV: staging
    restart: unless-stopped
    mem_limit: 1g
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8100
      INTERNAL_API_URL: http://backend:8000
    ports:
      - "127.0.0.1:3100:3000"
    logging: *default-logging

  # Jednorazowe odtworzenie kopii produkcji (scripts/staging/restore_from_backup.sh).
  # Obraz backupu: pg_restore w wersji serwera, age, rclone. Profil `restore`,
  # więc zwykłe `up` go nie startuje.
  restore:
    profiles: ["restore"]
    build:
      context: ./backup
    user: root
    entrypoint: ["/bin/sh", "/staging/restore_inside.sh"]
    env_file:
      - .env.staging.local
    volumes:
      - ./scripts/staging:/staging:ro
      - uploads_data:/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  s3_data:
  uploads_data:
